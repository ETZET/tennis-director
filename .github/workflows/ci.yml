name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 代码规范
        run: pnpm lint
      - name: 分层规则
        run: pnpm check:deps
      - name: 单元测试
        run: pnpm test
      - name: 构建
        run: pnpm build
      - name: 上传 sandbox 构建（预览）
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-dist
          path: apps/sandbox/dist/
