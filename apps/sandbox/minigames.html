<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>小游戏 · Tennis Director</title>
<style>
  html { background: #1e1838; }
  body { margin: 0; min-height: 100dvh; background: #1e1838; color: #fff3d6; font: 700 14px/1.35 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", ui-monospace, monospace; letter-spacing: 1px; -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding: max(22px, calc(env(safe-area-inset-top) + 12px)) max(16px, calc(env(safe-area-inset-right) + 10px)) calc(max(28px, env(safe-area-inset-bottom)) + 12px) max(16px, calc(env(safe-area-inset-left) + 10px)); }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 3px 18px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.1; color: #ffd23c; letter-spacing: 3px; text-shadow: 0 3px 0 #171230; }
  header p { margin: 6px 0 0; font-size: 12px; opacity: 0.75; font-weight: 600; }
  header a { flex: none; display: flex; align-items: center; min-height: 44px; padding: 0 4px; color: #fff3d6; opacity: 0.75; font-size: 12px; text-decoration: none; }
  #list { display: flex; flex-direction: column; gap: 18px; }
  .game { display: flex; align-items: stretch; gap: 12px; min-height: 76px; margin: 3px; padding: 10px 12px 10px 10px; background: #2c2450; color: inherit; text-decoration: none; box-shadow: 3px 0 0 0 #fff3d6, -3px 0 0 0 #fff3d6, 0 3px 0 0 #fff3d6, 0 -3px 0 0 #fff3d6, 0 6px 0 0 #171230, 3px 3px 0 0 #171230, -3px 3px 0 0 #171230; }
  .game:active { transform: translateY(3px); box-shadow: 3px 0 0 0 #fff3d6, -3px 0 0 0 #fff3d6, 0 3px 0 0 #fff3d6, 0 -3px 0 0 #fff3d6, 0 3px 0 0 #171230; }
  .game:focus-visible { outline: 3px solid #ffd23c; outline-offset: 6px; }
  .no { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #2c2450; background: #ffd23c; box-shadow: inset 0 -4px 0 0 #d8a020; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-size: 18px; color: #fff3d6; }
  .scene { font-size: 11px; padding: 1px 6px; color: #2c2450; background: #8fd0e8; }
  .pitch { font-size: 12px; font-weight: 600; opacity: 0.85; }
  .best { display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .stars { color: #ffd23c; letter-spacing: 2px; font-size: 14px; }
  .stars.none { color: #5a5288; }
  .score { opacity: 0.8; }
  .go { flex: none; display: flex; align-items: center; color: #ffd23c; font-size: 18px; }
  .game.soon { opacity: 0.55; }
  .game.soon .go::before { content: "制作中 "; font-size: 11px; color: #fff3d6; white-space: pre; }
  .game.soon .go { font-size: 0; }
  .game.soon .go::before { font-size: 11px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>小游戏</h1>
      <p>总监的十件活 · 每局一两分钟</p>
    </div>
    <a href="./index.html">场景目录</a>
  </header>
  <div id="list"></div>
</main>
<script type="module" src="./src/minigames/hub/main.ts"></script>
</body>
</html>
