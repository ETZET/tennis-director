<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Club Builder（思想实验）· Tennis Director</title>
<style>
  html, body { margin: 0; height: 100%; background: #5fb0e8; overflow: hidden; font: 11px/1.3 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #c2 { display: none; }
  body.gallery #c { inset: 0 0 auto 0; height: 42dvh; }
  body.gallery #c2 { display: block; position: fixed; inset: auto 0 0 0; width: 100vw; height: 58dvh; border-top: 2px solid #1b1410; }
  @media (orientation: landscape) {
    body.gallery #c { inset: 0 auto 0 0; width: 40vw; height: 100dvh; }
    body.gallery #c2 { inset: 0 0 0 auto; width: 60vw; height: 100dvh; border-top: 0; border-left: 2px solid #1b1410; }
  }
  #info { position: fixed; left: 6px; top: 6px; padding: 2px 6px; border-radius: 3px; background: rgba(27, 20, 16, 0.6); color: #f4ead8; pointer-events: none; }
  body:not(.gallery) #info { display: none; }
  /* 游戏 HUD 的样式归 src/clubbuild/hud.css（game.ts import） */
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2"></canvas>
<div id="info"></div>
<div id="hud"></div>
<script type="module" src="./src/clubbuild/main.ts"></script>
</body>
</html>
