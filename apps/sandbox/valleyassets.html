<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Valley Assets · Tennis Director</title>
<style>
  html, body { margin: 0; height: 100%; background: #5fb0e8; overflow: hidden; font: 13px/1.35 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }
  #c { position: fixed; inset: 0 0 auto 0; width: 100vw; height: 42dvh; }
  #c2 { position: fixed; inset: auto 0 0 0; width: 100vw; height: 58dvh; border-top: 2px solid #1b1410; }
  @media (orientation: landscape) {
    #c { inset: 0 auto 0 0; width: 40vw; height: 100dvh; }
    #c2 { inset: 0 0 0 auto; width: 60vw; height: 100dvh; border-top: 0; border-left: 2px solid #1b1410; }
  }
  #info { position: fixed; left: 6px; top: 6px; right: 6px; padding: 3px 6px; border-radius: 3px; background: rgba(27, 20, 16, 0.66); color: #f4ead8; pointer-events: none; font-size: 11px; }
  #ctl { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 320px; }
  #ctl button, #ctl a { min-width: 44px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: #2c2450; color: #fff3d6; font: 700 14px/1 inherit; text-decoration: none; box-shadow: 0 3px 0 #171230; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  #ctl button:active { transform: translateY(2px); box-shadow: 0 1px 0 #171230; }
  body.list { overflow: auto; background: #2c2450; color: #fff3d6; }
  body.list canvas, body.list #ctl, body.list #info { display: none; }
  #list { display: none; padding: max(12px, env(safe-area-inset-top)) 16px 32px; max-width: 720px; margin: 0 auto; }
  body.list #list { display: block; }
  #list h1 { font-size: 18px; margin: 4px 0 4px; }
  #list p { margin: 0 0 12px; opacity: 0.8; font-size: 12px; }
  #list h2 { font-size: 14px; margin: 18px 0 6px; color: #ffd23c; }
  #list a { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 12px; margin: 6px 0; border-radius: 4px; background: #3a3266; color: #fff3d6; text-decoration: none; }
  #list a b { font: 700 13px/1 ui-monospace, monospace; }
  #list a span { font-size: 12px; opacity: 0.85; text-align: right; }
  #list a.drawn { background: #1e5a46; }
  #list a em { font-style: normal; font-size: 11px; padding: 2px 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.3); margin-left: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2"></canvas>
<div id="info"></div>
<div id="ctl"></div>
<div id="list"></div>
<script type="module" src="./src/valley/gallery.ts"></script>
</body>
</html>
