<style>
  :root { color-scheme: light dark; --bg: #f4f1e8; --ink: #1d1c19; --dim: #6b675c; --card: #fff; --line: #d9d3c3; }

  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  a:hover { border-color: var(--dim); }
  a b { display: block; }
  a span { color: var(--dim); font-size: 13px; }
