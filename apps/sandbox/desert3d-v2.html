<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Desert 3D v2 · Tennis Director</title>
<style>
  html, body { margin: 0; height: 100%; background: #5fb0e8; overflow: hidden; font: 11px/1.3 system-ui, sans-serif; }
  canvas { display: block; touch-action: none; image-rendering: pixelated; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
  #c2 { display: none; }
  body.gallery #c { inset: 0 0 auto 0; height: 42dvh; }
  body.gallery #c2 { display: block; position: fixed; inset: auto 0 0 0; width: 100vw; height: 58dvh; border-top: 2px solid #1b1410; }
  @media (orientation: landscape) {
    body.gallery #c { inset: 0 auto 0 0; width: 40vw; height: 100dvh; }
    body.gallery #c2 { inset: 0 0 0 auto; width: 60vw; height: 100dvh; border-top: 0; border-left: 2px solid #1b1410; }
  }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lab { position: absolute; left: 0; top: 0; padding: 1px 4px; border-radius: 3px; background: rgba(40, 36, 60, 0.75); color: #e8e4f0; white-space: nowrap; font-size: 10px; }
  .lab.real { background: rgba(30, 90, 70, 0.75); }
  #info { position: fixed; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 3px; background: rgba(27, 20, 16, 0.6); color: #f4ead8; pointer-events: none; }
  body.gallery #info { top: 6px; bottom: auto; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font: 700 15px/1 ui-monospace, monospace; color: #fff8e8; text-shadow: 0 2px 0 #3e3070, 2px 0 0 #3e3070, -2px 0 0 #3e3070, 0 -2px 0 #3e3070; pointer-events: none; letter-spacing: 1px; }
  #hud:empty { display: none; }
  /* ── 玩法模式（hud.ts）：奶油字 + 深靛底 + 一格一格的像素边 ── */
  body.play #hud { top: calc(max(8px, env(safe-area-inset-top)) + 40px); font-size: 13px; }
  .play-root { position: fixed; inset: 0; pointer-events: none; font: 700 14px/1 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", ui-monospace, monospace; color: #fff3d6; letter-spacing: 1px; -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .play-root [hidden] { display: none !important; }
  .play-bar, .play-btn, .play-bubble, .play-hint {
    background: #2c2450;
    box-shadow: 3px 0 0 0 #fff3d6, -3px 0 0 0 #fff3d6, 0 3px 0 0 #fff3d6, 0 -3px 0 0 #fff3d6, 0 6px 0 0 #171230, 3px 3px 0 0 #171230, -3px 3px 0 0 #171230;
  }
  .play-bar { position: absolute; top: max(11px, calc(env(safe-area-inset-top) + 3px)); left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
  .play-bar b { color: #ffd23c; font-size: 14px; margin-left: 3px; }
  .play-hint { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 4px); padding: 7px 10px; font-size: 12px; opacity: 0.92; transition: opacity 0.8s; }
  .play-hint.gone { opacity: 0; }
  .play-joy { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .play-joy::before, .play-knob { content: ""; position: absolute; border-radius: 50%; }
  .play-joy::before { left: -56px; top: -56px; width: 112px; height: 112px; background: rgba(44, 36, 80, 0.45); box-shadow: inset 0 0 0 3px rgba(255, 243, 214, 0.8); }
  .play-knob { left: -24px; top: -24px; width: 48px; height: 48px; background: #fff3d6; box-shadow: inset 0 -5px 0 0 #d8b088, 0 4px 0 0 #171230; }
  .play-buttons { position: absolute; right: max(18px, calc(env(safe-area-inset-right) + 6px)); bottom: max(22px, calc(env(safe-area-inset-bottom) + 8px)); display: flex; flex-direction: column; align-items: flex-end; gap: 18px; pointer-events: none; }
  .play-btn { pointer-events: auto; border: 0; margin: 3px; color: #fff3d6; font: inherit; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .play-btn.down { transform: translateY(3px); box-shadow: 3px 0 0 0 #fff3d6, -3px 0 0 0 #fff3d6, 0 3px 0 0 #fff3d6, 0 -3px 0 0 #fff3d6, 0 3px 0 0 #171230; }
  .play-ctx { min-height: 50px; min-width: 50px; padding: 0 14px; font-size: 15px; }
  .play-act { width: 82px; height: 82px; font-size: 24px; background: #c0545a; }
  .play-act.on { background: #f07c4c; }
  .play-bubbles { position: absolute; inset: 0; }
  .play-bubble { position: absolute; left: 0; top: 0; padding: 4px 7px; font-size: 12px; color: #2c2450; background: #fff3d6; box-shadow: 2px 0 0 0 #2c2450, -2px 0 0 0 #2c2450, 0 2px 0 0 #2c2450, 0 -2px 0 0 #2c2450; white-space: nowrap; }
  .play-bubble.edge { opacity: 0.85; background: #ffd23c; }
  .pxsel { position: fixed; left: max(12px, calc(env(safe-area-inset-left) + 4px)); top: max(12px, calc(env(safe-area-inset-top) + 4px)); z-index: 5; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font: 700 13px/1 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", ui-monospace, monospace; color: #fff3d6; letter-spacing: 1px; }
  .pxsel button { border: 0; margin: 3px; color: #fff3d6; font: inherit; cursor: pointer; background: #2c2450; -webkit-tap-highlight-color: transparent; box-shadow: 3px 0 0 0 #fff3d6, -3px 0 0 0 #fff3d6, 0 3px 0 0 #fff3d6, 0 -3px 0 0 #fff3d6, 0 6px 0 0 #171230; }
  .pxsel button:focus-visible { outline: 3px solid #ffd23c; outline-offset: 4px; }
  .px-chip { min-height: 44px; padding: 0 12px; }
  .px-list { display: flex; flex-direction: column; gap: 10px; }
  .px-list[hidden] { display: none; }
  .px-list button { min-height: 44px; min-width: 104px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .px-list button span { font-size: 11px; opacity: 0.75; }
  .px-list button[aria-pressed="true"] { background: #fff3d6; color: #2c2450; }
  body.gallery .pxsel { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2"></canvas>
<div id="labels"></div>
<div id="info"></div>
<div id="hud"></div>
<div id="play"></div>
<div id="pxsel" class="pxsel"></div>
<script type="module" src="./src/desert3d-v2/main.ts"></script>
</body>
</html>
