# Palm Oasis Racquet Club（Indian Wells, CA）：整局唯一的地图（2026-11-02 照参考图重排，ADR 0018）。开局是废弃的，总监和 Dale 是这里仅有的两个人。
# 修好一处设施就开出新的岗位（ADR 0015）；修好中心球场、办成一场表演赛就通关。
# 设施 id 沿用原来的：stadium_1 中心球场、practice 青训、outer_1 会员双打、outer_23 红土、
# clubhouse 会所、plaza 棕榈喷泉、stadium_3 匹克球、stadium_2 泳池。
id: indian_wells
start: { day: 1, hour: 8 }
hours: { open: 8, close: 20 }
stats:
  cash: 3000
  reputation: 5
  quality: 10
  members: 0
  service: 50
# 设施开局的状态（facilities.yaml 里每个设施的第一个状态都是废弃的样子）
facilities:
  outer_1: sanded
  outer_23: ruined
  practice: ruined
  clubhouse: ruined
  plaza: dry
  stadium_3: buried
  stadium_2: ruined
  stadium_1: ruined
people:
  # 总监从大门进来；Dale 在会所后面那间办公室里住了十年
  - { id: director, at: entrance }
  - { id: dale, at: clubhouse, head_coach: true }
# 开局的状况（0..100）：废了十年，到处都很差
condition: { outer_1: 10, outer_23: 10, practice: 10, clubhouse: 20, plaza: 15, stadium_3: 5, stadium_2: 10, stadium_1: 5 }
anchors: [entrance, parking, plaza, clubhouse, stadium_1, stadium_2, stadium_3, practice, outer_1, outer_23]
# 步行分钟数：两两之间都有一条边，分钟数按画面里步道的长度换算
# （1.6 米 / 游戏分钟，见 render 的 indianWells.WALK_METERS_PER_MINUTE；game.test 检查两边一致）。
nav:
  - [entrance, parking, 12]
  - [entrance, plaza, 25]
  - [entrance, clubhouse, 66]
  - [entrance, stadium_1, 45]
  - [entrance, stadium_2, 74]
  - [entrance, stadium_3, 26]
  - [entrance, practice, 56]
  - [entrance, outer_1, 56]
  - [entrance, outer_23, 56]
  - [parking, plaza, 37]
  - [parking, clubhouse, 78]
  - [parking, stadium_1, 57]
  - [parking, stadium_2, 86]
  - [parking, stadium_3, 38]
  - [parking, practice, 68]
  - [parking, outer_1, 68]
  - [parking, outer_23, 68]
  - [plaza, clubhouse, 57]
  - [plaza, stadium_1, 36]
  - [plaza, stadium_2, 65]
  - [plaza, stadium_3, 17]
  - [plaza, practice, 47]
  - [plaza, outer_1, 47]
  - [plaza, outer_23, 47]
  - [clubhouse, stadium_1, 32]
  - [clubhouse, stadium_2, 16]
  - [clubhouse, stadium_3, 58]
  - [clubhouse, practice, 43]
  - [clubhouse, outer_1, 43]
  - [clubhouse, outer_23, 43]
  - [stadium_1, stadium_2, 40]
  - [stadium_1, stadium_3, 36]
  - [stadium_1, practice, 22]
  - [stadium_1, outer_1, 22]
  - [stadium_1, outer_23, 22]
  - [stadium_2, stadium_3, 59]
  - [stadium_2, practice, 33]
  - [stadium_2, outer_1, 33]
  - [stadium_2, outer_23, 33]
  - [stadium_3, practice, 32]
  - [stadium_3, outer_1, 32]
  - [stadium_3, outer_23, 32]
  - [practice, outer_1, 5]
  - [practice, outer_23, 5]
  - [outer_1, outer_23, 5]
seasons:
  - { id: autumn, from_day: 1, decay: 1 }
  # 冬天游客最多，风小，设施掉得慢一点
  - { id: winter, from_day: 36, decay: 0.8 }
  # 春天是风季：大风扬沙，没人管的场地坏得更快
  - { id: spring, from_day: 71, decay: 1.3 }
weather:
  autumn: { sun: 6, cloud: 2, rain: 0.3, wind: 1.5 }
  winter: { sun: 5, cloud: 3, rain: 1, wind: 1 }
  spring: { sun: 5, cloud: 1, rain: 0.2, wind: 3 }
start_cards: [iw_arrival]
# 星级（ADR 0020，LG-10，GM-9）：第 i 项是升到 ★(i+1) 的清单，全部满足才升，只往上不往回掉。
# 条 id 的文案在 stars.items.<id>，opens 的文案在 stars.opens.<键>。
# 橡皮筋：第 12 周（第 78 天）起 ★3、★4 的会员和声望门槛 ×0.8；★4 的"办成过邀请赛"也可以用"奖杯 ≥ 4"代替。
# 校准目标（设计文档"怎么算做成了"）：good / average / novice 到 ★3 的中位约第 50 / 58 / 66 天；结果见 docs/balance/indian-wells.md。
# GM-9 校准：设计表的初值（★3 修好 5 处、声望 30；★4 声望 50）让三档机器人都在第 40–52 天到 ★3（会员、声望、修好 5 处
# 第 30–45 天就齐了，只剩奖杯卡着）；改成 ★3 修好 6 处、声望 45，★4 声望 60。
# 校准用 sim-cli 的普通玩家机器人 good / average / novice（humanBot，HUMAN_TIERS 0.85 / 0.5 / 0.15）；greedy、cautious 每个 tick 都排人，
# 不像真人，只看平衡闸口。200 局：★3 中位第 49 / 54 / 58 天，★4 第 60 / 65 / 68 天。
stars:
  # ★1 能打球了
  - requires:
      court: { any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }] }
      members_5: { stat: members, gte: 5 }
    opens: [internal_cup]
  # ★2 会所开张
  - requires:
      clubhouse: { facility: clubhouse, is: open }
      restored_3: { expr: "restored >= 3" }
      members_20: { stat: members, gte: 20 }
      cup_once: { flag: hosted_cup }
    opens: [regional]
  # ★3 社区俱乐部
  - requires:
      restored_6: { expr: "restored >= 6" }
      members_45: { expr: "stat.members >= (day >= 78 ? 36 : 45)" }
      rep_45: { expr: "stat.reputation >= (day >= 78 ? 36 : 45)" }
      trophies_2: { expr: "trophies >= 2" }
    opens: [invitational, sponsor, exhibition_prep]
  # ★4 度假名园
  - requires:
      restored_7: { expr: "restored >= 7" }
      members_70: { expr: "stat.members >= (day >= 78 ? 56 : 70)" }
      rep_60: { expr: "stat.reputation >= (day >= 78 ? 48 : 60)" }
      invitational: { any: [{ flag: hosted_invitational }, { expr: "day >= 78 && trophies >= 4" }] }
    opens: [exhibition]
  # ★5 沙漠名园
  - requires:
      exhibition: { flag: exhibition_done }
    opens: [finale]
# 投资方给了 16 周：第 13 周来看一次进度，第 112 天收盘前还没办成表演赛就停工
calendar:
  - { day: 85, hour: 10, card: iw_investor_check }
  - { day: 112, hour: 18, card: iw_deadline }
director_config: steady
rules:
  # 质量每 10 分钟向目标靠近。目标拆成几项（文案在 ui.terms.*），周结算讲得出质量为什么涨、为什么掉（GM-1）：
  # 修好的设施（废墟是负的）、开着的场地、本周服务率（还没有客人时是 0）、主教练（总监在同一个地点时他才专心）、器材
  quality_target:
    base: "10"
    facilities: facility_quality
    courts: courts_open * 2
    service: stat.service * 0.2
    coach: coach.skill * 0.15 * coach.attention
    gear: "flag.ball_machine ? 4 : 0"
  quality_rate: 0.15
  # 会员和声望每周日收盘结算一次（准则 6），写成一条周结算日志。service_rate 是这一周的服务率，
  # service_demand 是这一周有没有需求：还没有一个开放的岗位时，没有客人，也就没有口碑——服务项和质量项都不算（不倒扣）。
  week:
    service_pass: 0.5
    reputation:
      service: service_demand * (service_rate - service_pass) * 2
      quality: service_demand * (stat.quality - 50) / 25
      restored: restored * 0.15
    members: >-
      max(0, round(courts_built * service_rate + service_demand * ((stat.quality - 30) / 12 + stat.reputation / 30)))
    # 会员有上限：每块修好的场地撑得起 12 个会员（下雨天场地关门，但会员不会因此退会），会所开了再多 15 个；超出的人周末就不续了
    # 会所修成咖啡吧（GM-13）多撑 10 个：有地方坐、有东西吃，会员才愿意续；理疗室（和没选过变体的旧存档）还是 15
    member_cap: >-
      courts_built * 12 + (facility.clubhouse == "open" ? (variant.clubhouse == "cafe" ? 25 : 15) : 0)
  dues_week: 12
  derived:
    service: round(service_rate * 100)
    # 复原进度：八处设施修好了几处（HUD 上的"复原"）
    restoration: restored
  lose_if:
    when: { stat: cash, lt: -2000 }
    ending: bankrupt
  # 掉档（准则 6）：周日收盘时状况低于 15 的设施掉一档（facilities.yaml 的 drops_to）。
  # 先有画面信号（状况低于 60 起积沙、杂草），低于 30 质量减半、快讯提醒，周六收盘再提醒一次，周日才掉。
  grade_drop_below: 15
  director_growth: 0.3
  director_skill_cap: 80
daily: []
