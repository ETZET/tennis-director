# 第一幕 · Hollow Creek：救活（招人和排人，ADR 0012）。
# 6 周：夏末（第 1–3 周）到初秋（第 4–6 周）。第 42 天下午董事会表决。
# 俱乐部变好靠你把人（总监也算一个）拖到岗位和工单上；开局只有总监和 Dale。事件是偶发的。
id: hollow_creek
start: { day: 1, hour: 8 }
hours: { open: 8, close: 20 }
stats:
  cash: 1800
  reputation: 35
  quality: 44
  members: 47
  pickleball_pressure: 30
  board_support: 30
  service: 50
facilities:
  court_1: worn
  court_2: rented_pickleball
  bubble: collapsed
  clay: overgrown
  pool: open
people:
  - { id: director, at: deck }
  # Dale 开局坐在 1 号场青少年课的位子上；总监在露台上闲着，等你拖
  - { id: dale, at: court_1, head_coach: true, job: c1_lesson }
  - { id: tyler, at: court_1 }
  - { id: mason, at: court_1 }
# 开局时各设施的状况（0..100）；不写的是 100
condition: { court_1: 70, court_2: 80 }
anchors: [deck, court_1, court_2, bubble_court, clay_court, lot, pool, creek_bridge]
# 步行分钟数：按画面里的路径长度换算（1.5 米 / 游戏分钟，见 render 的 WALK_METERS_PER_MINUTE）。
# 重派一个人就要走这么久，这是拖动的主要代价。
nav:
  - [deck, court_1, 39]
  - [deck, pool, 13]
  - [deck, lot, 41]
  - [court_1, court_2, 10]
  - [court_2, lot, 28]
  - [court_1, creek_bridge, 15]
  - [court_2, creek_bridge, 15]
  - [creek_bridge, bubble_court, 9]
  - [creek_bridge, clay_court, 9]
seasons:
  - { id: late_summer, from_day: 1, decay: 1 }
  # 初秋落叶多，没人管的场地变旧得更快
  - { id: early_autumn, from_day: 22, decay: 1.4 }
weather:
  late_summer: { sun: 5, cloud: 3, rain: 1.5, wind: 0.5 }
  early_autumn: { sun: 3, cloud: 3, rain: 2.5, wind: 1.5 }
start_cards: []
calendar:
  - { day: 1, hour: 15.5, card: hc_dale_phone }
  - { day: 3, hour: 10, card: hc_board_memo }
  - { day: 6, hour: 10, card: hc_hiring_day }
  - { day: 20, hour: 10, card: hc_hiring_day_2 }
  - { day: 21, hour: 11, card: hc_board_chair }
  - { day: 21, hour: 17, card: hc_pool_closes }
  - { day: 35, hour: 10, card: hc_community_match }
  - { day: 42, hour: 15, card: hc_board_vote }
director_config: steady
rules:
  # 质量每 10 分钟向目标靠近。目标由你搭起来的东西决定：主教练（总监在同一个地点时他才专心）、
  # 设施（状况低于 30 贡献减半，到 0 归零）、本周服务率，以及买过的器材。
  quality_target: >-
    15 + coach.skill * 0.3 * coach.attention + facility_quality + courts_open * 2 + stat.service * 0.3
    + (flag.ball_machine ? 4 : 0) + (flag.volunteer_helping ? 3 : 0)
  quality_rate: 0.15
  # 会员和声望不实时漂移：每周日收盘按这一周的平均服务率和质量结算一次（准则 6）
  member_drift: >-
    weekday == 6 ? round((service_rate - 0.5) * 6 + (stat.quality - 50) / 20) : 0
  reputation_drift: >-
    weekday == 6 ? (service_rate - 0.5) * 3 + (stat.quality - 50) / 30 : 0
  # 会费：会员多了也不会一下子富起来；招人和修设施都要掂量
  dues_week: 8
  derived:
    # 本周到现在的服务率（HUD 上显示）
    service: round(service_rate * 100)
  # 董事会信心 = 下面几项之和（截到 0..100）。拆开写是为了让玩家看到它为什么变（第二轮试玩 S2）；
  # 数和原来的一条公式完全一样。期望一周比一周高（第 7 天起每天 −0.6）：前期的成绩撑不到表决（R2）。
  derived_terms:
    board_support:
      base: "40"
      quality: (stat.quality - 55) * 0.8
      members: (stat.members - 50) * 0.5
      reputation: (stat.reputation - 40) * 0.4
      expectations: -max(0, day - 7) * 0.6
      events: >-
        (flag.match_won ? 8 : 0) + (flag.match_played ? 2 : 0) - (flag.pickleball_lease ? 3 : 0)
        + (flag.chair_impressed ? 6 : 0) - (flag.chair_worried ? 6 : 0) - (flag.board_impatient ? 8 : 0)
        + (flag.open_house_held ? 6 : 0) + (flag.turnaround_promised ? 10 : 0) - (flag.broken_promise ? 18 : 0)
        - (flag.developer_declined ? 3 : 0)
  # 表决把握：和表决卡"亲自陈述"的成功率同一条公式
  vote_odds: clamp((stat.board_support - 40) / 50, 0.08, 0.85)
  lose_if:
    when: { stat: cash, lt: -1500 }
    ending: bankrupt
daily: []
