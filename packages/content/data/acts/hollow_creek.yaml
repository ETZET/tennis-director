# 第一幕 · Hollow Creek：救活。
# 12 天后董事会表决；质量、会员、声望和对抗赛的结果决定票数。
id: hollow_creek
start: { day: 1, hour: 15 }
hours: { open: 8, close: 20 }
stats:
  cash: 1800
  reputation: 35
  quality: 44
  members: 47
  pickleball_pressure: 30
  board_support: 30
facilities:
  court_1: worn
  court_2: rented_pickleball
  bubble: collapsed
  clay: overgrown
  pool: drained
people:
  - { id: dale, at: court_1, head_coach: true }
  - { id: tyler, at: court_1 }
  - { id: mason, at: court_1 }
director: { at: deck }
anchors: [deck, court_1, court_2, bubble_court, clay_court, lot, pool, creek_bridge]
# 总监步行分钟数：按画面里的路径长度换算（1.5 米 / 游戏分钟，见 render 的 WALK_METERS_PER_MINUTE）。
# 模拟用它算总监走到某处要多久；画面在 hollow-creek/layout.ts 的 ROUTES 里给每条边的路径点。
nav:
  - [deck, court_1, 39]
  - [deck, pool, 13]
  - [deck, lot, 41]
  - [court_1, court_2, 10]
  - [court_2, lot, 28]
  - [court_1, creek_bridge, 15]
  - [court_2, creek_bridge, 15]
  - [creek_bridge, bubble_court, 9]
  - [creek_bridge, clay_court, 9]
start_cards: [hc_dale_phone]
calendar:
  - { day: 2, hour: 10, card: hc_board_memo }
  - { day: 5, hour: 9, card: hc_trial_day }
  - { day: 6, hour: 11, card: hc_bubble_quote }
  - { day: 11, hour: 10, card: hc_community_match }
  - { day: 12, hour: 15, card: hc_board_vote }
director_config: steady
rules:
  # 质量每分钟向目标靠近；目标看教练水平和专注度、场地、能用的网球场
  quality_target: >-
    22 + coach.skill * 0.45 * coach.attention + facility_quality + courts_open * 2
  quality_rate: 0.25
  # 每天收盘时的会员变化
  member_drift: >-
    round((stat.quality - 46) / 12 + (stat.reputation - 40) / 25 + rand() * 1.2 - 0.6)
  reputation_drift: (stat.quality - 50) / 40
  dues_week: 12
  derived:
    board_support: >-
      clamp(45 + (stat.quality - 55) * 0.9 + (stat.members - 50) * 1.0 + (stat.reputation - 40) * 0.5
      + (flag.match_won ? 8 : 0) + (flag.match_played ? 2 : 0)
      - (flag.pickleball_lease ? 3 : 0), 0, 100)
  lose_if:
    when: { stat: cash, lt: -1500 }
    ending: bankrupt
daily:
  - { hour: 15, activity: lesson, if: { not: { coach: none } } }
