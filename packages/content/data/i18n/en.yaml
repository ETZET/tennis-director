# One-line backgrounds (shown on the hiring card; everyone is fictional)
bios:
  rosa_ortiz: Grew up beside the date groves in Coachella and kept La Quinta golf greens alive for twelve years; she always knows when the sand is coming.
  ben_kim: A UC Riverside student who works at a Palm Desert coffee shop and remembers every regular's order; sharpest in the morning.
  jess_park: Four years on a small-college team, then teaching kids in Palm Desert; she has always wanted courts of her own.
  gus_moreno: He laid these hard courts himself before the club closed; since the layoffs he hasn't set foot on a tennis court.
  kofi_mensah: Raised in Accra, eight years as strength coach for a college track team; always there before sunrise.
  amara_okafor: Born in Lagos, came to the US on a tennis scholarship and played four years of college matches; ranked outside the top 500, she wants one more shot.
  lily_chen: Grew up in her parents' restaurant in Palm Springs, then ran a resort hotel's front desk; the busier the evening, the better she gets.
  walt_hendricks: Thirty years teaching winter visitors at a Rancho Mirage country club; the skill is still there, the spark less so.
  teo_ilic: From Novi Sad; she has strung forty racquets a day in tour stringing rooms, and no racquet leaves her bench until the strings are straight.
  luca_ferreira: Top 20 in the junior rankings at sixteen, injured and burnt out at nineteen; at twenty-three he wants to like tennis again.
  nadia_volkov: A former tour pro who retired after shoulder surgery; her name still sells tickets.
  marco_ruiz: Grew up in Indio and works night shifts on the festival stage crews every spring; he has done a bit of everything.
  ray_delgado: Ran the grounds crew here when the big tournament came in the nineties and retired in Indian Wells; he remembers every pipe, but his knees don't keep up.
  mateo_salgado: Sixteen, from Coachella, a ball kid at the big tournament two years running; he bikes over straight after school.
  diego_ibarra: Grew up in Indio hitting against the packing-house wall after date-harvest shifts; won the valley junior title at seventeen but never had the money to travel. At twenty-four he is only now getting good.

