endings:
  exhibition:
    title: The exhibition happened
    body: For the first time in ten years, the Stadium stands were full. Palm Oasis is alive again.
  deadline:
    title: Time's up
    body: The investors' sixteen weeks are over and the exhibition never happened. The restoration stops and the gates are locked again.
  bankrupt:
    title: Out of money
    body: The garden can't make payroll and the investors stop the restoration. The gates are locked again.

events:
  iw_investor_check:
    title: The investors visit
    body: The investors are at the main gate. Three weeks are left before their deadline.
    options:
      A: I'll show you around myself
      B: Have a look on your own
  iw_deadline:
    title: Time's up
    body: Sixteen weeks are over. The investors leave a folder on the clubhouse desk.
    options:
      A: Hand over the keys
  iw_arrival:
    title: The ball machine in the shed
    body: Dale shows you around. "Ten years, and nobody's hit a ball here." There's an old ball machine in the shed.
    options:
      A: Keep it and fix it for the academy later
      B: Sell it for some cash now
  iw_first_players:
    title: The first visitors
    body: Two retirees from Palm Desert stand at the gate of the members' court and ask if they can play.
    options:
      A: Free for the first week
      B: Charge the normal rate
  iw_sandstorm:
    title: The wind is up
    body: Sand is pouring onto the courts. Dale asks over the radio whether to cover them now.
    options:
      A: I'll cover them myself
      B: Wait for the wind to stop
  iw_reporter:
    title: The Desert Sun is here
    body: A reporter heard someone is restoring the abandoned club and wants to write a story.
    options:
      A: Give him a two-hour tour and lunch
      B: Send a statement
  iw_sponsor:
    title: The bank's banner
    body: A local bank saw the pickleball courts reopen and wants to hang banners all along the fence. The offer is good.
    options:
      A: Take it
      B: Decline
  iw_dale_story:
    title: The last tournament
    body: The night the pool is filled, Dale sits by the water and talks about the last tournament before the club closed. He was in the umpire's chair that year.
    options:
      A: You'll umpire the exhibition
      B: Take a few days off first
  iw_dale_nudge:
    title: '"We''ve been standing around"'
    body: Dale finds you by the clubhouse. "Two of us, a whole club, and we've been standing around for a day. There's still work we can start. Want me to take the next repair, or shall I go drum up some interest in town?"
    options:
      A: Dale takes the next repair (materials paid when he starts)
      B: Dale runs a free taster lesson in town
      C: I've got a plan
  iw_credit_union:
    title: The credit union calls
    body: A loan officer from the Coachella Valley Credit Union stops at the gate. "Quiet week? We can float you $2500 now. Four weeks, $3000 back."
    options:
      A: Take the loan
      B: No debts, thanks
  iw_loan_due:
    title: The loan is due
    body: The credit union is back for its $3000. They'll give you two more weeks if you pay $400 interest now.
    options:
      A: Pay it all back
      B: Two more weeks, pay the interest
  iw_loan_final:
    title: The extension is over
    body: The credit union takes what it can of the $3000 straight from the account. Word gets around town that the club owed money; the emptier the account, the worse it sounds.
    options:
      A: Pay up
  iw_investor_call:
    title: The investors call
    body: '"A quiet week, and we count fewer places fixed than we hoped by now." The investors are on the phone. "Do you need more money, or will you catch up by our visit in week 13?"'
    options:
      A: Ask for $1500 more
      B: Promise we'll catch up (5 places by the visit)
  iw_rival_club:
    title: A challenge from La Quinta
    body: The head coach of the La Quinta Racquet Club turns up at the clay courts. "Your members keep telling mine this place is back. Prove it. Club match, this weekend."
    options:
      A: Take the challenge and host it
      B: Not now, we're busy
  iw_dale_ten_years:
    title: Ten years
    body: A quiet week. Dale calls you into his office behind the clubhouse. "You never asked why I stayed. Ten years, alone with the sand." He pulls out a second chair.
    options:
      A: Sit down and listen
      B: Another time, there's work to do
  iw_hiring_day_1:
    title: The first hiring day
    body: You put a notice on the clubhouse door and two people came. Anyone you hire is paid weekly.
    options:
      A: Hire Rosa (grounds crew)
      B: Hire Ben (front desk)
      C: Not this time
  iw_hiring_day_2:
    title: The second hiring day
    body: "Two weeks later two more came: a coach and a man who has worked on courts half his life."
    options:
      A: Hire Jess (coach)
      B: Hire Gus (upkeep veteran)
      C: Not this time
  iw_hiring_day_2b:
    title: The second hiring day
    body: "Two weeks later two more came: a fitness coach and a college player who wants one more shot."
    options:
      A: Hire Kofi (fitness coach)
      B: Hire Amara (player)
      C: Not this time
  iw_hiring_day_3:
    title: The third hiring day
    body: "The garden has a bit of a name now, and the applicants are better: a front-desk pro and a veteran coach."
    options:
      A: Hire Lily (great service)
      B: Hire Walt (veteran coach)
      C: Not this time
  iw_hiring_day_3b:
    title: The third hiring day
    body: "The garden has a bit of a name now: someone who has strung racquets on tour, and an injured former prodigy."
    options:
      A: Hire Teodora (stringer)
      B: Hire Luca (player)
      C: Not this time
  iw_hiring_day_4:
    title: The fourth hiring day
    body: A former pro heard about the place and wants to be head coach; a young local all-rounder came too.
    options:
      A: Hire Nadia (former pro)
      B: Hire Marco (all-rounder)
      C: Not this time
  iw_hiring_day_4b:
    title: The fourth hiring day
    body: The old grounds chief heard the club is coming back and turned up himself; so did a local kid who used to be a ball kid.
    options:
      A: Hire Ray (old grounds chief)
      B: Hire Mateo (ball kid)
      C: Not this time

log:
  started: You arrive at the abandoned Palm Oasis Racquet Club.
  first_court: "The members' court has a new net: the first playable court in ten years"
  ball_machine: The ball machine works again; academy lessons are better
