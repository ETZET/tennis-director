endings:
  exhibition:
    title: The exhibition happened
    body: For the first time in ten years, the stands of Stadium 1 were full. Indian Wells is alive again.
  deadline:
    title: Time's up
    body: The investors' sixteen weeks are over and the exhibition never happened. The restoration stops and the gates are locked again.
  bankrupt:
    title: Out of money
    body: The garden can't make payroll and the investors stop the restoration. The gates are locked again.

events:
  iw_investor_check:
    title: The investors visit
    body: The investors are at the main gate. Three weeks are left before their deadline.
    options:
      A: I'll show you around myself
      B: Have a look on your own
  iw_deadline:
    title: Time's up
    body: Sixteen weeks are over. The investors leave a folder on the clubhouse desk.
    options:
      A: Hand over the keys
  iw_arrival:
    title: The ball machine in the shed
    body: Dale shows you around. "Ten years, and nobody's hit a ball here." There's an old ball machine in the shed.
    options:
      A: Keep it and fix it for the academy later
      B: Sell it for some cash now
  iw_first_players:
    title: The first visitors
    body: Two retirees from Palm Desert stand at the gate of Court 1 and ask if they can play.
    options:
      A: Free for the first week
      B: Charge the normal rate
  iw_sandstorm:
    title: The wind is up
    body: Sand is pouring onto the outer courts. Dale asks over the radio whether to cover them now.
    options:
      A: I'll cover them myself
      B: Wait for the wind to stop
  iw_reporter:
    title: The Desert Sun is here
    body: A reporter heard someone is restoring the abandoned garden and wants to write a story.
    options:
      A: Give him a two-hour tour and lunch
      B: Send a statement
  iw_sponsor:
    title: The bank's banner
    body: A local bank saw Stadium 3 reopen and wants to hang a big banner over the stands. The offer is good.
    options:
      A: Take it
      B: Decline
  iw_dale_story:
    title: The last tournament
    body: The night Stadium 2 reopens, Dale talks about the last tournament before the garden closed. He was in the umpire's chair that year.
    options:
      A: You'll umpire the exhibition
      B: Take a few days off first
  iw_hiring_day_1:
    title: The first hiring day
    body: You put a notice on the clubhouse door and two people came. Anyone you hire is paid weekly.
    options:
      A: Hire Rosa (upkeep)
      B: Hire Ben (service)
      C: Not this time
  iw_hiring_day_2:
    title: The second hiring day
    body: "Two weeks later two more came: a coach and a quick, experienced handyman."
    options:
      A: Hire Jess (coach)
      B: Hire Gus (upkeep veteran)
      C: Not this time
  iw_hiring_day_3:
    title: The third hiring day
    body: The garden has a bit of a name now, and the applicants are better.
    options:
      A: Hire Lily (great service)
      B: Hire Walt (veteran coach)
      C: Not this time
  iw_hiring_day_4:
    title: The fourth hiring day
    body: A former pro heard about the place and wants to be head coach; a young all-rounder came too.
    options:
      A: Hire Nadia (former pro)
      B: Hire Marco (all-rounder)
      C: Not this time

log:
  started: You arrive at the abandoned Indian Wells Tennis Garden.
  first_court: "Court 1 has a new net: the first playable court in ten years"
  ball_machine: The ball machine works again; academy lessons are better
  clubhouse_open: The clubhouse front desk is open; hiring days can start
  stadium_3_open: Stadium 3 is usable again
  stadium_2_open: Stadium 2 is open
  stadium_1_open: Stadium 1 is rebuilt; the exhibition can be held
  sand_covered: The courts were covered in time
  exhibition_flop: "The exhibition fell flat: the stands were half empty. Try again in a week"
  no_hire: No hire this time; the same people do the work

