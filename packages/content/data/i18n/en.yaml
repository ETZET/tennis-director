endings:
  exhibition:
    title: The exhibition happened
    body: For the first time in ten years, the Stadium stands were full. Palm Oasis is alive again.
  deadline:
    title: Time's up
    body: The investors' sixteen weeks are over and the exhibition never happened. The restoration stops and the gates are locked again.
  bankrupt:
    title: Out of money
    body: The garden can't make payroll and the investors stop the restoration. The gates are locked again.
  score:
    title: Season one is scored
    body: The investors close their notebooks. Stars, trophies, members, reputation, the people you brought on, the exhibition and the money in the bank all go on one sheet.

# Final score (W4, scored ending): item names, grade names, season-two goal (placeholder)
ending:
  items:
    stars: Stars
    trophies: Trophies
    members: Members (up to 100)
    reputation: Reputation
    unlocks: Staff breakthroughs
    exhibition: Exhibition
    pace: Exhibition, days ahead of day 112
    service: Season service rate (points above 50%)
    early: Settled early (days)
    cash: Cash above $3,000 (up to $5,000 counts)
  grades:
    S: Desert legend
    A: Valley favourite
    B: Back on its feet
    C: One step short
    D: Gates barely open
  goals:
    official_tournament: Host an official tournament

events:
  iw_pickle_noise:
    title: Too loud, one court short
    body: "Three members who have played here for twenty years are waiting by the pickleball courts. \"Pop, pop, pop, all weekend. And we lost a tennis court for it.\" More of them are talking about La Quinta."
    options:
      A: Acoustic panels and quiet paddles ($450)
      B: Hold a members' meeting about time slots (you, 3 hours; it may not work)
      C: They'll get used to it
  iw_investor_check:
    title: The investors visit
    body: "The investors are at the main gate to see how the club is doing. On day 112 they score the season."
    options:
      A: I'll show you around myself
      B: Have a look on your own
      C: Ask for $1500 more (reputation −5)
  iw_deadline:
    title: Time's up
    body: Sixteen weeks are over. The investors leave a folder on the clubhouse desk.
    options:
      A: Hand over the keys
  iw_arrival:
    title: The ball machine in the shed
    body: Dale shows you around. "Ten years, and nobody's hit a ball here." There's an old ball machine in the shed.
    options:
      A: Keep it and fix it for the academy later
      B: Sell it for some cash now
  iw_first_players:
    title: The first visitors
    body: Two retirees from Palm Desert stand at the gate of the members' court and ask if they can play.
    options:
      A: Free for the first week
      B: Charge the normal rate
  iw_sandstorm:
    title: The wind is up
    body: Sand is pouring onto the courts. Dale asks over the radio whether to cover them now.
    options:
      A: I'll cover them myself
      B: Wait for the wind to stop
  iw_reporter:
    title: The Desert Sun is here
    body: A reporter heard someone is restoring the abandoned club and wants to write a story.
    options:
      A: Give him a two-hour tour and lunch
      B: Send a statement
  iw_sponsor:
    title: The bank's banner
    body: A local bank has seen the club come back to life and wants to hang banners all along the fence. The offer is good.
    options:
      A: Take it
      B: Decline
  iw_dale_story:
    title: The last tournament
    body: The night the pool is filled, Dale sits by the water and talks about the last tournament before the club closed. He was in the umpire's chair that year.
    options:
      A: You'll umpire the exhibition
      B: Take a few days off first
  iw_dale_nudge:
    title: '"We''ve been standing around"'
    body: Dale finds you by the clubhouse. "Two of us, a whole club, and we've been standing around for a day. There's still work we can start. Want me to take the next repair?"
    options:
      A: Dale takes the next repair (materials paid when he starts)
      B: I've got a plan
  iw_dale_sweep:
    title: '"Want me to go fix it up?"'
    body: 'Dale comes in with sand on his boots. "One of our places is under 30 and going fast. Leave it and it drops a grade on Sunday. I can drop what I''m doing and spend three hours on it."'
    options:
      A: Dale goes (off his post for 3 hours)
      B: I'll send someone myself
  iw_credit_union:
    title: The credit union calls
    body: 'A loan officer from the Coachella Valley Credit Union stops at the gate. "Quiet week? We can float you $2500 now. Four weeks, $3000 back." If you don''t pay it all then, they take $2000 (never below −$1000) and the town hears about it: reputation −4 or worse.'
    options:
      A: Take the loan
      B: No debts, thanks
  iw_loan_due:
    title: The loan is due
    body: The credit union is back for its $3000. Pay it all, or pay $2000 and let the town talk about the rest.
    options:
      A: Pay all $3000
      B: Pay $2000 and owe them the rest (never below −$1000); reputation −4 or more
  iw_rival_club:
    title: A challenge from La Quinta
    body: The head coach of the La Quinta Racquet Club turns up at the clay courts. "Your members keep telling mine this place is back. Prove it. Club match, this weekend."
    options:
      A: Take the challenge and host it
      B: Not now, we're busy
  iw_dale_ten_years:
    title: Ten years
    body: A quiet week. Dale calls you into his office behind the clubhouse. "You never asked why I stayed. Ten years, alone with the sand." He pulls out a second chair.
    options:
      A: Sit down and listen
      B: Another time, there's work to do
  iw_hiring_day_1:
    title: The first hiring day
    body: You put a notice on the clubhouse door and two people came. Anyone you hire is paid weekly.
    options:
      A: Hire Rosa (grounds crew)
      B: Hire Ben (front desk)
      C: Not this time
  iw_hiring_day_2:
    title: The second hiring day
    body: "Two weeks later two more came: a coach and a man who has worked on courts half his life."
    options:
      A: Hire Jess (coach)
      B: Hire Gus (upkeep veteran)
      C: Not this time
  iw_hiring_day_2b:
    title: The second hiring day
    body: "Two weeks later two more came: a fitness coach and a college player who wants one more shot."
    options:
      A: Hire Kofi (fitness coach)
      B: Hire Amara (player)
      C: Not this time
  iw_hiring_day_3:
    title: The third hiring day
    body: "The garden has a bit of a name now, and the applicants are better: an injured former prodigy and a veteran coach."
    options:
      A: Hire Luca (player)
      B: Hire Walt (veteran coach)
      C: Not this time
  iw_hiring_day_3b:
    title: The third hiring day
    body: "The garden has a bit of a name now: someone who has strung racquets on tour, and a front-desk pro."
    options:
      A: Hire Teodora (stringer)
      B: Hire Lily (great service)
      C: Not this time
  iw_hiring_day_4:
    title: The fourth hiring day
    body: A former pro heard about the place and wants to be head coach; a young local all-rounder came too.
    options:
      A: Hire Nadia (former pro)
      B: Hire Marco (all-rounder)
      C: Not this time
  iw_hiring_day_4b:
    title: The fourth hiring day
    body: The old grounds chief heard the club is coming back and turned up himself; so did a local kid who used to be a ball kid.
    options:
      A: Hire Ray (old grounds chief)
      B: Hire Mateo (ball kid)
      C: Not this time
  iw_hiring_day_4c:
    title: The fourth hiring day
    body: "A local player who learned the game against a packing-house wall in Indio walked in with a bag of old racquets; the young all-rounder from the festival crews came too."
    options:
      A: Hire Diego (local player)
      B: Hire Marco (all-rounder)
      C: Not this time

  iw_route_s2:
    title: Which way does the club grow?
    body: 'The clubhouse is open and Dale stands at the gate with the old brochure. "Families with kids, or hotel guests from Palm Springs? We can''t chase both at once." If you don''t choose by tomorrow, Dale picks the academy.'
    options:
      A: "Youth: the academy opens first (a café clubhouse can switch to a physio room); more coaches apply; academy lessons earn more"
      B: "Resort: the resort pool opens first (a physio-room clubhouse can switch to a café); more service and fitness staff apply; busier weekends"
  iw_route_s3:
    title: Hal Brooks is closing the west holes
    body: 'Hal Brooks runs the golf course past the south wall, and it has been dying for years: the west fairways went yellow, the bunkers spilled over. "I''m shutting the west holes. The strip is yours if you want it, the bricked-up south gate included. Pave it for courts, or keep my pond and put up cabins." Whatever you pick starts building now: the clearance jobs appear on the new site. On his way out Hal adds: "No answer by tomorrow and I''ll take it you want courts."'
    options:
      A: "South courts: fill the pond, two new courts (members cap +24, quality +6); 5 jobs, $1000 in all; 47 min from the clubhouse, 105 from the gate; someone has to be posted there"
      B: "Oasis lawn: keep the pond, three cabins and a small pool court (weekend resort guests, a cabin host post, quality +5); 3 jobs, $850 in all; 46 min from the clubhouse; water and heat cost every cabin shift; members cap unchanged"
  iw_route_s4:
    title: Where does the island grow?
    body: 'A resort club needs room, and the only way out is the southeast corner. Turn the south car park into a viewing slope and grow new land for the cars, or haul in the little sky island with the two old net posts and bridge over to it? Whatever you pick starts building now. If you don''t choose by tomorrow, Dale picks the plaza.'
    options:
      A: "Event plaza: viewing slope and shade sail (exhibition +4% and +$2000 at the gate, invitational +$500, the sponsor comes sooner, a weekend sponsor booth); 4 jobs, $1000 in all; 12 min from the gate, 78 from the clubhouse; no south car park while it builds"
      B: "Academy isle: dock the island, build a bridge, a dorm and a practice court (boarding students: a $1200 term deposit, a resident coach post, members +6, academy lessons +$2; juniors' semifinal +10% now); 4 jobs, $900 in all; 91 min from the gate, 158 from the clubhouse; the bridge shuts on windy days; the exhibition gets no faster"
  iw_ending:
    title: The stands are still full. Hand in the books?
    body: 'The exhibition is over and the investors are waiting in the front row. "We can score the season today, and finishing early counts in your favour. Or keep running until day 112: one more cup, more time for your people to grow. But those weeks go on the service record too, and a slack rota drags it down. The wind season does not wait for anyone."'
    options:
      A: "Settle now: score the season today, with a bonus for every day early"
      B: "Keep running to day 112: no early bonus, more trophies and breakthroughs possible; three weeks of wind season wear the outdoor courts 50% faster (and the season service rate keeps counting)"
log:
  night_care: The clay is well cared for; it wears 30% slower this week
  dale_swept: Dale left his post for three hours and fixed up the worst place
  dale_sweep_declined: You told Dale you'd send someone yourself
  started: You arrive at the abandoned Palm Oasis Racquet Club.
  first_court: "The members' court has a new net: the first playable court in ten years"
  ball_machine: The ball machine works again; academy lessons are better
  loan_declined: You turned down the credit union's loan
  loan_settled: The credit union took what it could get and the town is talking about the rest
  loan_paid: The credit union loan is paid off
  clubhouse_open: The clubhouse front desk is open; hiring days can start
  stadium_3_open: The pickleball courts are open
  stadium_2_open: The pool is filled
  stadium_1_open: The Stadium is rebuilt; the exhibition can be held
  sand_covered: The courts were covered in time
  exhibition_flop: "The exhibition fell flat: the stands were half empty. Try again in a week"
  no_hire: No hire this time; the same people do the work
  golf_west_building: The west golf strip is a building site now; the pool hears every truck
  pond_filled: The pond is filled in. Hal Brooks watched from the cart path and said nothing
  south_courts_open: The south courts are open, two more courts behind the old south gate
  oasis_lawn_open: The oasis lawn is open. Hal sold the rest of his fairways to a hotel developer; next season you have a neighbour
  se_corner_building: The southeast corner is a building site now
  event_plaza_open: The event plaza is open, a viewing slope and shade sail where the south car park was
  academy_isle_open: The academy isle is docked and bridged; the first boarding students move in
  tournament_won: Your player won a tournament and brought home the prize money
  tournament_lost: Your player went out early this time, but learned something
  cup_hosted: The monthly club cup is done; a trophy goes in the clubhouse case
  invitational_won: The invitational filled the stands; a trophy and the prize money
  invitational_flop: The invitational fell flat; the entry fee is gone

