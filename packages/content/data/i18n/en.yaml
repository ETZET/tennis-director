endings:
  saved_with_coach:
    title: Hollow Creek is saved
    body: The board votes to keep the club. Maple Ridge High calls with a job offer, and your coach comes with you.
  saved_with_kid:
    title: Hollow Creek is saved
    body: The board votes to keep the club. Maple Ridge High offers you the program, and Mason enrolls there too.
  saved_alone:
    title: Hollow Creek is saved
    body: The board votes to keep the club. You head to Maple Ridge High on your own.
  club_sold:
    title: The club is sold
    body: The board votes to sell. The FOR SALE sign stays up, and Hollow Creek closes at the end of the month.
  sold_to_developer:
    title: Sold to the developer
    body: You take the money. The courts will be townhouses by spring.
  bankrupt:
    title: Out of money
    body: The club cannot make payroll. The bank takes over and the act ends.

events:
  hc_dale_phone:
    topic: Coaching
    title: Coach Dale is on his phone during the junior lesson
    body: Tyler is hitting balls into the fence and Mason is sitting on the court. Dale has not looked up in ten minutes.
    options:
      A: Go to Court 1 and talk to him
      B: Text him from the deck · quality +1, reputation −1
      C: Let it slide · quality −3, Dale likes you
  hc_parent_complaint:
    topic: Members
    title: Ms. Carter wants a word about the lessons
    body: '"My son paid for lessons, not babysitting." She is standing at the gate of Court 1.'
    options:
      A: Refund this week's lesson · −$60
      B: Promise things will change · the board hears sooner
      C: Back the coach · −2 members, reputation −3, Dale tries harder
  hc_board_memo:
    topic: Board memo
    title: The board wants an answer about the lessons
    body: Program quality has collapsed and members are leaving. Dale is still teaching, and the board expects a plan today.
    options:
      A: Hire a second coach · another wage, Dale is hurt
      B: Give Dale one more chance and watch him on Court 1
  hc_dale_relapse:
    topic: Coaching
    title: Dale is back on his phone
    body: One more chance lasted a day. The juniors are hitting balls at each other.
    options:
      A: Hire a coach to take over · Dale knows he was replaced
      B: Dock his pay · +$175, Dale sulks
      C: Finish the lesson yourself
  hc_hire_coach:
    topic: Staff
    title: Hire another coach
    body: Three people answered the ad. The new coach becomes head coach and Dale stays on. Whoever you pick could follow you after Hollow Creek.
    options:
      A: Jess Park · eager rookie, $250/wk
      B: Walt Hendricks · tired veteran, $420/wk
      C: Nadia Volkov · former pro, $900/wk + $600 signing
  hc_discover_kid:
    topic: Talent
    title: Mason has a natural swing
    body: The kid who sat on the court during Dale's lessons just hit three clean backhands in a row.
    options:
      A: Pay for private lessons · −$200
      B: Tell his parents he has talent · they will expect lessons
      C: Keep it quiet for now
  hc_pickleball_lease:
    topic: Pickleball
    title: The pickleball group wants a full-year lease
    body: They offer $800 up front to lock in Court 2 for the year. Your tennis members are not thrilled.
    options:
      A: Sign the lease · +$800, members grumble
      B: Take Court 2 back for tennis
      C: Offer shared hours (go to Court 2; depends on reputation)
  hc_pickleball_rant:
    topic: Pickleball
    title: The pickleball group is venting in the community chat
    body: '"Hollow Creek doesn''t want new people." The thread has forty replies.'
    options:
      A: Post a calm reply (depends on reputation)
      B: Invite them to a friendly
      C: Kick them out of the chat · old members cheer
  hc_tug_of_war:
    topic: Community
    title: The pickleball team challenges you to tug-of-war
    body: Loser buys the lemonade. Tennis has never won one of these.
    options:
      A: Send the juniors · they miss a lesson
      B: Join in yourself (go to Court 2)
      C: Decline · keep the lesson going
  hc_developer_visit:
    topic: Offer
    title: A developer wants to buy the land
    body: $2.1 million for the whole site. Townhouses, he says. The board would take it.
    options:
      A: Accept · ends the act
      B: Decline
      C: Ask for time to think
  hc_developer_return:
    topic: Offer
    title: The developer is back with a final offer
    body: Same money, a firm deadline. This is the last time he asks.
    options:
      A: Accept · ends the act
      B: Decline for good
  hc_crow_ball:
    topic: Court 1
    title: A crow just stole a ball from the basket
    body: It is sitting on the fence post, looking pleased with itself. The juniors are delighted.
    options:
      A: Laugh it off with the juniors · reputation +1, lesson stalls
      B: Put a lid on the basket · −$40
      C: Ignore it
  hc_rival_flyer:
    topic: Rivals
    title: Pine Crown taped a recruiting flyer to our fence
    body: '"Real coaching. Real courts. 20% off your first month." Three parents have already taken a photo of it.'
    options:
      A: Swap it for our own flyer
      B: Call Pine Crown and complain
      C: Leave it
  hc_board_chair:
    topic: Board
    title: The board chair is coming to see the club
    body: She will be on the deck at noon. Halfway to the vote, she wants to know whether this is working.
    options:
      A: Show her around yourself (on the deck; depends on board confidence)
      B: Email her the numbers · reputation −1
      C: Ask for more money and time · +$600, the board gets impatient
  hc_last_chance:
    topic: Board
    title: A board member offers you a lifeline
    body: '"The vote is going badly. Give them something to see, or give them a promise."'
    options:
      A: Throw an open house this weekend · −$300
      B: Promise quality back over 50 in three days
      C: Thank him and carry on
  hc_turnaround_check:
    topic: Board
    title: Three days are up
    body: The board wants to see whether you kept your promise. Quality had to be back over 50.
    options:
      A: Face the board
  hc_storm_tree:
    topic: Weather
    title: A storm dropped a tree on Court 1's fence
    body: Branches across the baseline, the fence folded in. Lessons cannot run like this.
    options:
      A: Pay a crew to clear it now · −$450
      B: Get members to help (go to Court 1; depends on reputation)
      C: Close Court 1 for now · the court breaks again
  hc_crow_lid:
    topic: Court 1
    title: The crow has learned to open the lid
    body: It flips the lid with its beak, takes one ball, and leaves. The juniors are cheering for the crow.
    options:
      A: Let the juniors name it · reputation +2
      B: Buy a padlock · −$25
      C: Ignore it
  hc_rival_van:
    topic: Rivals
    title: Pine Crown parked a demo van in our lot
    body: Free racket demos and 20% off. Our members have to walk past it to get to the courts.
    options:
      A: Ask them to leave (go to the parking lot)
      B: Set up our own table next to it · −$120
      C: Let it be
  hc_mason_parents:
    topic: Talent
    title: Mason's parents want to know when proper lessons start
    body: '"You said he has talent. So what happens now?"'
    options:
      A: Private lessons with a pro · −$200
      B: Ask your head coach to work with him · lessons suffer a bit
      C: Not yet · reputation −3
  hc_member_saturday:
    topic: Members
    title: An old member stops you about Saturday mornings
    body: '"Saturday 9 to 11 was always tennis. Now it is pickleball."'
    options:
      A: Give tennis Saturdays back · pickleball pressure rises
      B: Buy him a coffee and listen (on the deck) · −$10
      C: Brush it off
  hc_volunteer_coach:
    topic: Members
    title: A retired member offers to help coach on weekends
    body: He played college tennis forty years ago and still has the forehand.
    options:
      A: Welcome him on court · quality +3
      B: Ask him to help recruit instead
      C: Thank him warmly, no · reputation +2
  hc_double_booked:
    topic: Bookings
    title: Court 1 is double-booked this morning
    body: Two tennis regulars and four pickleball players are standing at the gate with the same time slot.
    options:
      A: Give it to the tennis regulars · pickleball pressure rises
      B: Give it to the pickleball group
      C: Sort it out in person (go to Court 1)
  hc_pool_closes:
    topic: Season
    title: Time to close the pool for the season
    body: The nights are getting cold. Keeping it open another week costs a little, and the families love it.
    options:
      A: Close it on schedule
      B: Keep it open one more week · −$60
  hc_pool_closes_late:
    topic: Season
    title: The extra pool week is over
    body: The last swimmers are packing up their towels.
    options:
      A: Close the pool
  hc_storm_leak:
    topic: Weather
    title: The clubhouse roof is leaking
    body: Rain is coming through over the trophy case. Members are moving chairs.
    options:
      A: Patch the roof for good · −$250
      B: Put out buckets · quality −2, reputation −1
      C: Close the clubhouse today · −1 member
  hc_community_match:
    topic: Match day
    title: Community match against Pine Crown
    body: Pine Crown is the club across the valley. Half the board will be watching.
    options:
      A: Field the strongest lineup with your coach
      B: Give the juniors a chance
      C: Forfeit · reputation −5, juniors rest
  hc_board_vote:
    topic: Board vote
    title: The board votes on selling the club
    body: Board confidence decides it. Present in person on the deck, or let the numbers speak.
    options:
      A: Present in person on the deck
      B: Let the numbers speak for themselves
  hc_who_follows:
    topic: Next chapter
    title: Maple Ridge High wants you to run their program
    body: You can bring one person with you.
    options:
      A: Bring your head coach
      B: Bring Mason
      C: Go alone
  hc_hiring_day:
    topic: Hiring day
    title: Two people came about the job
    body: The notice has been up for a week and two people turned up. Right now the only people working the club are you and Dale.
    options:
      A: Rosa Ortiz · great at upkeep, $180/wk
      B: Ben Kim · ball kid, good with people, $110/wk
      C: Hire no one · keep the wages
  hc_hiring_day_2:
    topic: Hiring day
    title: Hiring day before autumn
    body: The more you fix, the more there is to look after. Two more people came about the job.
    options:
      A: Gus Moreno · veteran groundskeeper, best at upkeep, a bit tired, $260/wk
      B: Lily Chen · front-desk pro, best with people, $220/wk
      C: Hire no one · keep the wages

log:
  ball_machine: The ball machine arrived; lessons are sharper now
  started: You took over Hollow Creek Tennis Club.
  workday_thin: Only a handful of neighbors showed up; the clay is still a mess
  roof_fixed: The roof is fixed for good
  vote_passed: The board voted to keep the club
  vote_failed: The board voted to sell
  trial_onsite: you were on Court 1 to welcome them, so a few more signed up
  match_won: Hollow Creek beat Pine Crown
  match_lost: Pine Crown won the match
  promise_broken: You broke your promise to the board
  promise_kept: You kept your promise to the board
  tree_cleared: The tree is cleared and lessons go on
  no_hire: No one was hired; the same few people carry the work

