endings:
  exhibition:
    title: 表演赛办成了
    body: 十年来第一次，Stadium 1 的看台上坐满了人。Indian Wells 又活过来了。
  deadline:
    title: 期限到了
    body: 投资方给的十六周到了，表演赛还没办成。修复停了，大门又锁上了。
  bankrupt:
    title: 钱花光了
    body: 园区发不出工资，投资方叫停了修复。大门又锁上了。

events:
  iw_investor_check:
    title: 投资方来看进度
    body: 投资方的人站在大门口。离他们给的期限只剩三周了。
    options:
      A: 我亲自带你们转
      B: 你们自己随便看
  iw_deadline:
    title: 期限到了
    body: 十六周到了。投资方的人把一份文件放在会所的桌子上。
    options:
      A: 交出钥匙
  iw_arrival:
    title: 仓库里的发球机
    body: Dale 带你转了一圈。"十年了，没人在这儿打过一个球。"仓库角落里还有一台旧发球机。
    options:
      A: 留着，以后修好给学院用
      B: 卖掉，先换点钱
  iw_first_players:
    title: 第一批客人
    body: 两位从 Palm Desert 来的退休老人站在外场 1 门口，问能不能打一场。
    options:
      A: 头一周免费
      B: 照价收
  iw_sandstorm:
    title: 起风了
    body: 风卷着沙往外场里灌，Dale 在对讲机里喊：要不要现在去把场地盖上？
    options:
      A: 我亲自去盖
      B: 等风停了再说
  iw_reporter:
    title: The Desert Sun 来了
    body: 一位记者听说有人在修这座废弃的园区，想来写一篇报道。
    options:
      A: 亲自带他转两个小时，请他吃午饭
      B: 发一段声明
  iw_sponsor:
    title: 银行的横幅
    body: 本地一家银行看到 Stadium 3 开了，想在看台上挂一块大横幅，出价不低。
    options:
      A: 收下
      B: 婉拒
  iw_dale_story:
    title: 最后一届比赛
    body: Stadium 2 修好的那天晚上，Dale 说起园区关门前的最后一届比赛，他那年坐在裁判椅上。
    options:
      A: 表演赛那天请你坐裁判椅
      B: 你先歇几天
  iw_hiring_day_1:
    title: 第一个招聘日
    body: 会所门口贴了告示，来了两个人。招了就每周付工资。
    options:
      A: 招 Rosa（维护好手）
      B: 招 Ben（会招呼人）
      C: 这次不招
  iw_hiring_day_2:
    title: 第二个招聘日
    body: 两周后又来了两个人：一位教练，一位干活很利索的老师傅。
    options:
      A: 招 Jess（教练）
      B: 招 Gus（维护老手）
      C: 这次不招
  iw_hiring_day_3:
    title: 第三个招聘日
    body: 园区有点名气了，来的人水平也高了。
    options:
      A: 招 Lily（服务一流）
      B: 招 Walt（老教练）
      C: 这次不招
  iw_hiring_day_4:
    title: 第四个招聘日
    body: 一位前职业球员听说了这里，想来当主教练；还有一个什么都会一点的年轻人。
    options:
      A: 招 Nadia（前职业球员）
      B: 招 Marco（多面手）
      C: 这次不招

log:
  started: 你来到了废弃的 Indian Wells Tennis Garden。
  first_court: 外场 1 换上了新网：十年来第一块能打的场地
  ball_machine: 发球机修好了，学院的课更扎实了
  clubhouse_open: 会所前台开张了，可以开招聘日了
  stadium_3_open: Stadium 3 又能用了
  stadium_2_open: Stadium 2 开放了
  stadium_1_open: Stadium 1 重建完成，可以办表演赛了
  sand_covered: 场地盖住了，沙没灌进来
  exhibition_flop: 表演赛冷场了：看台上稀稀拉拉，一周后再试一次
  no_hire: 这次没招人，活还是那几个人干

