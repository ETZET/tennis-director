  contractor: { title: 外包施工队在红土场 }
  fundraiser: { title: 露台募捐晚会 }
  tug_of_war: { title: 和匹克球队拔河 }
  match_strong: { title: 社区对抗赛 vs 松冠俱乐部 }
  match_juniors: { title: 社区对抗赛 vs 松冠俱乐部（青少年上场） }
  open_house: { title: 开放日 }

endings:
  saved_with_coach:
    title: Hollow Creek 保住了
    body: 董事会投票保留俱乐部。枫岭高中发来聘书，你的教练跟你一起走。
  saved_with_kid:
    title: Hollow Creek 保住了
    body: 董事会投票保留俱乐部。枫岭高中请你去带网球队，Mason 也考进了枫岭。
  saved_alone:
    title: Hollow Creek 保住了
    body: 董事会投票保留俱乐部。你一个人去了枫岭高中。
  club_sold:
    title: 俱乐部被卖了
    body: 董事会投票出售。停车场的出售牌没摘下来，Hollow Creek 月底关门。
  sold_to_developer:
    title: 卖给了开发商
    body: 你收了钱。到明年春天，这些球场会变成联排别墅。
  bankrupt:
    title: 钱花光了
    body: 俱乐部发不出工资，银行接管，本幕结束。

events:
  hc_dale_phone:
    topic: 教学
    title: Dale 在青少年课上玩手机
    body: Tyler 把球一个个打进围网，Mason 坐在场地上发呆。Dale 已经十分钟没抬头了。
    options:
      A: 走到 1 号场，当面跟他说
      B: 在露台上给他发短信 · 质量 +1，声望 −1
      C: 算了 · 质量 −3，Dale 记你的好
  hc_parent_complaint:
    topic: 会员
    title: Carter 女士要找你谈课程的事
    body: “我儿子交的是课时费，不是托管费。”她就站在 1 号场门口。
    options:
      A: 退这周的课时费 · −$60
      B: 保证会改 · 董事会会更早来问
      C: 站在教练一边 · 会员 −2，声望 −3，Dale 会更上心
  hc_board_memo:
    topic: 董事会备忘
    title: 董事会要你处理 Dale
    body: 项目质量崩了，会员在流失。董事会要你今天就拿出办法。
    options:
      A: 当着学生的面开除他
      B: 在露台上私下谈，请他走人
      C: 再给他一次机会
  hc_dale_relapse:
    topic: 教学
    title: Dale 又在看手机了
    body: 再给一次机会只撑了一天。孩子们在拿球互相打。
    options:
      A: 现在就开除他
      B: 扣他工资 · +$175，Dale 闹情绪
      C: 你自己下场把课上完
  hc_hire_coach:
    topic: 人事
    title: 招一个新的主教练
    body: 三个人回了招聘启事。你选的人，以后可能跟你去下一站。
    options:
      A: Jess Park · 热血新人，每周 $250
      B: Walt Hendricks · 疲惫的老手，每周 $420
      C: Nadia Volkov · 前职业球员，每周 $900，签约费 $600
  hc_fix_court1:
    topic: 设施
    title: 1 号场快散架了
    body: 裂缝里长了草，球网中间塌下去。本地的施工队这周能来补。
    options:
      A: 补裂缝、换球网 · −$350
      B: 只换球网 · −$80
      C: 先不修 · 裂缝会更大
  hc_trial_day:
    topic: 招生
    title: 办一场免费试训日？
    body: 开放一下午，看看谁会来。你亲自到 1 号场，能多拉来几个人。
    options:
      A: 大张旗鼓，发传单挂横幅 · −$150
      B: 低调办
      C: 不办 · 声望 −1，教练专心上课
  hc_discover_kid:
    topic: 天赋
    title: Mason 的挥拍是天生的
    body: 在 Dale 课上坐在地上发呆的那个孩子，刚刚连着打了三个干净的反手。
    options:
      A: 出钱给他上私教课 · −$200
      B: 告诉他父母他有天赋 · 他们会等着你安排
      C: 先不声张
  hc_pickleball_lease:
    topic: 匹克球
    title: 匹克球那帮人想签一整年的租约
    body: 他们先付 $800，把 2 号场包一整年。网球会员不太高兴。
    options:
      A: 签约 · +$800，会员抱怨
      B: 把 2 号场收回来打网球
      C: 提议分时段（走到 2 号场去谈，成败看声望）
  hc_pickleball_rant:
    topic: 匹克球
    title: 匹克球那帮人在社区群里吐槽你
    body: “Hollow Creek 不欢迎新人。”帖子底下已经四十条回复。
    options:
      A: 心平气和地回一帖（成败看声望）
      B: 请他们来打一场友谊赛
      C: 把他们踢出群 · 老会员叫好
  hc_tug_of_war:
    topic: 社区
    title: 匹克球队向你们发起拔河挑战
    body: 输的一方请喝柠檬水。网球这边从来没赢过。
    options:
      A: 派青少年上 · 他们少上一节课
      B: 你亲自上（走到 2 号场）
      C: 婉拒 · 课照常上
  hc_clay_workday:
    topic: 设施
    title: 把红土场救回来？
    body: 一棵树倒在围网上，场地上草比土多。邻居们说可以来帮忙。
    options:
      A: 发起社区劳动日（走到红土场，成败看声望）
      B: 请施工队 · −$900，专业场地
      C: 先不管
  hc_bubble_quote:
    topic: 设施
    title: 气膜公司发来报价
    body: 重新充气要 $2,400。充起来以后，下雨天也有场地可用。
    options:
      A: 充气 · −$2,400
      B: 先在露台上办一场募捐晚会
      C: 今年不弄了
  hc_developer_visit:
    topic: 报价
    title: 开发商想买下这块地
    body: 整块地 210 万美元。他说要盖联排别墅。董事会会同意的。
    options:
      A: 接受 · 本幕结束
      B: 拒绝
      C: 说要考虑一下
  hc_developer_return:
    topic: 报价
    title: 开发商带着最后报价回来了
    body: 一样的价钱，有明确的期限。这是他最后一次开口。
    options:
      A: 接受 · 本幕结束
      B: 彻底拒绝
  hc_crow_ball:
    topic: 1 号场
    title: 一只乌鸦从球筐里叼走了一个球
    body: 它站在围网柱子上，一脸得意。孩子们乐坏了。
    options:
      A: 和孩子们一起笑 · 声望 +1，课停了一会儿
      B: 给球筐加个盖 · −$40
      C: 不管
  hc_rival_flyer:
    topic: 对手
    title: Pine Crown 把招生传单贴到了我们的围网上
    body: "「真正的教练，真正的场地，首月八折。」已经有三位家长拍了照。"
    options:
      A: 换成我们自己的传单
      B: 打电话去 Pine Crown 抗议
      C: 随它去
  hc_board_chair:
    topic: 董事会
    title: 董事会主席要来俱乐部看看
    body: 她中午到露台。离表决还有一半时间，她想知道你这套办法管不管用。
    options:
      A: 亲自带她转一圈（在露台；成败看董事会信心）
      B: 把数字发邮件给她 · 声望 −1
      C: 开口要钱要时间 · +$600，董事会会不耐烦
  hc_last_chance:
    topic: 董事会
    title: 一位董事想拉你一把
    body: “表决形势不妙。要么让他们看到点什么，要么给他们一个承诺。”
    options:
      A: 这周末办开放日 · −$300
      B: 立军令状：三天内质量回到 50 以上
      C: 谢过他，照原样做
  hc_turnaround_check:
    topic: 董事会
    title: 三天到了
    body: 董事会来看你有没有兑现承诺：质量要回到 50 以上。
    options:
      A: 去见董事会
  hc_storm_tree:
    topic: 天气
    title: 暴风雨把一棵树刮倒在 1 号场的围网上
    body: 树枝横在底线上，围网塌了进去。这样没法上课。
    options:
      A: 马上请人清走 · −$450
      B: 叫会员一起来清（走到 1 号场，成败看声望）
      C: 先把 1 号场关了 · 场地又坏了
  hc_crow_lid:
    topic: 1 号场
    title: 乌鸦学会了开盖子
    body: 它用嘴把盖子掀开，叼走一个球就飞。孩子们在给乌鸦加油。
    options:
      A: 让孩子们给它起个名字 · 声望 +2
      B: 买把挂锁 · −$25
      C: 不管
  hc_rival_van:
    topic: 对手
    title: Pine Crown 把试训车开进了我们的停车场
    body: 免费试拍，打八折。我们的会员去球场得从车旁边走过。
    options:
      A: 当面请他们离开（走到停车场）
      B: 在旁边摆我们自己的桌子 · −$120
      C: 随它去
  hc_mason_parents:
    topic: 天赋
    title: Mason 的父母问什么时候开始正经练
    body: “你说他有天赋。那接下来呢？”
    options:
      A: 请专业教练上私教课 · −$200
      B: 让主教练多带带他 · 课会受点影响
      C: 还不是时候 · 声望 −3
  hc_member_saturday:
    topic: 会员
    title: 一位老会员拦住你，说起周六上午的场地
    body: “周六 9 点到 11 点一直是打网球的，现在成了匹克球。”
    options:
      A: 把周六上午还给网球 · 匹克球那边会更不满
      B: 请他喝杯咖啡慢慢聊（在露台）· −$10
      C: 敷衍过去
  hc_junior_hit:
    topic: 青少年
    title: Tyler 问你能不能陪他打几拍
    body: 他拿着两支拍子站在 1 号场门口。
    options:
      A: 陪他打（走到 1 号场）
      B: 让他去对墙练
      C: 叫 Mason 陪他打
  hc_coach_feedback:
    topic: 教练
    title: 教练下课后想听听你的意见
    body: “我这样教对不对？说实话。”
    options:
      A: 先看完下一节课再说（走到 1 号场）
      B: 批一台发球机 · −$120
      C: 改天再说 · 教练有点泄气
  hc_pool_kids:
    topic: 招生
    title: 泳池边的孩子们在看网球
    body: 四个孩子裹着湿毛巾，趴在围网上。
    options:
      A: 请他们进场打几拍（走到泳池）
      B: 发几张传单 · −$20
      C: 随他们去
  hc_lot_pothole:
    topic: 设施
    title: 一位会员的车在停车场的坑里刮了底盘
    body: 她还站在车旁边看着保险杠。
    options:
      A: 把坑补上 · −$120
      B: 当面道歉，放个路锥（走到停车场）
      C: 不关我们的事
  hc_volunteer_coach:
    topic: 会员
    title: 一位退休会员想周末来帮忙带课
    body: 他四十年前打过大学校队，正手还在。
    options:
      A: 欢迎他上场 · 质量 +3
      B: 请他帮忙招生
      C: 客气地谢绝 · 声望 +2
  hc_ball_order:
    topic: 器材
    title: 上课用的球都没气了
    body: 弹不过发球线。Tyler 拿一个当解压球捏。
    options:
      A: 订一箱新球 · −$60
      B: 凑合用 · 质量 −1
      C: 请会员自己带球 · 声望 −1
  hc_double_booked:
    topic: 预约
    title: 1 号场上午约重了
    body: 两位网球老会员和四个打匹克球的人拿着同一个时段站在门口。
    options:
      A: 给网球老会员 · 匹克球那边更不满
      B: 给打匹克球的人
      C: 过去当面协调（走到 1 号场）
  hc_storm_leak:
    topic: 天气
    title: 会所屋顶漏雨
    body: 雨水从奖杯柜上方漏下来，会员们在搬椅子。
    options:
      A: 把屋顶彻底补好 · −$250
      B: 摆几个桶接着 · 质量 −2，声望 −1
      C: 今天会所关门 · 会员 −1
  hc_community_match:
    topic: 比赛日
    title: 社区对抗赛 vs 松冠俱乐部
    body: 松冠是山谷对面那家俱乐部。董事会一半的人会来看。
    options:
      A: 派出最强阵容，教练带队
      B: 让青少年上场
      C: 弃权 · 声望 −5，孩子们休息
  hc_board_vote:
    topic: 董事会表决
    title: 董事会就出售俱乐部投票
    body: 看董事会信心。到露台上亲自陈述，或者让数字自己说话。
    options:
      A: 亲自到露台上陈述
      B: 让数字自己说话
  hc_who_follows:
    topic: 下一站
    title: 枫岭高中请你去带他们的网球队
    body: 你可以带一个人一起走。
    options:
      A: 带上你的主教练
      B: 带上 Mason
      C: 一个人去

log:
  started: 你接手了 Hollow Creek 网球俱乐部。
  workday_thin: 只来了几个邻居，红土场还是一团糟
  roof_fixed: 屋顶彻底补好了
  vote_passed: 董事会投票保留俱乐部
  vote_failed: 董事会投票出售俱乐部
  trial_onsite: 你在 1 号场门口迎接，多来了几个人
  match_won: Hollow Creek 赢了 Pine Crown
  match_lost: Pine Crown 赢了比赛
  promise_broken: 你没兑现对董事会的承诺
  promise_kept: 你兑现了对董事会的承诺
  tree_cleared: 树清走了，课照常上

