endings:
  saved_with_coach:
    title: 霍洛溪保住了
    body: 董事会投票保留俱乐部。枫岭高中发来聘书，你的教练跟你一起走。
  saved_with_kid:
    title: 霍洛溪保住了
    body: 董事会投票保留俱乐部。枫岭高中请你去带网球队，Mason 也考进了枫岭。
  saved_alone:
    title: 霍洛溪保住了
    body: 董事会投票保留俱乐部。你一个人去了枫岭高中。
  club_sold:
    title: 俱乐部被卖了
    body: 董事会投票出售。停车场的出售牌没摘下来，霍洛溪月底关门。
  sold_to_developer:
    title: 卖给了开发商
    body: 你收了钱。到明年春天，这些球场会变成联排别墅。
  bankrupt:
    title: 钱花光了
    body: 俱乐部发不出工资，银行接管，本幕结束。

events:
  hc_dale_phone:
    topic: 教学
    title: Dale 在青少年课上玩手机
    body: Tyler 把球一个个打进围网，Mason 坐在场地上发呆。Dale 已经十分钟没抬头了。
    options:
      A: 去 1 号场当面跟他说
      B: 在露台上给他发短信 · 质量 +1，声望 −1
      C: 算了 · 质量 −3，Dale 记你的好
  hc_parent_complaint:
    topic: 会员
    title: Carter 女士要找你谈课程的事
    body: “我儿子交的是课时费，不是托管费。”她就站在 1 号场门口。
    options:
      A: 退这周的课时费 · −$60
      B: 保证会改 · 董事会会更早来问
      C: 站在教练一边 · 会员 −2，声望 −3，Dale 会更上心
  hc_board_memo:
    topic: 董事会备忘
    title: 董事会要你给课程一个说法
    body: 项目质量崩了，会员在流失。Dale 还在上课，董事会要你今天拿出办法。
    options:
      A: 再招一位教练 · 多一份工资，Dale 不高兴
      B: 再给 Dale 一次机会，你去 1 号场盯着他
  hc_dale_relapse:
    topic: 教学
    title: Dale 又在看手机了
    body: 再给一次机会只撑了一天。孩子们在拿球互相打。
    options:
      A: 再招一位教练接课 · Dale 知道自己被替了
      B: 扣他工资 · +$175，Dale 闹情绪
      C: 你自己下场把课上完
  hc_hire_coach:
    topic: 人事
    title: 再招一位教练
    body: 三个人回了招聘启事。新教练接主教练，Dale 留下来。你选的人，以后可能跟你去下一站。
    options:
      A: Jess Park · 热血新人，每周 $250
      B: Walt Hendricks · 疲惫的老手，每周 $420
      C: Nadia Volkov · 前职业球员，每周 $900，签约费 $600
  hc_discover_kid:
    topic: 天赋
    title: Mason 的挥拍是天生的
    body: 在 Dale 课上坐在地上发呆的那个孩子，刚刚连着打了三个干净的反手。
    options:
      A: 出钱给他上私教课 · −$200
      B: 告诉他父母他有天赋 · 他们会等着你安排
      C: 先不声张
  hc_pickleball_lease:
    topic: 匹克球
    title: 匹克球那帮人想签一整年的租约
    body: 他们先付 $800，把 2 号场包一整年。网球会员不太高兴。
    options:
      A: 签约 · +$800，会员抱怨
      B: 把 2 号场收回来打网球
      C: 提议分时段（走到 2 号场去谈，成败看声望）
  hc_pickleball_rant:
    topic: 匹克球
    title: 匹克球那帮人在社区群里吐槽你
    body: “霍洛溪不欢迎新人。”帖子底下已经四十条回复。
    options:
      A: 心平气和地回一帖（成败看声望）
      B: 请他们来打一场友谊赛
      C: 把他们踢出群 · 老会员叫好
  hc_tug_of_war:
    topic: 社区
    title: 匹克球队向你们发起拔河挑战
    body: 输的一方请喝柠檬水。网球这边从来没赢过。
    options:
      A: 派青少年上 · 他们少上一节课
      B: 你亲自上（走到 2 号场）
      C: 婉拒 · 课照常上
  hc_developer_visit:
    topic: 报价
    title: 开发商想买下这块地
    body: 整块地 210 万美元。他说要盖联排别墅。董事会会同意的。
    options:
      A: 接受 · 本幕结束
      B: 拒绝
      C: 说要考虑一下
  hc_developer_return:
    topic: 报价
    title: 开发商带着最后报价回来了
    body: 一样的价钱，有明确的期限。这是他最后一次开口。
    options:
      A: 接受 · 本幕结束
      B: 彻底拒绝
  hc_crow_ball:
    topic: 1 号场
    title: 一只乌鸦从球筐里叼走了一个球
    body: 它站在围网柱子上，一脸得意。孩子们乐坏了。
    options:
      A: 和孩子们一起笑 · 声望 +1，课停了一会儿
      B: 给球筐加个盖 · −$40
      C: 不管
  hc_rival_flyer:
    topic: 对手
    title: 松冠把招生传单贴到了我们的围网上
    body: "「真正的教练，真正的场地，首月八折。」已经有三位家长拍了照。"
    options:
      A: 换成我们自己的传单
      B: 打电话去松冠抗议
      C: 随它去
  hc_board_chair:
    topic: 董事会
    title: 董事会主席要来俱乐部看看
    body: 她中午到露台。离表决还有一半时间，她想知道你这套办法管不管用。
    options:
      A: 亲自带她转一圈（在露台；成败看董事会信心）
      B: 把数字发邮件给她 · 声望 −1
      C: 开口要钱要时间 · +$600，董事会会不耐烦
  hc_last_chance:
    topic: 董事会
    title: 一位董事想拉你一把
    body: “表决形势不妙。要么让他们看到点什么，要么给他们一个承诺。”
    options:
      A: 这周末办开放日 · −$300
      B: 立军令状：三天内质量回到 50 以上
      C: 谢过他，照原样做
  hc_turnaround_check:
    topic: 董事会
    title: 三天到了
    body: 董事会来看你有没有兑现承诺：质量要回到 50 以上。
    options:
      A: 去见董事会
  hc_storm_tree:
    topic: 天气
    title: 暴风雨把一棵树刮倒在 1 号场的围网上
    body: 树枝横在底线上，围网塌了进去。这样没法上课。
    options:
      A: 马上请人清走 · −$450
      B: 叫会员一起来清（走到 1 号场，成败看声望）
      C: 先把 1 号场关了 · 场地又坏了
  hc_crow_lid:
    topic: 1 号场
    title: 乌鸦学会了开盖子
    body: 它用嘴把盖子掀开，叼走一个球就飞。孩子们在给乌鸦加油。
    options:
      A: 让孩子们给它起个名字 · 声望 +2
      B: 买把挂锁 · −$25
      C: 不管
  hc_rival_van:
    topic: 对手
    title: 松冠把试训车开进了我们的停车场
    body: 免费试拍，打八折。我们的会员去球场得从车旁边走过。
    options:
      A: 当面请他们离开（走到停车场）
      B: 在旁边摆我们自己的桌子 · −$120
      C: 随它去
  hc_mason_parents:
    topic: 天赋
    title: Mason 的父母问什么时候开始正经练
    body: “你说他有天赋。那接下来呢？”
    options:
      A: 请专业教练上私教课 · −$200
      B: 让主教练多带带他 · 课会受点影响
      C: 还不是时候 · 声望 −3
  hc_member_saturday:
    topic: 会员
    title: 一位老会员拦住你，说起周六上午的场地
    body: “周六 9 点到 11 点一直是打网球的，现在成了匹克球。”
    options:
      A: 把周六上午还给网球 · 匹克球那边会更不满
      B: 请他喝杯咖啡慢慢聊（在露台）· −$10
      C: 敷衍过去
  hc_volunteer_coach:
    topic: 会员
    title: 一位退休会员想周末来帮忙带课
    body: 他四十年前打过大学校队，正手还在。
    options:
      A: 欢迎他上场
      B: 请他帮忙招生
      C: 客气地谢绝
  hc_double_booked:
    topic: 预约
    title: 1 号场上午约重了
    body: 两位网球老会员和四个打匹克球的人拿着同一个时段站在门口。
    options:
      A: 给网球老会员 · 匹克球那边更不满
      B: 给打匹克球的人
      C: 过去当面协调（走到 1 号场）
  hc_pool_closes:
    topic: 换季
    title: 泳池该关了
    body: 夜里开始凉了。多开一周要花点钱，但家长们很喜欢。
    options:
      A: 按时关
      B: 再开一周 · −$60
  hc_pool_closes_late:
    topic: 换季
    title: 多开的那一周过去了
    body: 最后几个游泳的人在收毛巾。
    options:
      A: 关掉泳池
  hc_storm_leak:
    topic: 天气
    title: 会所屋顶漏雨
    body: 雨水从奖杯柜上方漏下来，会员们在搬椅子。
    options:
      A: 把屋顶彻底补好 · −$250
      B: 摆几个桶接着 · 质量 −2，声望 −1
      C: 今天会所关门 · 会员 −1
  hc_community_match:
    topic: 比赛日
    title: 社区对抗赛 vs 松冠俱乐部
    body: 松冠是山谷对面那家俱乐部。董事会一半的人会来看。
    options:
      A: 派出最强阵容，教练带队
      B: 让青少年上场
      C: 弃权 · 声望 −5，孩子们休息
  hc_board_vote:
    topic: 董事会表决
    title: 董事会就出售俱乐部投票
    body: 亲自陈述，成败看董事会信心；让数字说话，成败看项目质量和会员。
    options:
      A: 亲自到露台上陈述
      B: 让数字自己说话
  hc_who_follows:
    topic: 下一站
    title: 枫岭高中请你去带他们的网球队
    body: 你可以带一个人一起走。
    options:
      A: 带上你的主教练
      B: 带上 Mason
      C: 一个人去
  hc_hiring_day:
    topic: 招聘日
    title: 两个人来应聘
    body: 告示贴出去一周，来了两个人。人手一直不够，活总是比人多。
    options:
      A: Rosa Ortiz · 维护好手，每周 $180
      B: Ben Kim · 球童，会招呼人，每周 $110
      C: 这次不招 · 省下工资
  hc_hiring_day_2:
    topic: 招聘日
    title: 入秋前的招聘日
    body: 修好的地方越多，要守的地方越多。又有两个人来应聘。
    options:
      A: Gus Moreno · 老场地工，维护最强，有点累了，每周 $260
      B: Lily Chen · 前台出身，服务最好，每周 $220
      C: 这次不招 · 省下工资

log:
  ball_machine: 发球机到了，课更扎实了
  started: 你接手了霍洛溪网球俱乐部。
  workday_thin: 只来了几个邻居，红土场还是一团糟
  roof_fixed: 屋顶彻底补好了
  vote_passed: 董事会投票保留俱乐部
  vote_failed: 董事会投票出售俱乐部
  trial_onsite: 你在 1 号场门口迎接，多来了几个人
  match_won: 霍洛溪赢了松冠
  match_lost: 松冠赢了比赛
  promise_broken: 你没兑现对董事会的承诺
  promise_kept: 你兑现了对董事会的承诺
  tree_cleared: 树清走了，课照常上
  no_hire: 这次没招人，活还是那几个人干

