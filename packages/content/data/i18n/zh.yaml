# 一句话背景（招聘卡上显示；人物都是虚构的）
bios:
  rosa_ortiz: 在 Coachella 的椰枣园边长大，给 La Quinta 的高尔夫球场修了十二年草坪；风沙要来，她总是先知道。
  ben_kim: UC Riverside 的学生，在 Palm Desert 的咖啡店打工，记得每个熟客点什么；早上精神最好。
  jess_park: 在一所小大学打了四年校队，毕业后在 Palm Desert 教孩子打球，一直想有一块自己的场地。
  gus_moreno: 俱乐部关门前，这里的硬地是他一块块铺的；裁员那天以后，他再没进过网球场。
  kofi_mensah: 在 Accra 长大，给一所大学的田径队当了八年体能教练，天亮之前就到场。
  amara_okafor: 生在 Lagos，拿网球奖学金来美国打了四年大学比赛；排名在五百开外，想再拼一次。
  lily_chen: 在父母开在 Palm Springs 的餐馆里长大，后来在度假酒店管前台；晚上客人越多，她越来劲。
  walt_hendricks: 在 Rancho Mirage 的乡村俱乐部教了三十年过冬的退休客人；手艺还在，心有点累了。
  teo_ilic: 从 Novi Sad 来，在巡回赛的穿线房里一天穿过四十支拍子；线不直，她不交拍。
  luca_ferreira: 十六岁进过青少年排名前二十，十九岁手腕伤了、也打怕了；现在二十三岁，想重新喜欢上网球。
  nadia_volkov: 前职业球员，肩伤动过手术以后退役；她的名字还能卖出票。
  marco_ruiz: 在 Indio 长大，每年春天在音乐节的搭台队上夜班，什么活都干过一点。
  ray_delgado: 九十年代这里办大赛时的场地主管，退休后就住在 Indian Wells；俱乐部的每根水管他都记得，膝盖却不行了。
  mateo_salgado: 十六岁，Coachella 人，前两年在大赛上当过球童；一放学就骑车过来。
  diego_ibarra: 在 Indio 长大，椰枣收完工就去包装厂的墙上练球；十七岁拿过谷地青少年冠军，却一直没钱出去比赛。二十四岁了，才刚开始打出来。

