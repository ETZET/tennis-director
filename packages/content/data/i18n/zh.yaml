endings:
  exhibition:
    title: 表演赛办成了
    body: 十年来第一次，中心球场的看台上坐满了人。Palm Oasis 又活过来了。
  deadline:
    title: 期限到了
    body: 投资方给的十六周到了，表演赛还没办成。修复停了，大门又锁上了。
  bankrupt:
    title: 钱花光了
    body: 俱乐部发不出工资，投资方叫停了修复。大门又锁上了。
  score:
    title: 第一季打分了
    body: 投资方合上了本子。星级、奖杯、会员、声望、你带出来的人、表演赛和账上的钱，都记在同一张单子上。

# 结局打分（W4，结局方案 A）：分项名、评语档名、第二季目标（占位）
ending:
  items:
    stars: 星级
    trophies: 奖杯
    members: 会员（算到 100 人）
    reputation: 声望
    unlocks: 员工成长解锁
    exhibition: 表演赛
    pace: 表演赛比第 112 天早几天
    service: 整季服务率（50% 以上的点数）
    early: 提前交账天数
    cash: 现金（3,000 美元以上，最多算 5,000 美元）
  grades:
    S: 沙漠传奇
    A: 山谷名园
    B: 重新站稳
    C: 差一口气
    D: 门勉强开着
  goals:
    official_tournament: 办一场正式巡回赛

events:
  iw_pickle_noise:
    title: 太吵了，还少了一片场
    body: 三位在这儿打了二十年网球的老会员在匹克球场边等你："啪、啪、啪，一整个周末。为了这个还拆了一片网球场。"有几个人已经在说去 La Quinta 了。
    options:
      A: 装隔音板、换静音拍（$450）
      B: 开个会员会，讲清楚分时段（你亲自去 3 小时，不一定谈得拢）
      C: 过阵子就习惯了
  iw_investor_check:
    title: 投资方来看进度
    body: 投资方的人站在大门口，来看会所现在的样子。第 112 天他们要给这一季打分。
    options:
      A: 我亲自带你们转
      B: 你们自己随便看
      C: 请他们追加 $1500（声望 −5）
  iw_deadline:
    title: 期限到了
    body: 十六周到了。投资方的人把一份文件放在会所的桌子上。
    options:
      A: 交出钥匙
  iw_arrival:
    title: 仓库里的发球机
    body: Dale 带你转了一圈。"十年了，没人在这儿打过一个球。"仓库角落里还有一台旧发球机。
    options:
      A: 留着，以后修好给学院用
      B: 卖掉，先换点钱
  iw_first_players:
    title: 第一批客人
    body: 两位从 Palm Desert 来的退休老人站在会员场门口，问能不能打一场。
    options:
      A: 头一周免费
      B: 照价收
  iw_sandstorm:
    title: 起风了
    body: 风卷着沙往球场里灌，Dale 在对讲机里喊：要不要现在去把场地盖上？
    options:
      A: 我亲自去盖
      B: 等风停了再说
  iw_reporter:
    title: The Desert Sun 来了
    body: 一位记者听说有人在修这座废弃的俱乐部，想来写一篇报道。
    options:
      A: 亲自带他转两个小时，请他吃午饭
      B: 发一段声明
  iw_sponsor:
    title: 银行的横幅
    body: 本地一家银行看到俱乐部又热闹起来，想在围网上挂一圈横幅，出价不低。
    options:
      A: 收下
      B: 婉拒
  iw_dale_story:
    title: 最后一届比赛
    body: 泳池放满水的那天晚上，Dale 坐在池边说起俱乐部关门前的最后一届比赛，他那年坐在裁判椅上。
    options:
      A: 表演赛那天请你坐裁判椅
      B: 你先歇几天
  iw_dale_nudge:
    title: "“咱俩站了一天了”"
    body: Dale 在会所门口找到你："两个人，一整座俱乐部，咱俩干站了一天了。还有能动手的活。下一件修复交给我？"
    options:
      A: 交给 Dale 去干下一件修复（开工时扣材料费）
      B: 我自己有安排
  iw_dale_sweep:
    title: "“我去收拾一下？”"
    body: Dale 进门时鞋上全是沙："有一处掉到 30 以下了，掉得很快。不管它，周日就要掉一档。我可以放下手上的事，去收拾三个小时。"
    options:
      A: Dale 去（离岗 3 小时）
      B: 我自己派人
  iw_credit_union:
    title: 信用社来电
    body: Coachella Valley 信用社的信贷员停在大门口："这礼拜挺清闲？我们现在可以先借你 $2500，四周后还 $3000。"到时候不还全额，就先扣 $2000（最多扣到 −$1000），镇上也会传开：声望 −4 起。
    options:
      A: 借
      B: 不欠债，谢谢
  iw_loan_due:
    title: 贷款到期
    body: 信用社来收那 $3000 了。一次还清，还是先还 $2000、剩下的让镇上去议论？
    options:
      A: 一次还清 $3000
      B: 先还 $2000、剩下的欠着（最多扣到 −$1000），声望 −4 起
  iw_rival_club:
    title: La Quinta 来下战书
    body: La Quinta 网球俱乐部的主教练来到红土场："你们的会员老跟我的会员说这儿又活过来了。那就比一场，这个周末，俱乐部对抗赛。"
    options:
      A: 接下挑战，在这儿办
      B: 现在没空
  iw_dale_ten_years:
    title: 十年
    body: 清闲的一个礼拜，Dale 把你叫进会所后面的办公室："你从来没问过我为什么留下来。十年，一个人守着这片沙子。"他拉出第二把椅子。
    options:
      A: 坐下来听他说
      B: 改天吧，活还多
  iw_hiring_day_1:
    title: 第一个招聘日
    body: 会所门口贴了告示，来了两个人。招了就每周付工资。
    options:
      A: 招 Rosa（维护工）
      B: 招 Ben（前台）
      C: 这次不招
  iw_hiring_day_2:
    title: 第二个招聘日
    body: 两周后又来了两个人：一位教练，一个干了半辈子的场地工。
    options:
      A: 招 Jess（教练）
      B: 招 Gus（维护老手）
      C: 这次不招
  iw_hiring_day_2b:
    title: 第二个招聘日
    body: 两周后又来了两个人：一个体能师，一个大学打完还想再拼一次的球员。
    options:
      A: 招 Kofi（体能师）
      B: 招 Amara（球员）
      C: 这次不招
  iw_hiring_day_3:
    title: 第三个招聘日
    body: 俱乐部有点名气了，来的人水平也高了：一个受过伤的天才少年，一位老教练。
    options:
      A: 招 Luca（球员）
      B: 招 Walt（老教练）
      C: 这次不招
  iw_hiring_day_3b:
    title: 第三个招聘日
    body: 俱乐部有点名气了：一个在巡回赛上穿过线的人，一个前台好手。
    options:
      A: 招 Teodora（穿线师）
      B: 招 Lily（前台好手）
      C: 这次不招
  iw_hiring_day_4:
    title: 第四个招聘日
    body: 一位前职业球员听说了这里，想来当主教练；还有一个什么都会一点的本地年轻人。
    options:
      A: 招 Nadia（前职业球员）
      B: 招 Marco（多面手）
      C: 这次不招
  iw_hiring_day_4b:
    title: 第四个招聘日
    body: 当年的场地主管听说俱乐部要活过来，自己找上门；还有一个当过球童的本地孩子。
    options:
      A: 招 Ray（老场地主管）
      B: 招 Mateo（球童）
      C: 这次不招
  iw_hiring_day_4c:
    title: 第四个招聘日
    body: 一个在 Indio 对着包装厂的墙练出来的本地球员，背着一包旧球拍自己找上门；音乐节搭台队的那个多面手也来了。
    options:
      A: 招 Diego（本地球员）
      B: 招 Marco（多面手）
      C: 这次不招

  iw_route_s2:
    title: 俱乐部往哪边走？
    body: 会所开张了，Dale 拿着那本旧宣传册站在大门口："带孩子的家庭，还是 Palm Springs 酒店来的客人？两头一起追不过来。"明天还不定，Dale 就按青训来。
    options:
      A: 青训之路：学院先开（会所是咖啡吧的话，可以改成理疗室）；来应聘的教练多；学院课多挣一点
      B: 度假之路：度假泳池先开（会所是理疗室的话，可以改成咖啡吧）；来应聘的服务、体能人员多；周末客人多
  iw_route_s3:
    title: Hal Brooks 要关掉西边几个洞
    body: 南墙外那片高尔夫球场一年不如一年：西边的球道黄了，沙坑漫了出来。老板 Hal Brooks 找上门："西边几个洞我不开了。那一段归你，连那道砌死的南门一起。铺成球场，还是留着我的水塘盖小屋，你定。"选了哪条，那块地马上开工，清理工单挂在新地的地点牌上。Hal 临走补了一句："明天还不定，我就当你要铺球场。"
    options:
      A: 南场：填掉水塘，铺两片新场（会员上限 +24、质量 +6）；5 张工单，共 $1000；离会所 47 分钟、离大门 105 分钟，要有人守着
      B: 绿洲草坪：留下水塘，盖三间小屋和小泳池庭院（周末度假客、小屋管家岗位、质量 +5）；3 张工单，共 $850；离会所 46 分钟；水费和空调按圈扣；会员上限不涨
  iw_route_s4:
    title: 岛往哪边长？
    body: 度假名园要地方，能往外长的只有东南角。把南停车场改成观赛坡、在东南角长出新地放车，还是把东南天上那座带两根旧网柱的小岛拉靠岸、搭一座桥过去？选了哪条马上开工。明天还不定，Dale 就按赛事广场来。
    options:
      A: 赛事广场：观赛坡和大遮阳棚（表演赛 +4%、门票 +$2000，邀请赛 +$500，赞助商来得早，周末赞助展台）；4 张工单，共 $1000；离大门 12 分钟、离会所 78 分钟；施工期间没有南停车场
      B: 学院岛：小岛靠岸，搭桥、宿舍、练习场（寄宿学员：学员押金 $1200、驻岛教练岗位、会员 +6、学院课每圈 +$2；青少年赛四强 +10% 马上就有）；4 张工单，共 $900；离大门 91 分钟、离会所 158 分钟；起风天关桥；表演赛不会变快
  iw_ending:
    title: 看台还没散，现在交账吗？
    body: 表演赛散场了，投资方还坐在第一排等你。"今天就可以给这一季打分，提前交卷算你的。也可以接着干到第 112 天：还有一场内赛，你的人也还能再长一截——可这几周的服务也记在账上，排不好人就往下掉。风季不等人。"
    options:
      A: 马上结算：今天就打分，每提前一天有奖励
      B: 接着经营到第 112 天：没有提前奖励，奖杯、解锁还能多；风季三周，外场掉得快一半（整季服务率也接着算）
log:
  night_care: 红土场养透了，这一周掉得慢三成
  dale_swept: Dale 离岗三小时，把掉得最厉害的那一处收拾了一遍
  dale_sweep_declined: 你跟 Dale 说你自己派人
  started: 你来到了废弃的 Palm Oasis 网球俱乐部。
  first_court: 会员场换上了新网：十年来第一块能打的场地
  ball_machine: 发球机修好了，学院的课更扎实了
  loan_declined: 你没借信用社的钱
  loan_settled: 信用社能收多少收了多少，剩下的镇上都在议论
  loan_paid: 信用社的贷款还清了
  clubhouse_open: 会所前台开张了，可以开招聘日了
  stadium_3_open: 匹克球场开放了
  stadium_2_open: 泳池放满水了
  stadium_1_open: 中心球场重建完成，可以办表演赛了
  sand_covered: 场地盖住了，沙没灌进来
  exhibition_flop: 表演赛冷场了：看台上稀稀拉拉，一周后再试一次
  no_hire: 这次没招人，活还是那几个人干
  golf_west_building: 高尔夫西段开工了，泳池那边听得见每一辆卡车
  pond_filled: 水塘填平了。Hal Brooks 站在球车道上看着，一句话没说
  south_courts_open: 南场开张：老南门后面又多了两片场
  oasis_lawn_open: 绿洲草坪开张。Hal 把剩下的球道卖给了酒店开发商，下一季多一个邻居
  se_corner_building: 东南角开工了
  event_plaza_open: 赛事广场开张：南停车场的地方立起了观赛坡和大遮阳棚
  academy_isle_open: 学院岛靠岸、桥通了，第一批寄宿学员搬了进来
  tournament_won: 你的球员在外面赢了一站比赛，带回了奖金
  tournament_lost: 你的球员这站输了，不过长了见识
  cup_hosted: 月度内赛办完了，奖杯放进了会所的柜子
  invitational_won: 邀请赛看台坐满了：一座奖杯，还有奖金
  invitational_flop: 邀请赛冷场了，报名费白花了

