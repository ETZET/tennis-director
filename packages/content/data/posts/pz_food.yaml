# 棕榈喷泉 · 午餐摊：11–14 点，打完球的人在棚子下面吃饭。
id: pz_food
act: indian_wells
at: plaza
skill: service
cycle: 1h
hours: [11, 14]
when: { facility: plaza, is: open }
effects:
  - { stat: cash, add: "round(7 * (0.6 + worker.skill / 100) * clamp(0.5 + stat.members / 40, 0.5, 2))" }
  - { stat: reputation, add: 0.01 }
  # 遮阳观赛坡（GM-13）：棚子外面也坐得住；喷雾杆再凉一点
  - { stat: cash, add: 2, if: { variant: plaza, is: shade_lawn } }
  - { stat: cash, add: 3, if: { upgrade: plaza, has: misters } }
# W2 复验（P1）：使用磨损再降到原来的十分之一。有人在岗的设施每天只掉一点（看场 + 上课的会员场约 1/天），
# 掉档要好几周、画面信号先出来；维护照旧能稳住、补回来，赛事日（t_umpire、t_courtside）磨得多
wear: 0.025