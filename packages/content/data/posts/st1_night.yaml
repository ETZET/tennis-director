# 中心球场 · 夜场（表演赛筹备的夜场灯，W2）：重建以后、立了灯杆，周四到周六 18–20 点灯下开放对打和小型表演。
id: st1_night
act: indian_wells
at: stadium_1
skill: service
cycle: 1h
hours: [18, 20]
days: [3, 4, 5]
when: { all: [{ facility: stadium_1, is: restored }, { upgrade: stadium_1, has: night_lights }] }
effects:
  - { stat: cash, add: "round(18 * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  - { stat: reputation, add: 0.03 }
wear: 0.6
performance: open_play
