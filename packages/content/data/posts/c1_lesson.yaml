# 1 号场青少年课：工作日下午放学的孩子。教练坐上这个位子，一小时一圈。
# 收入看教练的教学能力和会员规模；孩子跟着长进（教练专心时长得多）。
id: c1_lesson
act: hollow_creek
at: court_1
skill: teach
cycle: 1h
hours: [15, 18]
days: [0, 1, 2, 3, 4]
when: { any: [{ not: { weather: rain } }, { facility: bubble, is: inflated }] }
effects:
  - { stat: cash, add: "round(14 * (0.6 + worker.skill / 100) * clamp(stat.members / 50, 0.6, 1.6))" }
  - { person: mason, add: { skill: "0.25 * coach.attention" } }
  - { person: tyler, add: { skill: "0.15 * coach.attention" } }
wear: 1
performance: lesson
