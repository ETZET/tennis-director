# 青训场 · 周末开放：周末上午，来练球的人排着队。
id: pr_weekend
act: indian_wells
at: practice
skill: service
cycle: 1h
hours: [8, 13]
days: [5, 6]
when: { facility: practice, is: open }
effects:
  - { stat: cash, add: "round(6 * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  # 度假之路（GM-14，★2 选路 resort）：周末从 Palm Springs 的酒店来打球的客人多
  - { stat: cash, add: 2, if: { all: [{ route: s2, is: resort }, { expr: "weekday >= 5" }] } }
# W2 门评审（GM-1 问题 1、试玩 P1）：使用磨损减半（0.8 → 0.4），有人在岗、偶尔维护的场地两周内不再掉到 0
wear: 0.4
performance: open_play
