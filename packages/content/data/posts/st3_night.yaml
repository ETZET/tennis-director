# 匹克球场 · 灯下夜场（升级 league_lights，GM-13）：周五周六 17–20 点。匹克球夜联赛挣得多，网球夜场少一点。
id: st3_night
act: indian_wells
at: stadium_3
skill: service
cycle: 1h
hours: [17, 20]
days: [4, 5]
when: { all: [{ facility: stadium_3, is: open }, { upgrade: stadium_3, has: league_lights }] }
effects:
  - { stat: cash, add: "round((variant.stadium_3 == \"tennis2\" ? 8 : 14) * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  - { stat: reputation, add: 0.02 }
  # 匹克球夜里最吵：老会员那张卡没装隔音（iw_pickle_noise 的 A），每个夜场掉一点口碑
  - { stat: reputation, add: -0.04, if: { all: [{ not: { variant: stadium_3, is: tennis2 } }, { not: { flag: pickle_quiet } }] } }
# W2 门评审（GM-1 问题 1、试玩 P1）：使用磨损减半（0.8 → 0.4），有人在岗、偶尔维护的场地两周内不再掉到 0
wear: 0.4