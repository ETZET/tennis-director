# 红土场的第二个课：整好以后、会员够多，下午的孩子分成两组。人手又不够了。
id: clay_lesson
act: hollow_creek
at: clay_court
skill: teach
cycle: 1h
hours: [15, 18]
days: [0, 1, 2, 3, 4]
when:
  all:
    - { facility: clay, is: restored }
    - { stat: members, gte: 60 }
    - { not: { weather: rain } }
effects:
  - { stat: cash, add: "round(12 * (0.6 + worker.skill / 100) * clamp(stat.members / 50, 0.6, 1.6))" }
  - { stat: members, add: 1, chance: 0.03 }
wear: 1
performance: lesson
