# 青训场 · 体能课：工作日上午 8–11 点，只有体能师能带（特质 trainer）。退休会员和学院的孩子都来，带来会员。
id: pr_fitness
act: indian_wells
at: practice
skill: teach
cycle: 1h
hours: [8, 11]
days: [0, 1, 2, 3, 4]
when: { all: [{ facility: practice, is: open }, { expr: "hired.trainer >= 1" }] }
only: [trainer]
effects:
  - { stat: cash, add: "round(8 * (0.6 + worker.skill / 100) * clamp(0.5 + stat.members / 40, 0.5, 2))" }
  - { stat: members, add: 1, chance: 0.05 }
  - { stat: reputation, add: 0.02 }
# W2 复验（P1）：使用磨损再降到原来的十分之一。有人在岗的设施每天只掉一点（看场 + 上课的会员场约 1/天），
# 掉档要好几周、画面信号先出来；维护照旧能稳住、补回来，赛事日（t_umpire、t_courtside）磨得多
wear: 0.025
performance: lesson
