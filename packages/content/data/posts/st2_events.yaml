# 泳池 · 小木屋服务：周五到周日 10–18 点，送毛巾、送饮料、看着租出去的小木屋。
id: st2_events
act: indian_wells
at: stadium_2
skill: service
cycle: 1h
hours: [10, 18]
days: [4, 5, 6]
when: { all: [{ facility: stadium_2, is: open }, { not: { variant: stadium_2, is: recovery } }] }
effects:
  - { stat: cash, add: "round(22 * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  - { stat: reputation, add: 0.05 }
  - { stat: cash, add: 8, if: { upgrade: stadium_2, has: cabanas } }
wear: 1
