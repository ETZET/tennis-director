# 红土场 · 看场：两块场地，人多一点。
id: o23_rental
act: indian_wells
at: outer_23
skill: service
cycle: 1h
hours: [8, 17]
when: { facility: outer_23, is: playable }
effects:
  # 红土、硬地看场挣得一样多（GM-13）；赛事级红土再多一点
  - { stat: cash, add: "round(6 * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  - { stat: cash, add: 2, if: { upgrade: outer_23, has: tournament_clay } }
  - { stat: cash, add: 1, if: { upgrade: outer_23, has: pro_hard } }
  - { stat: members, add: 1, chance: 0.04 }
  # 度假之路（GM-14，★2 选路 resort）：周末从 Palm Springs 的酒店来打球的客人多
  - { stat: cash, add: 2, if: { all: [{ route: s2, is: resort }, { expr: "weekday >= 5" }] } }
# W2 门评审（GM-1 问题 1、试玩 P1）：使用磨损减半（0.8 → 0.4），有人在岗、偶尔维护的场地两周内不再掉到 0
wear: 0.4
performance: open_play
