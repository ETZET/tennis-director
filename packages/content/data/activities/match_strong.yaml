# 社区对抗赛 vs 松冠俱乐部，派最强阵容。
id: match_strong
duration: 2h
anchor: court_1
performance: match
effects:
  - { flag: match_played, set: true }
  - flag: match_won
    set: true
    chance: "clamp(0.2 + (coach.skill - 50) / 100 + (stat.quality - 50) / 80, 0.1, 0.9)"
  - { stat: reputation, add: 5, if: { flag: match_won } }
  - { stat: reputation, add: -1, if: { not: { flag: match_won } } }
  - { log: log.match_won, if: { flag: match_won } }
  - { log: log.match_lost, if: { not: { flag: match_won } } }
