# 社区对抗赛，让青少年上场。赢面小，但大家都爱看。
id: match_juniors
duration: 2h
anchor: court_1
performance: match
effects:
  - { flag: match_played, set: true }
  - flag: match_won
    set: true
    chance: "clamp((person.mason.skill - 30) / 60, 0.05, 0.7)"
  - { stat: reputation, add: 3 }
  - { flag: kid_shined, set: true, if: { flag: kid_mentored } }
  - { person: mason, add: { skill: 4 }, if: { flag: kid_mentored } }
