# 公告板：免费开放日（下午）。花点钱印传单；你亲自在 1 号场门口迎接能多拉几个人。
id: open_day
duration: 3h
anchor: court_1
performance: trial_day
program:
  parts: [pm]
  requires: { not: { weather: rain } }
effects:
  - { stat: cash, add: -60 }
  - { stat: members, add: "round(1 + stat.reputation / 20 + rand() * 2)" }
  - { stat: members, add: 1, if: { directorAt: court_1 } }
  - { log: log.trial_onsite, if: { directorAt: court_1 } }
  - { schedule: hc_discover_kid, in: 30m, chance: "clamp(0.25 + coach.skill / 200, 0, 0.9)" }
