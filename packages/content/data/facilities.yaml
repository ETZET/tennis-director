# Palm Oasis 的设施（ADR 0018：id 沿用原来的，stadium_3 是匹克球场、stadium_2 是泳池）。每个设施的第一个状态是开局废弃的样子，后面是一级级修好的样子（ADR 0015）。
# courts：能打网球的场地数；quality：对质量目标的贡献（状况低于 30 减半，到 0 归零）；
# decay_day：没人维护时每天掉多少状况（准则 6：没人管的地方慢慢变旧）。
# drops_to：周日收盘时状况低于幕规则 grade_drop_below，就掉到这一档（准则 6：先出画面信号，再掉档）。
# worn 是"停用"：没有场地、岗位不开、质量不算，状况不再往下掉；做一张重开工单（*_reopen）才回得来。
# 停用的设施还要付一部分维护费（看门、保险），比开着便宜。
- id: outer_1
  anchor: outer_1
  states:
    # 沙子盖住了大半个场地，网倒在地上
    sanded: {}
    # 沙扫掉了，网还没换
    swept: {}
    playable: { courts: 1, quality: 5, upkeep_week: 15, decay_day: 5, drops_to: worn }
    # 新铺的面没人管：先掉回旧场地（重新铺面的钱白花了），再掉就停用
    resurfaced: { courts: 1, quality: 10, upkeep_week: 20, decay_day: 3, drops_to: playable }
    # 沙子又盖住了线、网又松了：停用
    worn: { upkeep_week: 5 }
- id: outer_23
  anchor: outer_23
  states:
    ruined: {}
    playable: { courts: 2, quality: 9, upkeep_week: 30, decay_day: 5, drops_to: worn }
    worn: { upkeep_week: 10 }
- id: practice
  anchor: practice
  states:
    ruined: {}
    open: { courts: 2, quality: 7, upkeep_week: 30, decay_day: 4, drops_to: worn }
    worn: { upkeep_week: 10 }
- id: clubhouse
  anchor: clubhouse
  states:
    ruined: { quality: -2 }
    # 前台开张：有了服务岗位，也能开招聘日了
    open: { quality: 8, upkeep_week: 60, decay_day: 1.5, drops_to: worn }
    # 又漏又停电：前台关门
    worn: { upkeep_week: 20 }
- id: plaza
  anchor: plaza
  states:
    dry: { quality: -2 }
    open: { quality: 6, upkeep_week: 50, decay_day: 2.5, drops_to: worn }
    worn: { upkeep_week: 15 }
- id: stadium_3
  anchor: stadium_3
  states:
    # 下沉的场地大半被沙填满
    buried: {}
    dug: {}
    open: { courts: 1, quality: 8, upkeep_week: 80, decay_day: 4, drops_to: worn }
    worn: { upkeep_week: 25 }
- id: stadium_2
  anchor: stadium_2
  states:
    ruined: { quality: -1 }
    # 泳池不是球场：不算场地数（会员上限按场地算），质量和收入从岗位来
    open: { quality: 12, upkeep_week: 140, decay_day: 3, drops_to: worn }
    worn: { upkeep_week: 45 }
- id: stadium_1
  anchor: stadium_1
  states:
    # 东南角上层看台塌了，场地上全是碎石和沙
    ruined: { quality: -4 }
    cleared: { quality: -1 }
    restored: { courts: 1, quality: 20, upkeep_week: 300, decay_day: 2, drops_to: worn }
    worn: { upkeep_week: 100 }
