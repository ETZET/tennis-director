# 结局卡（W4，结局方案 A）：表演赛提前办成、升到 ★5 时来。投资方在看台上等你一句话：
# 现在就交账（马上结算，每提前一天 +30 分），还是接着经营到第 112 天（没有提前奖励；第 15 周内赛的奖杯、成长解锁、
# 现金还能涨，整季服务率接着算——排得好往上、排不好往下，掉档和破产的风险也还在）。表演赛提前几天的分（pace）
# 按办成那天算，两条路都拿得到。W4 门评审（同一批 60 个种子，good / average / novice 全部交账 vs 全部接着经营）：
# 接着经营更高的局 74% / 57% / 25%，中位差 +142 / +51 / −118——人排得稳的接着经营划算（后几周服务率往上拉、
# 多一座内赛奖杯），排得松的交账划算（后几周把整季服务率往下拖）。哪条都不压倒另一条，赌的是你对自己排班的把握。
# 倒计时到了按"接着经营"（不替玩家交卷）。
id: iw_ending
act: indian_wells
source: milestone
tone: neutral
pause: true
countdown: 1d
location: stadium_1
who: investors
options:
  A:
    effects:
      - { settle: true }
  B:
    # 风季（W4 门试玩 P1：接着经营什么都不做也只涨分）：接下来三周外场和训练场的收盘衰减 ×1.5。
    # 有人守、有人维护的场地顶得住；没人管的场地十来天就掉档——留下来就得接着排人。
    effects:
      - { decay_mult: { facility: outer_1, factor: 1.5, days: 21 } }
      - { decay_mult: { facility: outer_23, factor: 1.5, days: 21 } }
      - { decay_mult: { facility: practice, factor: 1.5, days: 21 } }
default: { then: B }
