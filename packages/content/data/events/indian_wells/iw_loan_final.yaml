# 展期也到了：信用社从账上扣钱，最多 $3000，但不会把账扣到 −$1000 以下（不让一笔贷款直接把俱乐部逼到破产）；
# 扣不够的部分变成坏名声：镇上都知道这里欠过钱。
id: iw_loan_final
act: indian_wells
source: consequence
tone: crisis
pause: true
countdown: 1h
location: entrance
who: lender
options:
  A:
    effects:
      # 先按扣款前的现金算名声（账上越空、欠得越多越难看），再扣钱
      - { stat: reputation, add: "-2 - max(0, 2000 - stat.cash) / 500" }
      - { stat: cash, add: "-min(3000, max(0, stat.cash + 1000))" }
      - { flag: loan_taken, set: false }
default: { then: A }
