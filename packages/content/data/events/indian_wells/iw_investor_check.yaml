# 第 13 周：投资方来看进度。只剩三周了——带他们去看修好的地方，还是先把手上的活干完？
id: iw_investor_check
act: indian_wells
source: calendar
tone: crisis
pause: true
countdown: 4h
location: entrance
who: investors
options:
  A:
    # 亲自带他们转：花总监半天，看到的越多越放心（声望）
    errand: { at: entrance, for: 3h }
    effects:
      - { stat: reputation, add: "restored * 1.5" }
      # 电话里拍过胸脯（iw_investor_call）：做到了加分，没做到扣分
      - { stat: reputation, add: 3, if: { all: [{ flag: investors_promised }, { expr: "restored >= 5" }] } }
      - { stat: reputation, add: -4, if: { all: [{ flag: investors_promised }, { expr: "restored < 5" }] } }
  B:
    # 让他们自己看：省时间
    effects:
      - { stat: reputation, add: -2 }
      - { stat: reputation, add: 3, if: { all: [{ flag: investors_promised }, { expr: "restored >= 5" }] } }
      - { stat: reputation, add: -4, if: { all: [{ flag: investors_promised }, { expr: "restored < 5" }] } }
      # 追加过预算（iw_investor_call）：他们本来就担心，没人陪着看更不放心
      - { stat: reputation, add: -3, if: { flag: investors_worried } }
default: { then: B }
