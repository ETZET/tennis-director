# 第 13 周：投资方来看进度。带他们去看修好的地方，还是先把手上的活干完？
# W4 门试玩：表演赛办成、接着经营的局也会来这张，文案不再说"只剩三周到期限"，改成"第 112 天打分"（两种局都对）。
# GM-14 合并：原来停滞时的"投资方来电"并进这张，"追加预算"成了第三项（少一张卡）。
id: iw_investor_check
act: indian_wells
source: calendar
tone: crisis
pause: true
countdown: 4h
location: entrance
who: investors
options:
  A:
    # 亲自带他们转：花总监半天，看到的越多越放心（声望）
    errand: { at: entrance, for: 3h }
    effects:
      # 修好几处给多少声望（约 × 1.5），写成定数（W2 门试玩：卡上要显示具体数字）
      - { stat: reputation, add: 2, if: { expr: "restored == 1" } }
      - { stat: reputation, add: 3, if: { expr: "restored == 2" } }
      - { stat: reputation, add: 5, if: { expr: "restored == 3" } }
      - { stat: reputation, add: 6, if: { expr: "restored == 4" } }
      - { stat: reputation, add: 8, if: { expr: "restored == 5" } }
      - { stat: reputation, add: 9, if: { expr: "restored == 6" } }
      - { stat: reputation, add: 11, if: { expr: "restored == 7" } }
      - { stat: reputation, add: 12, if: { expr: "restored >= 8" } }
  B:
    # 让他们自己看：省时间
    effects:
      - { stat: reputation, add: -2 }
  C:
    # 趁他们在，开口要钱：追加 $1500 给最后三周（表演赛的筹备、重建），可他们不放心了
    effects:
      - { stat: cash, add: 1500 }
      - { stat: reputation, add: -5 }
default: { then: B }
