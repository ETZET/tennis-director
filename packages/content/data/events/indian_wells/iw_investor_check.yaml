# 第 13 周：投资方来看进度。只剩三周了——带他们去看修好的地方，还是先把手上的活干完？
# GM-14 合并：原来停滞时的"投资方来电"并进这张，"追加预算"成了第三项（少一张卡）。
id: iw_investor_check
act: indian_wells
source: calendar
tone: crisis
pause: true
countdown: 4h
location: entrance
who: investors
options:
  A:
    # 亲自带他们转：花总监半天，看到的越多越放心（声望）
    errand: { at: entrance, for: 3h }
    effects:
      - { stat: reputation, add: "restored * 1.5" }
  B:
    # 让他们自己看：省时间
    effects:
      - { stat: reputation, add: -2 }
  C:
    # 趁他们在，开口要钱：追加 $1500 给最后三周（表演赛的筹备、重建），可他们不放心了
    effects:
      - { stat: cash, add: 1500 }
      - { stat: reputation, add: -5 }
default: { then: B }
