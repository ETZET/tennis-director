# 开局：Dale 带你转了一圈。仓库里还有一台旧发球机——留着以后修，还是现在卖掉换钱？
id: iw_arrival
act: indian_wells
source: milestone
tone: neutral
pause: true
location: entrance
who: dale
options:
  A:
    # 留着：练习场修好以后可以花点钱把它修好（工单 pr_ball_machine），学院的课更扎实
    effects:
      - { flag: ball_machine_kept, set: true }
      - { person: dale, add: { morale: 5 } }
