# 开局：Dale 带你转了一圈。仓库里还有一台旧发球机——留着以后修，还是现在卖掉换钱？
id: iw_arrival
act: indian_wells
source: milestone
tone: neutral
pause: true
# 放着不管一天就按"留着"处理：不然这张会暂停的卡永远开着，盖住员工条，导演也一直不发卡（e7）
countdown: 1d
location: entrance
who: dale
options:
  A:
    # 留着：青训场修好以后可以花点钱把它修好（工单 pr_ball_machine），学院的课更扎实
    effects:
      - { flag: ball_machine_kept, set: true }
      - { person: dale, add: { morale: 5 } }
  B:
    # 卖掉：开局多一笔钱，修东西更快
    effects:
      - { stat: cash, add: 400 }
      - { person: dale, add: { morale: -5 } }
default: { then: A }
