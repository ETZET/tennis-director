# 一个星期没动静、修复又落在进度后面时，投资方打来电话（导演在停滞时才放它出来，quiet_days）。
# 要钱就得让他们更不放心；拍胸脯保证，第 13 周来看的时候就要兑现（iw_investor_check 里结算）。
id: iw_investor_call
act: indian_wells
source: threshold
tone: crisis
once: true
countdown: 1d
when:
  all:
    - { expr: "quiet_days >= 7" }
    - { day: { gte: 30, lte: 80 } }
    # 落后于进度：大约每两周该修好一处
    - { expr: "restored < (day - 20) / 14" }
location: entrance
who: investors
options:
  A:
    # 请他们追加预算：现在多 $1500，可他们开始担心了，来看进度时更挑剔
    effects:
      - { stat: cash, add: 1500 }
      - { stat: reputation, add: -2 }
      - { flag: investors_worried, set: true }
  B:
    # 保证能赶上：不拿钱，他们暂时放心（声望 +1）；第 13 周来时修好 5 处以上再加分，没做到就扣分
    effects:
      - { stat: reputation, add: 1 }
      - { flag: investors_promised, set: true }
default: { then: B }
