# Dale 看你们闲了一天多，过来找你：俱乐部里还有能动手的活。两条有取舍的建议，或者你自己安排（e7：放置对照里没人告诉你下一步）。
# 只在开局几步、而且真的有人闲着时来；一局最多三次，隔十天，不是流水线。
id: iw_dale_nudge
act: indian_wells
source: threshold
tone: neutral
# 阈值卡默认只出现一次；这张可以再来（隔十天，最多三次）
once: false
cooldown: 10d
max_shown: 3
countdown: 6h
when:
  all:
    - { expr: "idle_days >= 1.5" }
    - any:
        - { facility: outer_1, is: sanded }
        - { facility: outer_1, is: swept }
        - all:
            - { facility: outer_23, is: ruined }
            - { any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }] }
            - { stat: cash, gte: 900 }
        - all:
            - { facility: clubhouse, is: ruined }
            - { not: { facility: outer_23, is: ruined } }
            - { stat: cash, gte: 1800 }
location: clubhouse
who: dale
options:
  A:
    # 交给 Dale：他闲下来就自己去干下一件修复（材料费开工时照扣），活交出去他高兴
    effects:
      - { task: o1_sweep, who: dale, if: { facility: outer_1, is: sanded } }
      - { task: o1_net, who: dale, if: { facility: outer_1, is: swept } }
      - task: o23_repair
        who: dale
        if:
          all:
            - { facility: outer_23, is: ruined }
            - { any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }] }
            - { stat: cash, gte: 900 }
      - task: ch_repair
        who: dale
        if:
          all:
            - { facility: clubhouse, is: ruined }
            - { not: { facility: outer_23, is: ruined } }
            - { stat: cash, gte: 1800 }
      - { person: dale, add: { morale: 3 } }
  B:
    # 不花钱：Dale 去镇上的公园教一堂免费体验课，三个小时，招一点名气和人；修复还是等着
    effects:
      - { errand: dale, at: entrance, for: 3h }
      - { stat: reputation, add: 1 }
      - { stat: members, add: 1, chance: 0.5 }
      - { person: dale, add: { fatigue: 10 } }
  C:
    # 你自己安排：什么都不动，钱也留着；Dale 觉得被晾着
    effects:
      - { person: dale, add: { morale: -3 } }
default: { then: C }
