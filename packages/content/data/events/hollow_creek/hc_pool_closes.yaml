# 换季：泳池该关了。夏末最后一个周日的晚上，泳池那边的人来问。
id: hc_pool_closes
act: hollow_creek
source: calendar
tone: neutral
countdown: 1d
location: pool
options:
  A:
    # 按时关：省下维护费
    effects:
      - { facility: pool, set: drained }
  B:
    # 再开一周（天气还暖）：家长高兴，多花一周的钱
    cost: 60
    effects:
      - { stat: reputation, add: 2 }
      - { schedule: hc_pool_closes_late, in: 7d }
default: { then: A }
