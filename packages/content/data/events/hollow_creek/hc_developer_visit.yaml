# 诱惑型选择：开发商出大价钱买地。接受就提前结束本幕，进坏结局。
id: hc_developer_visit
act: hollow_creek
source: threshold
tone: crisis
pause: true
when: { all: [{ day: { gte: 10 } }, { stat: cash, lt: 700 }] }
countdown: 6h
location: lot
who: developer
options:
  A:
    effects:
      - { endAct: lost, ending: sold_to_developer }
  B:
    effects:
      # 拒绝：街坊叫好，可董事会里有人想要这笔钱（董事会信心"事情办得怎样"一项 −3）
      - { stat: reputation, add: 2 }
      - { flag: developer_declined, set: true }
  C:
    effects:
      - { schedule: hc_developer_return, in: 5d }
default: { then: C }
