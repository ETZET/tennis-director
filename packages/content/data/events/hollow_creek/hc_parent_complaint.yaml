# 质量掉到 D 以下，家长找上门。
id: hc_parent_complaint
act: hollow_creek
source: threshold
tone: crisis
when: { all: [{ stat: quality, lt: 42 }, { coach: dale }] }
countdown: 2h
location: court_1
options:
  A:
    cost: 60
    effects:
      - { stat: reputation, add: 2 }
      - { schedule: hc_board_memo, in: 3h }
  B:
    # 许诺：她暂时留下，但董事会会更早来要说法
    effects:
      - { flag: promised_change, set: true }
      - { stat: reputation, add: 1 }
      - { schedule: hc_board_memo, in: 1h }
  C:
    # 站在教练这边：家长不高兴，但 Dale 被撑腰后会认真一点
    effects:
      - { stat: members, add: -2 }
      - { stat: reputation, add: -3 }
      - { person: dale, add: { morale: 15 } }
      - { stat: quality, add: 3 }
      - { flag: backed_dale, set: true }
      - { schedule: hc_board_memo, in: 3h }
default:
  then: C
