# 匹克球租场谈判（设计文档的示例卡）。现金和网球身份互相拉扯。
id: hc_pickleball_lease
act: hollow_creek
source: threshold
tone: neutral
when: { all: [{ day: { gte: 6 } }, { facility: court_2, is: rented_pickleball }] }
countdown: 1d
location: court_2
stage: { anchor: court_2, performance: pickleball }
options:
  A:
    effects:
      - { stat: cash, add: 800 }
      - { flag: pickleball_lease, set: true }
      - { flag: members_grumble, set: true }
      - { stat: members, add: -2 }
      - { stat: reputation, add: -2 }
      - { stat: pickleball_pressure, add: -10 }
  B:
    effects:
      - { facility: court_2, set: tennis }
      - { stat: pickleball_pressure, add: 20 }
      - { schedule: hc_pickleball_rant, in: 1d }
  C:
    requiresDirectorAt: court_2
    check: { stat: reputation, vs: 40 }
    onSuccess:
      - { facility: court_2, set: shared }
      - { flag: pickleball_friends, set: true }
      - { stat: pickleball_pressure, add: -10 }
      - { schedule: hc_tug_of_war, in: 2d }
    onFail:
      - { schedule: hc_pickleball_rant, in: 1d }
default:
  then: A
  extra:
    - { stat: reputation, add: -3 }
