# 里程碑：发现那个孩子。Dale 课上坐在地上发呆的 Mason，其实挥拍天生就对。
id: hc_discover_kid
act: hollow_creek
source: consequence
tone: relief
pause: true
countdown: 1d
location: court_1
options:
  A:
    cost: 200
    effects:
      - { person: mason, add: { skill: 8, morale: 15 } }
      - { flag: kid_mentored, set: true }
      - { flag: kid_noticed, set: true }
  B:
    # 告诉家长：口碑马上就有，但家长会盯着你兑现
    effects:
      - { stat: reputation, add: 2 }
      - { stat: members, add: 1 }
      - { flag: kid_noticed, set: true }
      - { schedule: hc_mason_parents, in: 2d }
  C:
    # 先不声张：不给孩子压力
    effects:
      - { flag: kid_noticed, set: true }
      - { person: mason, add: { morale: 8, skill: 2 } }
default: { then: C }
