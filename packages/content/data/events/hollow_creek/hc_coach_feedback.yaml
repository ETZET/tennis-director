# 日常：新教练下课后想听听你的意见。
id: hc_coach_feedback
act: hollow_creek
source: random
tone: neutral
when: { all: [{ not: { coach: none } }, { not: { coach: dale } }, { hour: { gte: 12 } }] }
cooldown: 2d
weight: 0.9
countdown: 2h
location: court_1
options:
  A:
    # 去场边看完下一节课再说
    requiresDirectorAt: court_1
    effects:
      - { stat: quality, add: 2 }
  B:
    # 批一台发球机
    cost: 120
    effects:
      - { stat: quality, add: 3 }
  C:
    # 改天再说：教练有点泄气
    effects:
      - { stat: quality, add: -1 }
      - { stat: reputation, add: 1 }
default: { then: C }
