# Boss：董事会表决。要亲自到露台上去讲；不去的话，董事会在你缺席时投票。
id: hc_board_vote
act: hollow_creek
source: calendar
tone: crisis
pause: true
countdown: 3h
location: deck
options:
  A:
    requiresDirectorAt: deck
    # 表决永远有风险：信心满格也只有八成五；再差也有一成多的机会
    check: { chance: "clamp((stat.board_support - 25) / 70, 0.12, 0.85)" }
    onSuccess:
      - { flag: board_vote_passed, set: true }
      - { log: log.vote_passed }
      - { schedule: hc_who_follows, in: 1h }
    onFail:
      - { log: log.vote_failed }
      - { endAct: lost, ending: club_sold }
  B:
    check: { chance: "clamp((stat.board_support - 35) / 70, 0.08, 0.75)" }
    onSuccess:
      - { flag: board_vote_passed, set: true }
      - { log: log.vote_passed }
      - { schedule: hc_who_follows, in: 1h }
    onFail:
      - { log: log.vote_failed }
      - { endAct: lost, ending: club_sold }
default: { then: B }
