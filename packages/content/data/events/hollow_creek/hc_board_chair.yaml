# 期中：董事会主席亲自来看。好的时候能锦上添花，差的时候是一次翻身的机会，也可能更糟。
id: hc_board_chair
act: hollow_creek
source: calendar
tone: crisis
pause: true
countdown: 3h
location: deck
who: board
options:
  A:
    # 亲自带她转一圈：看你平时把俱乐部做成什么样
    requiresDirectorAt: deck
    check: { chance: "clamp((stat.board_support - 10) / 60, 0.2, 0.9)" }
    onSuccess:
      - { flag: chair_impressed, set: true }
      - { stat: reputation, add: 2 }
    onFail:
      - { flag: chair_worried, set: true }
  B:
    # 把数字发给她：不冒险，也没加分
    effects:
      - { stat: reputation, add: -1 }
  C:
    # 开口要钱和时间：现金到手，董事会觉得你在拖
    effects:
      - { stat: cash, add: 600 }
      - { flag: board_impatient, set: true }
default:
  then: B
