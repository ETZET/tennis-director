# 翻身的机会：董事会信心很低时，一位老董事私下给你指一条路。
id: hc_last_chance
act: hollow_creek
source: threshold
tone: relief
when: { all: [{ day: { gte: 15 } }, { day: { lte: 34 } }, { stat: board_support, lt: 30 }] }
once: true
weight: 4
countdown: 1d
location: deck
who: board
options:
  A:
    # 开放日：花钱请所有人来，场面撑起来
    cost: 300
    effects:
      - { activity: open_house, in: 3h }
  B:
    # 向董事会立军令状：信心马上回来，三天后质量不到 50 就更惨
    effects:
      - { flag: turnaround_promised, set: true }
      - { schedule: hc_turnaround_check, in: 7d }
  C:
    effects: []
default: { then: C }
