# 告诉了家长 Mason 有天赋之后：家长来问什么时候开始正经练。
id: hc_mason_parents
act: hollow_creek
source: consequence
tone: neutral
countdown: 1d
location: court_1
options:
  A:
    cost: 200
    effects:
      - { person: mason, add: { skill: 8, morale: 15 } }
      - { flag: kid_mentored, set: true }
  B:
    # 让主教练多带带他：不花钱，主教练要分心
    requires: { not: { coach: none } }
    effects:
      - { person: mason, add: { skill: 4 } }
      - { stat: quality, add: -2 }
      - { flag: kid_mentored, set: true }
  C:
    effects:
      - { stat: reputation, add: -3 }
      - { person: mason, add: { morale: -10 } }
default: { then: C }
