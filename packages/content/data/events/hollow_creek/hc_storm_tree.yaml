# 顺风时的挫折：一场风暴把树刮倒在 1 号场的围网上。
id: hc_storm_tree
act: hollow_creek
source: threshold
tone: crisis
when: { all: [{ weather: wind }, { day: { gte: 10 } }, { stat: board_support, gt: 60 }] }
once: true
weight: 3
countdown: 4h
location: court_1
options:
  A:
    # 马上请人清走：贵，但课不停
    cost: 450
    effects:
      - { log: log.tree_cleared }
  B:
    # 叫会员一起来清：省钱长人情，人不够就清不干净
    requiresDirectorAt: court_1
    check: { stat: reputation, vs: 45 }
    onSuccess:
      - { stat: reputation, add: 3 }
    onFail:
      - { facility: court_1, set: worn }
      - { stat: quality, add: -3 }
  C:
    # 先关场：省钱，1 号场又坏了
    effects:
      - { facility: court_1, set: worn }
      - { stat: quality, add: -4 }
      - { stat: members, add: -1 }
default: { then: C }
