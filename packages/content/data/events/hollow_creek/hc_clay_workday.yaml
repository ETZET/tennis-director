# 红土场：发起社区劳动日，或者花钱外包。
id: hc_clay_workday
act: hollow_creek
source: threshold
tone: relief
when: { all: [{ day: { gte: 4 } }, { facility: clay, is: overgrown }, { stat: reputation, gte: 30 }] }
cooldown: 2d
countdown: 1d
location: clay_court
options:
  A:
    # 义务劳动：免费、长口碑，但来多少人看你的声望；人不够就只能先清一角
    requiresDirectorAt: clay_court
    check: { stat: reputation, vs: 35 }
    onSuccess:
      - { activity: workday, in: 1h }
    onFail:
      - { stat: reputation, add: 1 }
      - { log: log.workday_thin }
  B:
    # 请施工队：贵，但一定成，而且是专业的场地
    cost: 900
    effects:
      - { activity: contractor }
  C:
    effects: []
default: { then: C }
