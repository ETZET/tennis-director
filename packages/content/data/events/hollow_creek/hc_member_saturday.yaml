# 日常：一位老会员在路上拦住你，要回周六上午的场地时间。
id: hc_member_saturday
act: hollow_creek
source: random
tone: neutral
# 把周六上午还给他以后，这件事就算了结了，不再来（第二轮试玩 S5）
when: { all: [{ day: { gte: 2 } }, { not: { flag: saturday_returned } }] }
cooldown: 10d
weight: 0.6
countdown: 2h
location: deck
who: member
options:
  A:
    # 答应他：老会员高兴，匹克球那边不高兴
    effects:
      - { stat: members, add: 1 }
      - { stat: pickleball_pressure, add: 6 }
      - { flag: saturday_returned, set: true }
  B:
    # 请他喝杯咖啡慢慢聊
    errand: { at: deck, for: 1h }
    cost: 10
    effects:
      - { stat: reputation, add: 1 }
  C:
    effects:
      - { stat: members, add: -1, chance: 0.4 }
default: { then: C }
