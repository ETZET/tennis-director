# 教学卡：开局时 Dale 在课上玩手机。教玩家"走过去"这件事。
id: hc_dale_phone
act: hollow_creek
source: milestone
tone: crisis
pause: true
countdown: 1h
location: court_1
who: dale
stage: { anchor: court_1, performance: lesson }
options:
  A:
    errand: { at: court_1, for: 30m }
    effects:
      - { flag: dale_warned, set: true }
      - { stat: quality, add: 2 }
      - { person: dale, add: { morale: -5 } }
  B:
    # 远程半管：质量回来一点，家长看见你没下来
    effects:
      - { flag: dale_texted, set: true }
      - { stat: quality, add: 1 }
      - { stat: reputation, add: -1 }
  C:
    # 放过他：课更糟，但 Dale 记你的好
    effects:
      - { stat: quality, add: -3 }
      - { person: dale, add: { morale: 5 } }
default: { then: C }
