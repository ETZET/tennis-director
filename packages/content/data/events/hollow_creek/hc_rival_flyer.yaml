# 随机事件（M3 闸口示范：只加 YAML 和文案，不改代码）。
# 对面 Pine Crown 俱乐部把招生传单贴到了我们的围网上。会员越少越容易出现。
id: hc_rival_flyer
act: hollow_creek
source: random
tone: comedy
when: { stat: members, lt: 60 }
once: true
weight: 0.8
countdown: 2h
location: lot
who: rival
options:
  A:
    # 亲自去停车场，把传单换成我们自己的
    requiresDirectorAt: lot
    effects:
      - { stat: reputation, add: 2 }
      - { stat: members, add: 1, chance: 0.5 }
      - { schedule: hc_rival_van, in: 2d }
  B:
    # 打电话给 Pine Crown 抗议：看声望够不够硬
    check: { stat: reputation, vs: 40 }
    onSuccess:
      - { stat: reputation, add: 1 }
    onFail:
      - { stat: reputation, add: -2 }
  C:
    effects:
      - { stat: members, add: -1 }
default: { then: C }
