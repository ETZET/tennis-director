# 军令状到期：董事会来看质量有没有回到 50（一周后）。
id: hc_turnaround_check
act: hollow_creek
source: consequence
tone: crisis
pause: true
countdown: 2h
location: deck
who: board
options:
  A:
    effects:
      - { flag: broken_promise, set: true, if: { stat: quality, lt: 50 } }
      - { stat: reputation, add: -4, if: { stat: quality, lt: 50 } }
      - { log: log.promise_broken, if: { stat: quality, lt: 50 } }
      - { stat: reputation, add: 3, if: { stat: quality, gte: 50 } }
      - { log: log.promise_kept, if: { stat: quality, gte: 50 } }
default: { then: A }
