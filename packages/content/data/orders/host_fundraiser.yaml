# 募捐晚会：要人张罗半天（几个人一起更快），收多少看声望。
id: host_fundraiser
act: hollow_creek
at: deck
skill: service
work: 6h
crew: 3
cooldown: 7d
# 募捐会办在露台上：屋顶补好以前没法请人来
when: { all: [{ not: { weather: rain } }, { flag: roof_patched }] }
effects:
  - { stat: cash, add: "round(300 + stat.reputation * 12 + rand() * 300)" }
  - { stat: reputation, add: 1 }
performance: fundraiser
