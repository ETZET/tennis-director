# 邀请赛（P1 占位，LG-10）：★3 开，在红土场办一个周末，要会所和棕榈喷泉都开着。报名费 $800，三周一次。
# 天气不可控：下雨天几乎办不成，报名费白花。红土邀请赛认红土：保留红土的成功率高（接修复分叉）。
# 办成了奖杯 +1、算"办成过邀请赛"（★4 要）。完整的赛事阶梯留给 P2。
id: inv_clay
act: indian_wells
at: outer_23
skill: service
work: 8h
cost: 800
crew: 4
cooldown: 21d
when:
  all:
    - { expr: "stars >= 3" }
    - { facility: outer_23, is: playable }
    - { facility: clubhouse, is: open }
    - { facility: plaza, is: open }
check: { chance: "weather == \"rain\" ? 0.1 : clamp(0.45 + stat.reputation / 200 + (variant.outer_23 == \"clay\" ? 0.1 : 0), 0.1, 0.9)" }
onSuccess:
  - { stat: cash, add: 2000 }
  - { stat: reputation, add: 6 }
  - { trophy: 1 }
  - { flag: hosted_invitational, set: true }
  - { log: log.invitational_won }
onFail:
  - { stat: reputation, add: -2 }
  - { log: log.invitational_flop }
performance: match
