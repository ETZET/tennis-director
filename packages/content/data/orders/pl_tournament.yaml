# 出去打一站比赛：只有球员能去（作用 player）。从大门出发，Palm Springs、La Quinta 的地区赛，一周一次。
# 球技越高越可能赢（判定看去的那个人的球技）；赢了带回奖金和名气，输了也长见识。
id: pl_tournament
act: indian_wells
at: entrance
skill: play
work: 6h
cost: 120
crew: 1
cooldown: 6d
when: { expr: "hired.player >= 1" }
only: [player]
# 泳池修成冷水恢复池（GM-13）：球员恢复得好，胜率 +10%
check: { chance: "clamp(0.1 + (worker.skill - 50) / 45 + (variant.stadium_2 == \"recovery\" ? 0.1 : 0), 0.05, 0.9)" }
effects:
  - { stat: reputation, add: 1 }
  - { person: worker, add: { play: 1 } }
onSuccess:
  - { stat: cash, add: 600 }
  - { stat: reputation, add: 4 }
  # 赢一站算一座奖杯（LG-10，★3 要 2 座）
  # ★2 开出地区赛（ADR 0020）：★2 以前赢了只拿奖金和声望，★2 起赢了才算奖杯
  - { trophy: 1, if: { expr: "stars >= 2" } }
  - { log: log.tournament_won }
onFail:
  - { log: log.tournament_lost }
performance: match
