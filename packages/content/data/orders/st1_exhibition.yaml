# 在 中心球场 办一场表演赛：要有名气（声望 50 以上）才请得动人，要一群人张罗一整天。
# 来不来得了人看名气和场子好不好（判定）：办成了就通关；冷场了亏一笔，一周后可以再办。
# Dale 坐裁判椅 +5%；棕榈喷泉修成遮阳观赛坡 +5%（GM-13）；俱乐部里有一位退役名将（特质 legend）站台 +5%。
id: st1_exhibition
act: indian_wells
at: stadium_1
skill: service
work: 8h
cost: 3000
crew: 6
cooldown: 7d
# ★4 以后才办得成（LG-10、GM-9）
when: { all: [{ facility: stadium_1, is: restored }, { expr: "stars >= 4" }] }
# 表演赛四期筹备（W2）是加成不是门槛：不筹备最多七成五把握；看台 +8%、夜场灯 +4%、球童和服务 +10%；
# ★4 选了赛事广场（route s4 = event_plaza）再 +5%（观赛坡先搭起来了）。
check: { chance: "clamp(0.3 + (stat.reputation - 50) / 80 + (stat.quality - 60) / 100 + (flag.dale_umpire ? 0.05 : 0) + min(hired.legend, 1) * 0.05 + (variant.plaza == \"shade_lawn\" ? 0.05 : 0), 0.15, 0.75) + (flag.prep_stands ? 0.08 : 0) + (flag.prep_lights ? 0.04 : 0) + (flag.prep_service ? 0.1 : 0) + (route.s4 == \"event_plaza\" ? 0.05 : 0)" }
onSuccess:
  - { stat: cash, add: 6000 }
  # 筹备的回报：看台多卖票，转播费
  - { stat: cash, add: 1500, if: { flag: prep_stands } }
  - { stat: cash, add: 1000, if: { upgrade: stadium_1, has: broadcast } }
  # ★5 的条（GM-9）
  - { flag: exhibition_done, set: true }
  - { endAct: won, ending: exhibition }
onFail:
  - { stat: cash, add: 800 }
  - { stat: reputation, add: -6 }
  - { log: log.exhibition_flop }
performance: match
