# 青训场 · 青少年学院：工作日 14–18 点。会员多了，送孩子来的家长也多。
id: pr_academy
act: indian_wells
at: practice
skill: teach
cycle: 1h
hours: [14, 18]
days: [0, 1, 2, 3, 4]
when: { all: [{ facility: practice, is: open }, { not: { variant: practice, is: bootcamp } }] }
effects:
  - { stat: cash, add: "round(12 * (0.6 + worker.skill / 100) * clamp(0.5 + stat.members / 40, 0.5, 2)) + (flag.ball_machine ? 4 : 0)" }
  - { stat: members, add: 1, chance: 0.05 }
  - { stat: reputation, add: 0.03 }
  # 青训之路（GM-14，★2 选路 youth）：报青训的孩子多；★4 学院岛开了（W5）再多一点（寄宿学员下午也来）
  - { stat: cash, add: 2, if: { route: s2, is: youth } }
  - { stat: cash, add: 2, if: { all: [{ plot: se_corner, is: open }, { plot: se_corner, is: academy_isle }] } }
  - { stat: cash, add: 5, if: { upgrade: practice, has: video_wall } }
  # 青少年带教（W3 成长解锁 junior_coach：有一名教学 ≥ 65 的教练）：家长听说这里有够格的青训教练，学费高一点、报名的多一点
  - { stat: cash, add: 3, if: { unlocked: junior_coach } }
  - { stat: members, add: 1, chance: 0.03, if: { unlocked: junior_coach } }
# W2 复验（P1）：使用磨损再降到原来的十分之一。有人在岗的设施每天只掉一点（看场 + 上课的会员场约 1/天），
# 掉档要好几周、画面信号先出来；维护照旧能稳住、补回来，赛事日（t_umpire、t_courtside）磨得多
wear: 0.05
performance: lesson
