# 泳池 · 小木屋服务：周五到周日 10–18 点，送毛巾、送饮料、看着租出去的小木屋。
id: st2_events
act: indian_wells
at: stadium_2
skill: service
cycle: 1h
hours: [10, 18]
days: [4, 5, 6]
when: { all: [{ facility: stadium_2, is: open }, { not: { variant: stadium_2, is: recovery } }] }
effects:
  - { stat: cash, add: "round(22 * (0.6 + worker.skill / 100) * (1 + stat.reputation / 120))" }
  - { stat: reputation, add: 0.05 }
  - { stat: cash, add: 8, if: { upgrade: stadium_2, has: cabanas } }
  # 高尔夫西段施工（W5 地块 golf_west）：推土机、搅拌车就在泳池南边，客人待不住
  - { stat: cash, add: -3, if: { plot: golf_west, is: building } }
# W2 复验（P1）：使用磨损再降到原来的十分之一。有人在岗的设施每天只掉一点（看场 + 上课的会员场约 1/天），
# 掉档要好几周、画面信号先出来；维护照旧能稳住、补回来，赛事日（t_umpire、t_courtside）磨得多
wear: 0.05