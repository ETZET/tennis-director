# 第一个招聘日：会所前台开张了，门口贴了告示，来了两个人。工资每周扣。每一局都是这两个人：一个干活的，一个招呼人的。
# 选路（W2 门评审）：★2 的选路卡一般比这张早到。青训之路八成是 a 拨（Jess 教练、Gus 场地工），度假之路八成是 b 拨（Kofi 体能师、Amara 球员）。
id: iw_hiring_day_1
act: indian_wells
source: threshold
tone: relief
once: true
pause: true
countdown: 1d
when: { facility: clubhouse, is: open }
location: clubhouse
who: applicants
options:
  A:
    effects:
      - { hire: rosa_ortiz }
      # 下一个招聘日来哪一拨人，按这一局的种子抽
      - { flag: iw_hiring_day_2_b, set: true, chance: "route.s2 == \"youth\" ? 0.2 : (route.s2 == \"resort\" ? 0.8 : 0.5)" }
      - { schedule: iw_hiring_day_2, in: 14d, if: { not: { flag: iw_hiring_day_2_b } } }
      - { schedule: iw_hiring_day_2b, in: 14d, if: { flag: iw_hiring_day_2_b } }
  B:
    effects:
      - { hire: ben_kim }
      # 下一个招聘日来哪一拨人，按这一局的种子抽
      - { flag: iw_hiring_day_2_b, set: true, chance: "route.s2 == \"youth\" ? 0.2 : (route.s2 == \"resort\" ? 0.8 : 0.5)" }
      - { schedule: iw_hiring_day_2, in: 14d, if: { not: { flag: iw_hiring_day_2_b } } }
