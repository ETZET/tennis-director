      - { condition: stadium_1, add: 30, if: { all: [{ all: [{ facility: stadium_1, is: restored }, { expr: "condition.stadium_1 < 30" }] }, { not: { all: [{ any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }] }, { expr: "condition.outer_1 < 30" }] } }, { not: { all: [{ facility: outer_23, is: playable }, { expr: "condition.outer_23 < 30" }] } }, { not: { all: [{ facility: practice, is: open }, { expr: "condition.practice < 30" }] } }, { not: { all: [{ facility: clubhouse, is: open }, { expr: "condition.clubhouse < 30" }] } }, { not: { all: [{ facility: plaza, is: open }, { expr: "condition.plaza < 30" }] } }, { not: { all: [{ facility: stadium_3, is: open }, { expr: "condition.stadium_3 < 30" }] } }, { not: { all: [{ facility: stadium_2, is: open }, { expr: "condition.stadium_2 < 30" }] } }] } }
