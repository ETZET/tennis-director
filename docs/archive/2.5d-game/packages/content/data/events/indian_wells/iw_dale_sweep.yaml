# Dale 第一次看到哪一处掉到 30 以下（W2 门评审，GM-1 问题 1："开局悄悄崩盘"，以前只有一条快讯）。
# 一局只来一次：Dale 放下手上的事去收拾三小时（状况 +30），代价是他这三小时不在岗（课、主教练的专注）；
# 或者你自己派人——画面和快讯照旧提醒。好几处同时低于 30 时，Dale 去最前面那一处（会员场、红土场、青训场、会所……）。
# 卡预算：同时"起风了"一局最多一次（以前两次），总数不变。
id: iw_dale_sweep
act: indian_wells
source: threshold
tone: crisis
once: true
countdown: 4h
when:
  any:
    - { all: [{ any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }] }, { expr: "condition.outer_1 < 30" }] }
    - { all: [{ facility: outer_23, is: playable }, { expr: "condition.outer_23 < 30" }] }
    - { all: [{ facility: practice, is: open }, { expr: "condition.practice < 30" }] }
    - { all: [{ facility: clubhouse, is: open }, { expr: "condition.clubhouse < 30" }] }
    - { all: [{ facility: plaza, is: open }, { expr: "condition.plaza < 30" }] }
    - { all: [{ facility: stadium_3, is: open }, { expr: "condition.stadium_3 < 30" }] }
    - { all: [{ facility: stadium_2, is: open }, { expr: "condition.stadium_2 < 30" }] }
    - { all: [{ facility: stadium_1, is: restored }, { expr: "condition.stadium_1 < 30" }] }
location: clubhouse
who: dale
