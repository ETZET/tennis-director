# 修青训场：两块并排的场地，围网倒了一半。红土场 修好以后才排得上。
id: pr_repair
act: indian_wells
at: practice
skill: upkeep
work: 10h
cost: 800
crew: 3
once: true
when: { all: [{ facility: practice, is: ruined }, { any: [{ facility: outer_23, is: playable }, { facility: outer_23, is: worn }] }] }
restore: 80
effects:
  - { facility: practice, set: open }
  - { stat: reputation, add: 2 }
performance: workday
# 修成什么（GM-13）：学院要发球机位、学员看板；晨间训练营只要标志桶、跑道和几件器械，便宜
variants:
  # ★2 选了度假之路（GM-14）：学院晚一星才开（★3），先只有训练营；青训之路、还没选路时照常
  academy: { when: { any: [{ route: s2, is: none }, { route: s2, is: youth }, { expr: "stars >= 3" }] } }
  bootcamp: { cost: 600, work: 9h }
