# 修红土场：扶起围网、补裂缝、换两张网。会员场 能用了才腾得出手。
id: o23_repair
act: indian_wells
at: outer_23
skill: upkeep
work: 12h
cost: 900
crew: 3
once: true
when:
  all:
    - { facility: outer_23, is: ruined }
    - { any: [{ facility: outer_1, is: playable }, { facility: outer_1, is: resurfaced }, { facility: outer_1, is: worn }] }
restore: 80
effects:
  - { facility: outer_23, set: playable }
  - { stat: reputation, add: 2 }
performance: workday
# 修成什么（GM-13）：红土照原样耙平；硬地要铺沥青和面层，贵一点、慢一点
variants:
  clay: {}
  hard: { cost: 1000, work: 13h }
