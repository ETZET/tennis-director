# 修 泳池：换座位、补遮阳布、铺场地。匹克球场 开了以后才排得上。
id: st2_repair
act: indian_wells
at: stadium_2
skill: upkeep
work: 24h
cost: 4500
crew: 5
once: true
when: { all: [{ facility: stadium_2, is: ruined }, { any: [{ facility: stadium_3, is: open }, { facility: stadium_3, is: worn }] }] }
restore: 80
effects:
  - { facility: stadium_2, set: open }
  - { stat: reputation, add: 4 }
  - { log: log.stadium_2_open }
performance: contractor
# 修成什么（GM-13）：度假泳池（躺椅、小木屋），还是冷水恢复池（便宜、快、给球员用）
variants:
  # ★2 选了青训之路（GM-14）：度假泳池晚一星才开（★3），先只有冷水恢复池；度假之路、还没选路时照常
  resort: { when: { any: [{ route: s2, is: none }, { route: s2, is: resort }, { expr: "stars >= 3" }] } }
  recovery: { cost: 3800, work: 20h }
