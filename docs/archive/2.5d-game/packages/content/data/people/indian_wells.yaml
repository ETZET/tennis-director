# Indian Wells 的人物。director 是总监本人；candidate 是招聘日能招来的人。
# kind：coach 教练 / crew 维护工 / special 特殊作用人物 / player 球员。
# skill = 教学，upkeep = 维护，service = 服务，play = 球技（ADR 0012；球技只有球员用）。总监没有士气，能力随干活慢慢涨。
# 一句话背景在 i18n 的 bios.<id>，特质在 traits.yaml。名字和经历都是虚构的。
- { id: director, name: Director, role: director, skill: 30, upkeep: 35, service: 40, morale: 100 }
# Dale：园区关门以后一直守在这里的老教练。开局不开除（核心玩法决定）。
# 潜力（W3，GM-11）：Dale 年轻时是这一带最好的青训教练，十年没上过课，手生了——教学能涨回 70（过得了教练的钥匙 65），
# 维护和服务只是凑合（默认 +15）。
- {
    id: dale,
    name: Dale Pruitt,
    role: coach,
    kind: coach,
    skill: 45,
    upkeep: 40,
    service: 20,
    play: 30,
    morale: 55,
    wage_week: 150,
    potential: { teach: 70 },
  }

