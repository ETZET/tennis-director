 ['p_e','e_f'],['e_f','@plaza'],['p_e','e_pb'],['e_pb','@stadium_3'],['e_pb','e_q'],['e_q','q_mid'],['q_mid','q_w'],['q_w','w_pool'],['w_pool','p_w'],
 ['w_pool','@stadium_2'],['p_w','@clubhouse'],['q_mid','@practice'],['q_mid','@outer_1'],['q_mid','@outer_23'],['p_mid','q_mid'],['q_w','w_s2'],['w_s2','w_s']];

/* ================= utils ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(i,j,s=0){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}

 const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz;}
function fbm(x,z,s=0){return vnoise(x,z,s)*.5+vnoise(x*2.13,z*2.13,s+7)*.3+vnoise(x*4.37,z*4.37,s+13)*.2;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

const ph=h=>{const c=hx(h);return pk(c[0],c[1],c[2]);};
function mixP(a,b,t){const ar=a&255,ag=(a>>>8)&255,ab=(a>>>16)&255;return pk(ar+((b&255)-ar)*t,ag+(((b>>>8)&255)-ag)*t,ab+(((b>>>16)&255)-ab)*t);}

function nightRGB(r,g,b,L){return[r*(0.22+0.78*L)+10*(1-L)+14*L,g*(0.27+0.66*L)+12*(1-L)+6*L,b*(0.48+0.44*L)+34*(1-L)];}
let night=false;
const CC=new Map();
function col(h,f=1,lit=0){const key=h+f+'|'+lit+(night?'n':'d');let v=CC.get(key);if(v!==undefined)return v;let[r,g,b]=hx(h);r*=f;g*=f;b*=f;
 if(night)[r,g,b]=nightRGB(r,g,b,lit);v=pk(r,g,b);CC.set(key,v);return v;}
function em(h,f=1){const c=hx(h);return pk(c[0]*f,c[1]*f,c[2]*f);}

/* ================= state & view ================= */
const Q=new URLSearchParams(location.search);
let level=+(Q.get('lv')||3);night=Q.get('night')==='1';let rot=+(Q.get('rot')||0)&3;let showLabels=Q.get('labels')!=='0';
const SHOT=Q.get('shot')==='1';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),octx=ov.getContext('2d');
let BW=0,BH=0,PS=1,k=2,panX=0,panY=0,OX=0,OY=0,SP=1,imgD,buf,base,prevBuf=null,transT=-1;
const HV=1.225,CX=12,CZ=13;
// rx=a*dx+b*dz ; rz=c*dx+d*dz — rotation by any angle (smooth Q/E)
let M=[1,0,0,1],ang=rot*Math.PI/2,angT=ang,rotFrom=ang,rotStart=-1;
function setM(a){const c=Math.cos(a),s=Math.sin(a);M=[c,-s,s,c];}
if(Q.get('ang'))ang=angT=(+Q.get('ang'))*Math.PI/180;setM(ang);
let BDC=null;
function Rv(x,z){const m=M;return[m[0]*x+m[1]*z,m[2]*x+m[3]*z];}
function P(x,y,z){const m=M,dx=x-CX,dz=z-CZ,rx=m[0]*dx+m[1]*dz,rz=m[2]*dx+m[3]*dz;return[OX+(rx-rz)*k,OY+(rx+rz)*k*.5-y*k*HV];}

const vis=(nx,nz)=>{const r=Rv(nx,nz);return r[0]+r[1]>0.01;};
const LX=-0.6,LZ=0.8;const faceF=(nx,nz)=>0.70+0.2*(nx*LX+nz*LZ);
let dirty=true;

/* ================= raster ================= */
const XS=new Float64Array(32);
function fillPoly(p,c,sh){const n=p.length>>1;let mn=1e9,mx=-1e9;for(let i=1;i<p.length;i+=2){if(p[i]<mn)mn=p[i];if(p[i]>mx)mx=p[i];}
 const y0=Math.max(0,Math.ceil(mn-.5)),y1=Math.min(BH-1,Math.floor(mx-.5));
 for(let y=y0;y<=y1;y++){const yc=y+.5;let m=0;
  for(let i=0,j=n-1;i<n;j=i++){const yi=p[i*2+1],yj=p[j*2+1];if((yi<=yc&&yj>yc)||(yj<=yc&&yi>yc))XS[m++]=p[i*2]+(yc-yi)*(p[j*2]-p[i*2])/(yj-yi);}
  for(let a=1;a<m;a++){const v=XS[a];let b=a-1;while(b>=0&&XS[b]>v){XS[b+1]=XS[b];b--;}XS[b+1]=v;}
  const row=y*BW;
  for(let a=0;a+1<m;a+=2){const xa=Math.max(0,Math.ceil(XS[a]-.5)),xb=Math.min(BW-1,Math.floor(XS[a+1]-.5));
   if(sh){for(let x=xa;x<=xb;x++){const v=sh(x,y);if(v)buf[row+x]=v;}}else for(let x=xa;x<=xb;x++)buf[row+x]=c;}}}
function wpoly(pts,c,sh){const f=[];for(const p of pts){const s=P(p[0],p[1],p[2]);f.push(s[0],s[1]);}fillPoly(f,c,sh);return f;}
function pix(x,y,c){x|=0;y|=0;if(x>=0&&y>=0&&x<BW&&y<BH)buf[y*BW+x]=c;}
function rect(x,y,w,h,c){x=Math.round(x);y=Math.round(y);for(let j=Math.max(0,y);j<Math.min(BH,y+h);j++)for(let i=Math.max(0,x);i<Math.min(BW,x+w);i++)buf[j*BW+i]=c;}
function line(x0,y0,x1,y1,c,w=1,pat){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
 const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy,n=0;
 for(;;){if(!pat||pat(n))(w===1?pix(x0,y0,c):rect(x0-(w>>1),y0,w,1,c));n++;if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function wline(a,b,c,w=1,pat){const p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);line(p[0],p[1],q[0],q[1],c,w,pat);}
function ell(cx,cy,rx,ry,c,sh){const y0=Math.max(0,Math.ceil(cy-ry-.5)),y1=Math.min(BH-1,Math.floor(cy+ry-.5));

/* ================= 3D-ish primitives ================= */
function box(x0,x1,z0,z1,y0,y1,h,o={}){const lit=o.lit||0;
 const F=[[1,0,[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]]],[-1,0,[[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]]],

 for(const[nx,nz,pts]of F){if(!vis(nx,nz))continue;const c=col(o.side||h,faceF(nx,nz)*(o.sf||1),lit);
  const sp=wpoly(pts,c,o.sideSh?o.sideSh(nx,nz,pts,c):null);if(o.face)o.face(nx,nz,sp);}
 if(!o.noTop){const tc=col(o.top||h,o.tf||1,lit);const tp=[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];wpoly(tp,tc,o.topSh?o.topSh(tc):null);

function hipRoof(x0,x1,z0,z1,y,rise,h,o={}){const lit=o.lit||0;const cx=(x0+x1)/2,cz=(z0+z1)/2;let r0,r1,faces;

 if(x1-x0>=z1-z0){const hh=(z1-z0)/2;r0=[x0+hh,y+rise,cz];r1=[x1-hh,y+rise,cz];faces=[[0,-1,[A,B,r1,r0],[A,B]],[0,1,[D,C,r1,r0],[D,C]],[-1,0,[A,D,r0],[A,D]],[1,0,[B,C,r1],[B,C]]];}
 else{const hh=(x1-x0)/2;r0=[cx,y+rise,z0+hh];r1=[cx,y+rise,z1-hh];faces=[[-1,0,[A,D,r1,r0],[A,D]],[1,0,[B,C,r1,r0],[B,C]],[0,-1,[A,B,r0],[A,B]],[0,1,[D,C,r1],[D,C]]];}
 faces.sort((a,b)=>(vis(a[0],a[1])?1:0)-(vis(b[0],b[1])?1:0));
 for(const[nx,nz,pts,eave]of faces){const f=0.86+0.2*(nx*LX+nz*LZ);const c1=col(h,f,lit),c2=col(h,f*0.84,lit);
  const e0=P(...eave[0]),e1=P(...eave[1]);const sp=wpoly(pts,c1,stripeSh(e0[0],e0[1],e1[0],e1[1],Math.max(2,k*0.75),c1,c2));
  if(o.holes)o.holes(nx,nz,pts);
  line(e0[0],e0[1],e1[0],e1[1],col(h,f*0.62,lit));}

 const sh=(px)=>{const t=(px+.5-a[0])/rx;return t<-0.35?c1:t<0.35?c2:c3;};
 ell(a[0],a[1],rx,ry,0,(px,py)=>sh(px));rect(a[0]-rx+.5,b[1],Math.round(rx*2),Math.max(0,Math.round(a[1]-b[1])),0);

 if(!o.noTop)ell(b[0],b[1],rx,ry,col(o.top||h,1.05,lit));}

/* ================= ground texture ================= */
const TS=0.2;const TW=Math.round((SL.x1-SL.x0)/TS),TH=Math.round((SL.z1-SL.z0)/TS);
let TEXD=new Uint32Array(TW*TH),TEXN=null;const TEXC={};
function paintRect(x0,x1,z0,z1,fn){const i0=Math.max(0,Math.ceil((x0-SL.x0)/TS-.5)),i1=Math.min(TW-1,Math.floor((x1-SL.x0)/TS-.5));
 const j0=Math.max(0,Math.ceil((z0-SL.z0)/TS-.5)),j1=Math.min(TH-1,Math.floor((z1-SL.z0)/TS-.5));
 for(let j=j0;j<=j1;j++){const z=SL.z0+(j+.5)*TS;for(let i=i0;i<=i1;i++){const x=SL.x0+(i+.5)*TS;const v=fn(x,z,TEXD[j*TW+i],i,j);if(v)TEXD[j*TW+i]=v;}}}
function paintCirc(cx,cz,r,fn){paintRect(cx-r,cx+r,cz-r,cz+r,(x,z,c,i,j)=>{const d=Math.hypot(x-cx,z-cz);return d<=r?fn(x,z,c,d,i,j):0;});}

const st=f=>level===1?0:level===3?1:({clubhouse:1,terrace:1,practice:1,member:1,fountain:1,center:0,clay:0,pickle:0,pool:0,lawn:0,parking:0,wall:0}[f]);
const RESTORED2=[{x0:-64,x1:-24,z0:-43,z1:-8},{x0:-34,x1:34,z0:-3,z1:15},{x0:-34,x1:-0.5,z0:15,z1:34},{x0:32,x1:56,z0:-36,z1:-12},{x0:-38,x1:60,z0:-8.6,z1:-4.4}];
function grassAmt(x,z){if(level===3)return 1;if(level===1)return 0;let best=0;for(const r of RESTORED2){const dx=Math.max(r.x0-x,0,x-r.x1),dz=Math.max(r.z0-z,0,z-r.z1);best=Math.max(best,1-Math.hypot(dx,dz)/7);}return best;}

 for(const[hc,amp,fr,seed]of layers){const c=hx(hc);const cc=pk(c[0],c[1],c[2]),ch=pk(c[0]*1.12+10,c[1]*1.1+8,c[2]*1.06+6),cd=pk(c[0]*0.9,c[1]*0.9,c[2]*0.92);
  for(let x=0;x<BW;x++){const wx=(x-OX)/k*0.6;const n=fbm(wx*fr,seed,seed),n2=Math.abs(vnoise(wx*fr*3,seed+1,seed)-0.5)*2;const h=Math.round((n*0.8+n2*0.25)*amp*k*1.05*AM);
   const y0=hy-h;for(let y=Math.max(0,y0);y<Math.min(BH,hy+2);y++){const sl=fbm(wx*fr*6,y*0.05,seed+4);base[y*BW+x]=y===y0?ch:(sl>0.58?ch:sl<0.4?cd:cc);}}}
 const pl=night?[[30,26,48],[22,20,38]]:[[226,196,152],[206,170,128]];
 for(let y=Math.max(0,hy+2);y<BH;y++){const t=clamp((y-hy)/(BH-hy),0,1);for(let x=0;x<BW;x++){const tt=t+(bay(x,y)-0.5)*0.15+(fbm((x-OX)/k*0.05,y*0.08,5)-0.5)*0.5;const c=tt<0.5?pl[0]:pl[1];base[y*BW+x]=pk(c[0],c[1],c[2]);}}}
function rebuildBase(){buf=base;if(rotStart>=0&&BDC&&BDC.length===base.length)base.set(BDC);else{drawBackdrop();BDC=base.slice();}
 // slab sides
 const D=7;const lit=0;
 box(SL.x0,SL.x1,SL.z0,SL.z1,-D,0,'#b98a58',{noTop:true,sideSh:(nx,nz,pts,cc)=>{const a=P(...pts[3]),b=P(...pts[2]);const sl=(b[1]-a[1])/((b[0]-a[0])||1);
  const L=[col('#d9b07a',faceF(nx,nz)),col('#c0905c',faceF(nx,nz)),col('#a8784a',faceF(nx,nz)),col('#8e623e',faceF(nx,nz)),col('#74503a',faceF(nx,nz))];
  return(x,y)=>{const top=a[1]+(x+.5-a[0])*sl;const d=(y+.5-top)/(k*HV)+Math.sin(x*0.13)*0.35+(bay(x,y)-0.5)*0.4;return d<0.6?L[0]:d<2.2?L[1]:d<4?L[2]:d<5.6?L[3]:L[4];};}});
 // ground
 const tex=night?TEXN:TEXD;const its=1/TS;const ik=1/k;const m=M;
 for(let y=0;y<BH;y++){const bb=2*(y+.5-OY)*ik;const a0=(0.5-OX)*ik;
  let rx=(a0+bb)*.5,rz=(bb-a0)*.5;const drx=ik*.5,drz=-ik*.5;
  let wx=CX+m[0]*rx+m[2]*rz,wz=CZ+m[1]*rx+m[3]*rz;const dwx=m[0]*drx+m[2]*drz,dwz=m[1]*drx+m[3]*drz;
  let u=(wx-SL.x0)*its,v=(wz-SL.z0)*its;const du=dwx*its,dv=dwz*its;const row=y*BW;
  for(let x=0;x<BW;x++,u+=du,v+=dv){if(u>=0&&v>=0&&u<TW&&v<TH)base[row+x]=tex[(v|0)*TW+(u|0)];}}
 // slab top edge highlight
 dirty=false;}

/* ================= decals (pool pit) ================= */
function drawPool(){const pf=st('pool');const d=pf?0.35:2.0;const x0=POOL.x0,x1=POOL.x1,z0=POOL.z0,z1=POOL.z1;
 const flp=[[x0,-d,z0],[x1,-d,z0],[x1,-d,z1],[x0,-d,z1]];const tile=col(pf?'#bfe6ee':'#a9c7cc',1,0);
 if(pf){const w1=night?em('#1f9fc4'):col('#38b4dc',1,0),w2=night?em('#5fd8ef'):col('#7ad6ee',1,0),w3=night?em('#178ab0'):col('#2a9ccc',1,0),ln=night?em('#16749a'):col('#2a7fb0',1,0);
  wpoly(flp,0,(px,py)=>{const w=unP(px+.5,py+.5,-d);const s=Math.sin(w[0]*1.6+T*1.8)+Math.sin(w[1]*2.1-T*1.4+w[0]*0.5);if(Math.abs(w[1]-8)<0.15||Math.abs(w[1]-5.5)<0.12||Math.abs(w[1]-10.5)<0.12)return ln;
   return s>1.35?w2:s<-1.2?w3:w1;});}
 else{const sc=col('#7a8f3a',1,0),sc2=col('#5f7230',1,0),lf=col('#8a6a3a',1,0),cr=col('#6f8288',1,0);
  wpoly(flp,0,(px,py)=>{const w=unP(px+.5,py+.5,-d);const n=fbm(w[0]*.25,w[1]*.25,3);if(hash(px,py,9)>0.97)return lf;if(Math.abs(fbm(w[0]*.3,w[1]*.3,8)-0.5)<0.015)return cr;
   return n>0.6?sc2:n>0.5?sc:tile;});}
 const walls=[[1,0,[[x0,0,z0],[x0,0,z1],[x0,-d,z1],[x0,-d,z0]]],[-1,0,[[x1,0,z0],[x1,0,z1],[x1,-d,z1],[x1,-d,z0]]],[0,1,[[x0,0,z0],[x1,0,z0],[x1,-d,z0],[x0,-d,z0]]],[0,-1,[[x0,0,z1],[x1,0,z1],[x1,-d,z1],[x0,-d,z1]]]];
 for(const[nx,nz,pts]of walls){if(!vis(nx,nz))continue;const c=col(pf?'#9fd6e2':'#b9cfd2',faceF(nx,nz)*0.95,0),c2=col('#6f8a6a',faceF(nx,nz),0);
  wpoly(pts,c,pf?null:(px,py)=>{const w=unP(px+.5,py+.5,-1.2);return hash(px,py>>1,4)>0.85?c2:c;});}
 // restore anything outside the pool footprint
 const sp=[...flp,[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]].map(p=>P(p[0],p[1],p[2]));let a=1e9,b=-1e9,c=1e9,e=-1e9;for(const p of sp){a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);e=Math.max(e,p[1]);}
 for(let y=Math.max(0,Math.floor(c));y<=Math.min(BH-1,Math.ceil(e));y++)for(let x=Math.max(0,Math.floor(a));x<=Math.min(BW-1,Math.ceil(b));x++){const w=unP(x+.5,y+.5,0);if(w[0]<x0||w[0]>x1||w[1]<z0||w[1]>z1)buf[y*BW+x]=base[y*BW+x];}
 if(!pf){ // ladder
  const lc=col('#c0c6cc',1,0);wline([x1-1,0.6,z0+0.1],[x1-1,-1.6,z0+0.1],lc);wline([x1-1.6,0.6,z0+0.1],[x1-1.6,-1.6,z0+0.1],lc);}}

/* ================= frame ================= */
let frameBuf;
function resize(){const W=innerWidth,H=innerHeight;PS=W>=820?2:1;BW=Math.ceil(W/PS);BH=Math.ceil(H/PS);cv.width=BW;cv.height=BH;
 imgD=ctx.createImageData(BW,BH);frameBuf=new Uint32Array(imgD.data.buffer);base=new Uint32Array(BW*BH);
 const dpr=Math.min(3,devicePixelRatio||1);ov.width=Math.round(W*dpr);ov.height=Math.round(H*dpr);octx.setTransform(dpr,0,0,dpr,0,0);
 fitView();}
function fitView(){const W=BW,H=BH;const portrait=H>W*1.1;
 if(portrait){k=W*1.1/219;panX=-((-2-CX)-(4.5-CZ))*k;panY=-(((-2-CX)+(4.5-CZ))*0.5)*k;OY0=H*0.57;}
 else{k=Math.min(W*0.97/314,(H*0.80)/164);panX=0;panY=0;OY0=H*0.56;}
 if(Q.get('z')){const zf=+Q.get('z'),fx=+(Q.get('fx')||0),fz=+(Q.get('fz')||0);k*=zf;const m=M,dx=fx-CX,dz=fz-CZ,rx=m[0]*dx+m[1]*dz,rz=m[2]*dx+m[3]*dz;panX=-(rx-rz)*k;panY=-(rx+rz)*0.5*k+(H*0.5-OY0);}
 panX=Math.round(panX);panY=Math.round(panY);SP=Math.max(1,Math.round(k/3.2));dirty=true;}
let OY0=0;
function setView(){OX=Math.round(BW/2+panX);OY=Math.round(OY0+panY);SP=Math.max(1,Math.round(k/3.2));}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 if(rotStart>=0){const u=Math.min(1,(now-rotStart)/450);const e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;ang=rotFrom+(angT-rotFrom)*e;setM(ang);dirty=true;if(u>=1){ang=angT;setM(ang);rotStart=-1;BDC=null;}}
 setView();
 if(dirty){rebuildBase();}
 buf=frameBuf;buf.set(base);
 drawPool();
 updActors(dt);
 drawSorted(S.concat(FR));
 if(night){for(const l of LIGHTS){const p=P(l.x,l.y,l.z);let i=l.i;if(l.flick)i*=(Math.sin(T*23)>0.3||Math.sin(T*3.1)>0.6)?1:0.1;glow(p[0],p[1],(l.flood?l.r*0.6:l.r)*k*0.55+2,l.c,i);if(l.flood)rect(p[0]-1,p[1]-1,3,2,em('#ffffff'));}}
 if(transT>=0){const u=(now-transT)/450;if(u>=1)transT=-1;else{for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){if(bay(x>>1,y>>1)>u){const i=y*BW+x;buf[i]=prevBuf[i];}}}}
 ctx.putImageData(imgD,0,0);drawLabels();if(!SHOT||true)requestAnimationFrame(frame);}
function drawLabels(){const W=innerWidth,H=innerHeight;octx.clearRect(0,0,W,H);if(!showLabels)return;const s=W/BW;
 octx.font='700 '+(W<500?10:12)+'px "PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';octx.textAlign='center';octx.textBaseline='middle';
 for(const l of LBL){const p=P(l.x,l.y,l.z);const x=p[0]*PS,y=p[1]*PS;if(x<-40||x>W+40||y<-20||y>H+20)continue;const w=octx.measureText(l.t).width+10,h=W<500?15:18;
  octx.fillStyle='#0d1119';octx.fillRect(Math.round(x-w/2)-1,Math.round(y-h/2)-1,Math.round(w)+2,h+2);octx.fillStyle=night?'#2a2440':'#1d2534';octx.fillRect(Math.round(x-w/2),Math.round(y-h/2),Math.round(w),h);
  octx.fillStyle='#fff4dc';octx.fillText(l.t,Math.round(x),Math.round(y)+1);}}

/* ================= input ================= */
function startTrans(){if(!buf||SHOT)return;prevBuf=frameBuf.slice();transT=performance.now();}
function setLevel(l){if(l===level)return;startTrans();level=l;CC.clear();build();syncUI();}
function setNight(n){startTrans();night=n;CC.clear();build();syncUI();}
function setRot(r){const d=r>rot?1:-1;rot=(r+4)&3;rotFrom=ang;angT+=d*Math.PI/2;rotStart=performance.now();}
function syncUI(){document.querySelectorAll('[data-lv]').forEach(b=>b.classList.toggle('on',+b.dataset.lv===level));document.getElementById('bn').classList.toggle('on',night);
 document.getElementById('bn').textContent=night?'☀ 白天 N':'☾ 夜晚 N';document.getElementById('bl').classList.toggle('on',showLabels);}
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lv));
document.getElementById('bn').onclick=()=>setNight(!night);document.getElementById('bq').onclick=()=>setRot(rot+1);document.getElementById('be').onclick=()=>setRot(rot-1);
document.getElementById('bl').onclick=()=>{showLabels=!showLabels;syncUI();};
addEventListener('keydown',e=>{const kk=e.key.toLowerCase();if(kk==='1'||kk==='2'||kk==='3')setLevel(+kk);if(kk==='n')setNight(!night);if(kk==='q')setRot(rot+1);if(kk==='e')setRot(rot-1);if(kk==='l'){showLabels=!showLabels;syncUI();}});
const ptrs=new Map();let pinch0=null;
function zoomAt(f,cx,cy){const nk=clamp(k*f,1.0,14);const bx=cx/PS,by=cy/PS;const ox=BW/2+panX,oy=OY0+panY;panX=Math.round(bx-(bx-ox)*nk/k-BW/2);panY=Math.round(by-(by-oy)*nk/k-OY0);k=nk;dirty=true;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(ptrs.size===1){panX+=dx/PS;panY+=dy/PS;dirty=true;p.x=e.clientX;p.y=e.clientY;}
 else if(ptrs.size===2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){zoomAt(d/pinch0,(a.x+b.x)/2,(a.y+b.y)/2);}pinch0=d;}});
const up=e=>{ptrs.delete(e.pointerId);pinch0=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY);},{passive:false});
addEventListener('resize',()=>{resize();});
resize();build();syncUI();requestAnimationFrame(frame);
window.__ready=true;
</script>
