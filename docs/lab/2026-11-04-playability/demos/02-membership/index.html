<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>02 会籍设计：超卖的艺术</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#2a1f2b;overflow:hidden;touch-action:none;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#2a1f2b}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start}
#phone{position:relative;width:390px;height:844px;overflow:hidden;background:#e8c88a;transform-origin:top center;flex:none}
#cv{position:absolute;left:0;top:0;width:390px;height:844px;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
.btn{display:block;width:100%;min-height:50px;border:3px solid #2a1f2b;border-radius:12px;background:#f2b134;font-weight:900;font-size:17px;box-shadow:0 4px 0 #2a1f2b;margin-top:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2a1f2b}
.btn.alt{background:#fff4dc}
.btn.grn{background:#7fcf8a}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.75;margin-top:1px}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:4px;padding:3px 4px;z-index:5}
#hud .ico{width:44px;height:44px;flex:none;border:3px solid #2a1f2b;border-radius:10px;background:#fff4dc;font-weight:900;font-size:18px;box-shadow:0 2px 0 #2a1f2b}
.stat{flex:1;min-width:0;height:44px;background:#fff4dc;border:2px solid #5a3d2b;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stat small{font-size:10px;font-weight:700;color:#8a6a4a;line-height:1}
.stat b{font-size:15px;font-weight:900;line-height:1.15}
.stat .g{position:absolute;left:3px;right:3px;bottom:2px;height:4px;background:#e6d6b5;border-radius:2px;overflow:hidden}
.stat .g i{display:block;height:100%;width:0;background:#3fae5a;transition:width .3s,background .3s}
.bump{animation:bump .35s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
/* panel */
#panel{position:absolute;left:0;right:0;bottom:0;background:#fff4dc;border-top:3px solid #5a3d2b;border-radius:16px 16px 0 0;padding:8px 8px 10px;z-index:4;box-shadow:0 -3px 0 rgba(42,31,43,.25)}
.ptitle{font-weight:900;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ptitle span{font-size:11px;color:#8a6a4a;font-weight:700}
/* cards */
.cards{display:flex;gap:6px}
.card{flex:1;min-width:0;border:3px solid #2a1f2b;border-radius:10px;background:#fffaf0;box-shadow:0 3px 0 #2a1f2b;overflow:hidden;position:relative;transition:opacity .2s,transform .15s}
.card .ch{height:40px;display:flex;align-items:center;justify-content:space-between;padding-left:8px;font-weight:900;font-size:15px;border-bottom:3px solid #2a1f2b;position:relative}
.card .ch .x{width:40px;height:40px;font-size:15px;font-weight:900;opacity:.7}
.card .ch .pin{position:absolute;left:50%;top:-3px;width:8px;height:8px;margin-left:-4px;background:#d94a3a;border:2px solid #2a1f2b;border-radius:50%}
.zone{min-height:50px;border-top:2px dashed #d9c09a;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;position:relative;padding:2px}
.zone:first-of-type{border-top:none}
.zone small{font-size:10px;color:#8a6a4a;font-weight:700;line-height:1.1}
.zone.drag::before,.zone.drag::after{position:absolute;top:50%;margin-top:-8px;font-size:11px;color:#c9a36a;font-weight:900}
.zone.drag::before{content:"◀";left:3px}.zone.drag::after{content:"▶";right:3px}
.zone .big{font-size:24px;font-weight:900;line-height:1.05}
.zone .balls{font-size:10px;letter-spacing:-1px;color:#9ad14b;text-shadow:0 0 0 #2a1f2b;line-height:1.2}
.zone .balls i{font-style:normal;color:#d9c09a}
.zone .hv{font-size:14px;font-weight:900}
.stamp{border:2.5px solid currentColor;border-radius:6px;padding:1px 5px;font-weight:900;font-size:12px;line-height:1.15;text-align:center;transform:rotate(-7deg);color:#3fae5a}
.stamp.no{color:#d94a3a;transform:rotate(5deg)}
.stamp.thunk{animation:thunk .3s}
@keyframes thunk{0%{transform:scale(1.8) rotate(-15deg);opacity:.2}70%{transform:scale(.92) rotate(-7deg)}100%{transform:scale(1) rotate(-7deg)}}
.fine{min-height:46px}
.fine .fp{font-size:10px;font-weight:700;color:#5a3d2b;text-align:center;line-height:1.2}
.fine .fp.trap{color:#b02a1a}
.fine .fp.gift{color:#2e8a48}
.card.locked{opacity:.4;filter:grayscale(.7)}
.card.sel{transform:translateY(-4px)}
.card.empty{display:flex;align-items:center;justify-content:center;border-style:dashed;color:#8a6a4a;font-weight:900;font-size:15px;min-height:236px;background:rgba(255,250,240,.6);box-shadow:none;flex-direction:column}
.card.empty b{font-size:30px;line-height:1}
.card.nope{animation:nope .3s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.prev{display:flex;gap:4px;margin-bottom:6px}
.pv{flex:1;min-width:0;background:#fffaf0;border:2px solid #d9c09a;border-radius:8px;display:flex;align-items:center;gap:2px;padding:2px 3px;height:46px}
.pv canvas{width:20px;height:36px;image-rendering:pixelated;flex:none}
.pv div{min-width:0;line-height:1.15}
.pv b{display:block;font-size:11px;white-space:nowrap}
.pv span{display:block;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.pop{animation:bump .3s}
.est{font-size:11.5px;font-weight:800;background:#2a1f2b;color:#fff4dc;border-radius:8px;padding:5px 8px;margin-top:8px;line-height:1.35}
.est .r{color:#ff8a78}.est .y{color:#f2b134}.est .gr{color:#8fe39b}
/* week panel */
.clock{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;margin-bottom:4px}
.clock .t{background:#2a1f2b;color:#f2b134;border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}
.clock .tot{margin-left:auto;font-size:12px;color:#2e8a48}
.clock button{min-width:56px;height:44px;border:3px solid #2a1f2b;border-radius:10px;background:#fff;font-weight:900;font-size:14px;box-shadow:0 2px 0 #2a1f2b}
.chart{position:relative;height:108px;display:flex;gap:4px;padding:0 2px;border-bottom:2px solid #5a3d2b;margin-top:2px}
.chart .line{position:absolute;left:0;right:0;top:50%;border-top:2px dashed #d94a3a;pointer-events:none}
.chart .line span{position:absolute;right:2px;top:-14px;font-size:10px;color:#d94a3a;font-weight:900}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;border-radius:6px 6px 0 0}
.col.now{background:rgba(242,177,52,.25)}
.col .bars{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.col .bars i{display:block;width:40%;border:2px solid #2a1f2b;border-bottom:none;border-radius:3px 3px 0 0;height:0;transition:height .35s}
.col .bars i.d{background:#e8c88a}
.col .bars i.p{background:#3fae5a}
.col .rain{position:absolute;top:2px;font-size:13px}
.days{display:flex;gap:4px;padding:0 2px;margin-top:2px}
.days span{flex:1;text-align:center;font-size:11px;font-weight:900}
.legend{font-size:11px;font-weight:700;color:#5a3d2b;margin-top:5px;line-height:1.4}
.legend i{display:inline-block;width:10px;height:10px;border:2px solid #2a1f2b;vertical-align:-1px;margin-right:2px}
.mini{display:flex;gap:5px;margin-top:6px}
.mini div{flex:1;border:2px solid #2a1f2b;border-radius:8px;padding:3px 5px;font-size:11px;font-weight:800;line-height:1.3}
/* decision */
.report{font-size:12px;font-weight:800;line-height:1.5;background:#fffaf0;border:2px solid #d9c09a;border-radius:8px;padding:5px 8px}
.report .r{color:#d94a3a}.report .gr{color:#2e8a48}
.ev{margin-top:7px;border:3px solid #2a1f2b;border-radius:12px;background:#fff;box-shadow:0 3px 0 #2a1f2b;padding:8px;position:relative}
.ev .who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#8a6a4a}
.ev .who canvas{width:20px;height:36px;image-rendering:pixelated}
.ev h3{font-size:16px;margin:2px 0 3px}
.ev p{font-size:12.5px;line-height:1.45;font-weight:600}
.opt{display:block;width:100%;text-align:left;min-height:48px;border:2.5px solid #2a1f2b;border-radius:10px;background:#fff4dc;padding:5px 9px;margin-top:6px;font-weight:900;font-size:14px;box-shadow:0 2px 0 #2a1f2b}
.opt small{display:block;font-size:11px;font-weight:700;color:#5a3d2b}
.opt:active{transform:translateY(2px);box-shadow:none}
/* overlays */
.ov{position:absolute;inset:0;z-index:10;background:rgba(42,31,43,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.box{background:#fff4dc;border:3px solid #5a3d2b;border-radius:16px;padding:16px;width:100%;max-height:100%;overflow:auto;box-shadow:0 5px 0 #2a1f2b}
.box h1{font-size:24px;line-height:1.2}
.box h2{font-size:15px;margin:10px 0 4px}
.box p,.box li{font-size:13.5px;line-height:1.55;font-weight:600}
.box ul{padding-left:18px}
.box .tag0{display:inline-block;background:#f2b134;border:2px solid #2a1f2b;border-radius:6px;font-size:11px;font-weight:900;padding:1px 6px;margin-bottom:6px}
.endrow{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding:5px 0;border-bottom:2px dashed #d9c09a}
.endtitle{font-size:28px;font-weight:900;color:#a8453a;text-align:center;margin:8px 0 2px}
.endq{text-align:center;font-size:14px;font-weight:700;margin-bottom:8px}
.news{position:absolute;left:18px;right:18px;top:150px;z-index:9;background:#f4f1e8;border:3px solid #2a1f2b;padding:10px 12px;box-shadow:0 6px 0 #2a1f2b;transform:rotate(-3deg);animation:newsin .5s}
.news .mast{font-family:serif;font-weight:900;font-size:22px;border-bottom:3px double #2a1f2b;text-align:center}
.news .hl{font-size:19px;font-weight:900;line-height:1.3;margin-top:6px;color:#b02a1a}
.news p{font-size:12px;margin-top:4px;font-weight:600}
@keyframes newsin{0%{transform:rotate(-200deg) scale(.1)}100%{transform:rotate(-3deg) scale(1)}}
/* fx */
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid #2a1f2b;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:800;white-space:nowrap;z-index:2}
.bub.bad{background:#ffe1dc;color:#a02010}
.bub.good{background:#e3f7e3;color:#1f6e34}
.flt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:15px;white-space:nowrap;animation:up 1.3s forwards;text-shadow:-2px 0 #2a1f2b,2px 0 #2a1f2b,0 -2px #2a1f2b,0 2px #2a1f2b;z-index:3}
.flt.g{color:#7ff08f}.flt.r{color:#ff7a68}.flt.y{color:#f2d15a}.flt.w{color:#fff}
.flt.big{font-size:22px}
@keyframes up{0%{opacity:0;margin-top:6px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-34px}}
.tag{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid #d94a3a;color:#d94a3a;font-size:10px;font-weight:900;padding:0 3px;white-space:nowrap}
.tag.trap{border-color:#5a3d2b;color:#5a3d2b;background:#ffe9a8}
#banner{position:absolute;left:0;right:0;top:250px;text-align:center;z-index:8;pointer-events:none;font-size:34px;font-weight:900;color:#fff4dc;text-shadow:-3px 0 #2a1f2b,3px 0 #2a1f2b,0 -3px #2a1f2b,0 3px #2a1f2b;opacity:0}
#banner.on{animation:ban 1.6s}
#banner small{display:block;font-size:15px}
@keyframes ban{0%{opacity:0;transform:scale(2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0}
#flash.on{animation:fl .4s}
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#2a1f2b;color:#fff4dc;font-size:13px;font-weight:800;padding:6px 12px;border-radius:10px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap"><div id="phone">
  <canvas id="cv" width="195" height="422"></canvas>
  <div id="fx"></div>
  <div id="hud">
    <button class="ico" id="mute">♪</button>
    <div class="stat"><small>会员数</small><b id="hMem">0</b></div>
    <div class="stat"><small>周收入</small><b id="hRev">$0</b></div>
    <div class="stat"><small>晚高峰</small><b id="hPeak">—</b><div class="g"><i id="hPeakG"></i></div></div>
    <div class="stat"><small>口碑</small><b id="hRep">50</b><div class="g"><i id="hRepG"></i></div></div>
    <button class="ico" id="help">?</button>
  </div>
  <div id="panel"></div>
  <div id="banner"></div>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="ovl"></div>
</div></div>
<script>
'use strict';
// ================= 基础 =================
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast')?8:1, AUTO=Q.has('auto'), GREEDY=Q.get('auto')==='greedy';
const SEED=Number(Q.get('seed'))||(Date.now()%1e9);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(SEED), artR=mulberry32(7);
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=id=>document.getElementById(id);
const money=v=>(v<0?'−$':'$')+Math.round(Math.abs(v)).toLocaleString('en-US');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const phone=$('phone'), fx=$('fx'), panel=$('panel');
function fit(){const s=Math.min(innerWidth/390,innerHeight/844);phone.style.transform=s<1?`scale(${s})`:'';phone.style.marginTop=s<1?'0':Math.max(0,(innerHeight-844)/2)+'px'}
addEventListener('resize',fit);fit();

// ---------- 声音 ----------
let AC=null,muted=false;
function tone(f,d,type='square',v=.06,f2=null,delay=0){
  if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
const SND={
  tick:p=>tone(500+p*6,.035,'square',.035),
  coin:()=>{tone(988,.07,'square',.05);tone(1319,.12,'square',.05,null,.07)},
  bad:()=>tone(180,.22,'sawtooth',.06,110),
  pop:()=>tone(660,.06,'sine',.08,990),
  stamp:()=>{tone(90,.12,'square',.09,60);tone(220,.05,'triangle',.06)},
  news:()=>{tone(523,.15,'square',.06);tone(392,.15,'square',.06,null,.15);tone(262,.4,'sawtooth',.07,180,.3)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.05,null,i*.1)),
  door:()=>tone(300,.08,'triangle',.06,200),
};
$('mute').onpointerup=()=>{muted=!muted;$('mute').textContent=muted?'×':'♪';if(!muted)SND.pop()};

// ---------- 反馈 ----------
function toPx(x,y){return[x*2,y*2]}
function floatText(t,x,y,cls='g'){const d=document.createElement('div');d.className='flt '+cls;d.textContent=t;const[px,py]=toPx(x,y);d.style.left=clamp(px,40,350)+'px';d.style.top=py+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1350)}
function floatAt(t,el,cls='g'){const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect(),s=p.width/390;floatText(t,((r.left+r.width/2-p.left)/s)/2,((r.top-p.top)/s)/2,cls)}
let bubCount=0;
function bubble(e,t,ms=1600,cls='',force=false){
  if(!force&&bubCount>6)return;if(e.bub)e.bub.el.remove(),bubCount--;
  const d=document.createElement('div');d.className='bub '+cls;d.textContent=t;fx.appendChild(d);bubCount++;
  e.bub={el:d,t:ms};placeBub(e);
}
function placeBub(e){const[px,py]=toPx(e.x,e.y-17);e.bub.el.style.left=clamp(px,48,342)+'px';e.bub.el.style.top=py+'px'}
function tagOn(e,t,cls=''){const d=document.createElement('div');d.className='tag '+cls;d.textContent=t;fx.appendChild(d);e.tag=d}
function shake(){phone.classList.remove('shake');void phone.offsetWidth;phone.classList.add('shake')}
function flash(c='#fff'){const f=$('flash');f.style.background=c;f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function banner(t,sub=''){const b=$('banner');b.innerHTML=t+(sub?`<small>${sub}</small>`:'');b.classList.remove('on');void b.offsetWidth;b.classList.add('on')}
let toastT=0;function toast(t){const d=$('toast');d.textContent=t;d.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>d.style.opacity=0,1500)}
function bumpEl(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
const hudLast={};
function setStat(id,t){if(hudLast[id]===t)return;hudLast[id]=t;const el=$(id);el.textContent=t;bumpEl(el)}

// ================= 画面 =================
const INK='#2a1f2b';
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=195,H=422;
const BODY=['..OOOO..','.OHHHHO.','.OHSSSO.','.OSKSKO.','.OSSSSO.','..OTTO..','.OTTTTO.','OSTTTTSO','OSOTTOSO','.OTTTTO.'];
const LEGS=[['.OPPPPO.','.OPOOPO.','.OPOOPO.','.OO..OO.'],['.OPPPPO.','.OPOOPO.','OPO..OPO','OO....OO'],['.OPPPPO.','..OPPO..','..OPPO..','..OOOO..']];
const KID=['.OOOO.','OHHHHO','OSKSKO','.OSSO.','OTTTTO','OTTTTO','.OPPO.','.OPPO.','.O..O.'];
const ICONS={
  sun:['...Y...','.Y.Y.Y.','..YYY..','YYYYYYY','..YYY..','.Y.Y.Y.','...Y...'],
  moon:['..MMM..','.MM....','MM.....','MM.....','MM.....','.MM....','..MMM..'],
  kid:['..HHH..','.HHHHH.','.SSSSS.','.SKSKS.','.SSSSS.','..SSS..','.CCCCC.'],
  fire:['...R...','..RR...','..RRR.R','.RRYRRR','.RYYYR.','.RYYYR.','..RRR..'],
  angry:['..R.R..','.RR.RR.','RR...RR','.......','RR...RR','.RR.RR.','..R.R..'],
  happy:['.YYYYY.','YYYYYYY','YKYYYKY','YYYYYYY','YKYYYKY','YYKKKYY','.YYYYY.'],
  meh:['.YYYYY.','YYYYYYY','YKYYYKY','YYYYYYY','YYYYYYY','YKKKKKY','.YYYYY.'],
  heart:['.RR.RR.','RRRRRRR','RRRRRRR','.RRRRR.','..RRR..','...R...','.......'],
  dots:['.......','.......','.......','K.K.K..','.......','.......','.......'],
  zz:['KKKK...','..K....','.K.....','KKKK...','....KKK','.....K.','....KKK'],
  lock:['..KKK..','.K...K.','.K...K.','YYYYYYY','YYYKYYY','YYYKYYY','YYYYYYY'],
};
const ICOL={Y:'#f2b134',M:'#e0a020',R:'#d94a3a',K:INK,H:'#6a4a2a',S:'#f1c27d',C:'#4fc3d9'};
function px(g,x,y,c){g.fillStyle=c;g.fillRect(x,y,1,1)}

function schedule(m){
  const c=G.cards[m.card],S=SEGS[m.seg];m.sched=[];
  const n=m.seg==='fan'?Math.min(c.hours,8):Math.min(c.hours,S.hours);
  const used=new Set();
  for(let k=0;k<n;k++){let d,b;for(let t=0;t<4;t++){
    if(m.seg==='old'){d=ri(0,4);b='day'}
    else if(m.seg==='work'){d=ri(0,4);b='peak'}
    else if(m.seg==='par'){d=ri(5,6);b='day'}
    else{d=ri(0,6);b=c.peak&&rnd()<.62?'peak':'day'}
    if(!used.has(d+b))break}
    used.add(d+b);if(m.seg==='work'&&!c.peak)continue;m.sched.push({d,b});}

  <p style="margin-top:6px">四种客人会来挑卡。之后快进 6 周：<b>卖得越多钱越多，但晚上只有 3 片场。</b>挤爆了就有人骂、有人退会；小字条款能把人留住，但口碑会掉。</p>
  <p style="margin-top:6px">每周日晚上做一个决定：改一张卡，或者处理一件事。</p>
  <button class="btn" id="start">开始设计 ▶</button></div></div>`;
  $('start').onclick=()=>{SND.pop();$('ovl').innerHTML='';G.cards=[{fee:90,hours:4,peak:true,fine:'none'}];openEditor('design');updHud()};
  if(AUTO)setTimeout(()=>{$('start').onclick();if(GREEDY)G.cards[0]={fee:80,hours:6,peak:true,fine:'notice'};else G.cards.push({fee:50,hours:3,peak:false,fine:'notice'});renderCards();updPreview();$('go').onclick()},300);
}
$('help').onpointerup=()=>{const o=$('ovl');if(o.querySelector('#helpbox')){o.innerHTML=G._ovl||'';if(G._ovl&&o.querySelector('#again'))o.querySelector('#again').onclick=()=>location.reload();if(o.querySelector('#start'))showTitle();return}
  G._ovl=o.innerHTML;o.innerHTML=`<div class="ov" id="helpbox"><div class="box"><h1 style="font-size:20px">设计说明</h1>
  <h2>在测什么</h2><p>支柱 A"奸商"：玩家自己定"卖什么"。一张会员卡 = 价钱 × 包含什么 × 小字。核心张力是 <b>会员数 × 月费</b> 对 <b>晚高峰 3 片场的容量</b>。卖得越多钱越多，但卖超了，晚上就挤爆。</p>
  <h2>取舍在哪</h2><ul>
  <li><b>月费</b>：贵 = 每人多赚，但怕贵的老人和一部分上班族直接走。</li>
  <li><b>场时</b>：多 = 发烧友愿意付高价，但他们真的会把场时用完，挤占晚上。</li>
  <li><b>晚高峰章</b>：盖了 = 上班族才肯买（他们最多），但晚上 17–20 只有 6 个位子。</li>
  <li><b>小字</b>：自动续费/提前 3 个月退会 = 想走的人走不了、继续付钱，但口碑掉、可能上报纸；雨天不退 = 雷雨天不用退款，但会员会火；送毛巾 = 每人 $3/周，满意度和口碑涨一点。</li>
  <li><b>每周一个决定</b>：改卡就不能处理事件（事件按"不理"结算）；处理事件就得接受这周的卡。</li></ul>
  <h2>北极星</h2><p>20–40 秒：每周日一个决定。3–5 分钟：开业入会潮、挤爆退会潮、上报纸。一局：你是"超卖之王"还是"良心总监"。</p>
  <p style="margin-top:8px;color:#8a6a4a">再点一次 ? 关掉</p></div></div>`;
  o.querySelector('#helpbox').onpointerup=()=>$('help').onpointerup();};

// ================= 主循环 =================
let lastT=performance.now();
function frame(now){
  const rdt=Math.min(50,now-lastT);lastT=now;const sp=FAST*(G.phase==='week'?G.speed:1);const dt=rdt*sp;
  for(const t of timers)t.t-=dt;const due=timers.filter(t=>t.t<=0);timers=timers.filter(t=>t.t>0);due.forEach(t=>t.fn());
  if(G.phase==='signup')tickSignup(dt);
  if(G.phase==='week'){
    const f0=G.tday/DAY_MS;G.tday+=dt;const f=G.tday/DAY_MS;
    if(!G.bk.d1&&f>=.02){G.bk.d1=1;startBucket('day')}
    if(!G.bk.d2&&f>=.31){G.bk.d2=1;endBucket()}
    if(!G.bk.p1&&f>=.34){G.bk.p1=1;startBucket('peak')}
    if(!G.bk.p2&&f>=.76){G.bk.p2=1;endBucket()}
    if(f>=1)endDay();
    updClock();
  }
  updEnts(dt);render(rdt*sp);
  requestAnimationFrame(frame);
}
showTitle();updHud();requestAnimationFrame(frame);
</script>
